name: Develop

on:
  push:
    branches: [develop]

# Cancel any in-flight run for the same branch when a new push arrives.
concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed by softprops/action-gh-release to upsert the pre-release
  packages: write   # needed to push to ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 – build and publish the multi-arch Docker image to GHCR.
  #
  # Uses deploy/Dockerfile (cross-compile, no npm needed – web/dist is committed).
  # Runs as root so burrowd can bind :80/:443 for built-in ACME.
  # ---------------------------------------------------------------------------
  image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf  # v3.2.0

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ankoehn/burrow:develop
          # provenance=false keeps a flat, single-list manifest (no attestation
          # index wrapper) so the tag is directly pullable on older clients.
          provenance: false

  # ---------------------------------------------------------------------------
  # Job 2 – build client (burrow) and server (burrowd) binaries for
  # Linux amd64/arm64 and Windows amd64, attach them to a rolling pre-release.
  #
  # goreleaser is run with --snapshot --clean so it generates archives locally
  # without hitting any remote (no ghcr push, no cosign, no announce).
  # The --skip flags suppress the pipeline steps that need credentials or a
  # real git tag: docker (dockers_v2 push), sign (cosign), publish (GitHub
  # release via goreleaser itself — we use action-gh-release instead so we can
  # control the exact tag name "develop").
  # ---------------------------------------------------------------------------
  binaries:
    name: Build & publish binaries pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # goreleaser needs full history for the changelog

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: "1.25"

      # goreleaser's before hook runs "cd web && npm ci && npm run build".
      # web/dist is committed, so the build succeeds even if the hook is
      # skipped; but we run it to ensure the snapshot archives are byte-for-byte
      # identical to a real release build.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"

      - uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf  # v6.1.0
        with:
          # Pin the exact goreleaser version (NOT "~> v2"): v2.16.0 changed the
          # valid --skip keys, which instant-fails the args below. 2.15.4 is the
          # version this pipeline is verified against. Bump deliberately.
          version: "2.15.4"
          # --snapshot   : no real git tag required; embeds a pseudo-version
          # --clean      : wipe dist/ before building
          # --skip=docker: skip dockers_v2 (no QEMU/buildx, no ghcr push)
          # --skip=sign  : skip cosign (no OIDC token needed)
          # --skip=publish: skip goreleaser's own GitHub release step
          args: release --snapshot --clean --skip=docker,sign,publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upsert the rolling "develop" pre-release, replacing all previous assets.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: develop
          name: "develop (rolling pre-release)"
          prerelease: true
          # Replace all previously uploaded assets on each push so the tag
          # always reflects the latest develop commit.
          fail_on_unmatched_files: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
