name: Develop

on:
  push:
    branches: [develop]

# Cancel any in-flight run for the same branch when a new push arrives.
concurrency:
  group: develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed by softprops/action-gh-release to upsert the pre-release
  packages: write   # needed to push to ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 – build and publish the multi-arch Docker image to GHCR (:develop).
  #
  # Uses deploy/Dockerfile (cross-compile, no npm needed – web/dist is committed).
  # Runs as root so burrowd can bind :80/:443 for built-in ACME.
  # ---------------------------------------------------------------------------
  image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf  # v3.2.0

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/burrow:develop
          # provenance=false keeps a flat, single-list manifest (no attestation
          # index wrapper) so the tag is directly pullable on older clients.
          provenance: false

  # ---------------------------------------------------------------------------
  # Job 2 – build client (burrow) + server (burrowd) binaries for Linux,
  # Windows and macOS and attach them to a rolling "develop" pre-release.
  #
  # A plain `go build` matrix — deliberately NOT goreleaser: web/dist is
  # committed so the binary embeds the UI with no npm step, and there is no
  # release-tool version/flag drift to break CI. Archive names are stable so
  # each develop push overwrites the same assets (clean rolling channel).
  # ---------------------------------------------------------------------------
  binaries:
    name: Build & publish binaries pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: "1.25"

      - name: Build burrow + burrowd archives
        run: |
          set -euo pipefail
          mkdir -p dist
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/ankoehn/burrow/internal/version.Version=develop \
            -X github.com/ankoehn/burrow/internal/version.Commit=${GITHUB_SHA} \
            -X github.com/ankoehn/burrow/internal/version.Date=${DATE}"
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            echo "::group::build ${os}/${arch}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o "burrow${ext}"  ./cmd/client
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o "burrowd${ext}" ./cmd/server
            if [ "$os" = "windows" ]; then
              zip -qj "dist/burrow_${os}_${arch}.zip"  "burrow${ext}"
              zip -qj "dist/burrowd_${os}_${arch}.zip" "burrowd${ext}"
            else
              tar -czf "dist/burrow_${os}_${arch}.tar.gz"  "burrow${ext}"
              tar -czf "dist/burrowd_${os}_${arch}.tar.gz" "burrowd${ext}"
            fi
            rm -f "burrow${ext}" "burrowd${ext}"
            echo "::endgroup::"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: develop
          name: "develop (rolling pre-release)"
          prerelease: true
          # Stable archive names mean each push replaces the same assets.
          fail_on_unmatched_files: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
