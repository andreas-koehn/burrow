name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: "1.25"
      - run: go mod download
      # ./web is non-recursive: excludes the npm-generated web/node_modules
      # tree (gitignored, ships stray .go) while covering the web embed pkg.
      - run: go vet ./cmd/... ./internal/... ./web
      - run: go test -race -cover ./cmd/... ./internal/... ./web

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86  # v6.1.1
        with:
          # Pin the linter to a specific v2 release so CI is reproducible and
          # always runs golangci-lint v2 (which the v2-schema .golangci.yml
          # requires). Matches the version used to validate the config locally.
          version: v2.12.2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: "1.25"
      - run: make build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code web/dist
        working-directory: ${{ github.workspace }}

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: "1.25"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Build the SPA so the Go embed picks up the freshly built dist/
      - run: npm run build
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  fuzz-webhook-template:
    # 60-second fuzz of the webhook payload template renderer. Triggered on
    # PRs that touch internal/webhook/template/ to keep the main PR cycle
    # fast; longer fuzz runs (e.g. 5–30 min) belong in a nightly cron.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a  # v5.2.0
        with:
          go-version: "1.25"
      - run: go test -fuzz=FuzzTemplateRender -fuzztime=60s ./internal/webhook/template/

  e2e-dataplane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Tier-1 data-plane gates: minimal stack, then full stack (curl only, no browser).
      - run: bash test/integration/smoke.sh
      - run: bash test/integration/smoke-full.sh

  e2e-acme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # Tier-1 ACME gate: built-in CertMagic ACME issuance against Pebble (LE's
      # test ACME server) + single-origin /t/{id} path routing over the issued
      # cert. curl/openssl only, no browser. The script builds the relay from
      # source (so it exercises this branch's ACME code), brings up the Pebble
      # stack, asserts, and tears down (down -v) on success or failure.
      - run: bash test/integration/acme.sh

  e2e-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json
      - run: bash test/e2e/run.sh
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: e2e-ui-report
          path: |
            test/e2e/playwright-report/
            test/e2e/test-results/
          retention-days: 7
