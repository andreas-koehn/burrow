openapi: 3.0.3
info:
  title: Burrow JSON API
  description: |
    The hand-written canonical OpenAPI v3 description of the Burrow JSON API
    (unified across v0.2.0, v0.3.0, and v0.4.0).

    Coverage is locked by `TestOpenAPI_RouteCoverage` in
    `internal/api/openapi_test.go`: every route the chi mux answers must
    appear in this document or the build fails. Health probes (`/healthz`,
    `/readyz`) and the doc-serving endpoints (`/api/v1/openapi.{yaml,json}`)
    are excluded by convention.

    Every operation has an `operationId`: lowerCamelCase, resource first,
    then action (`servicesList`, `serviceGet`, `providerCreate`). An id is a
    public name. Tools and generated clients are named after it, so an id is
    added and never changed. Request and response schemas are compared with
    the Go types of the handlers by the tests in
    `internal/api/openapi_shapes_test.go`.

    Three extension fields are used on operations. `x-burrow-mcp: false`
    keeps an operation out of the management MCP server. `x-burrow-permission`
    says who may call an operation: `kind` is `public` (no credentials),
    `self` (any signed-in caller), `needs` (one of `any_of`; with
    `every: true` every permission there is) or `dashboard` (a dashboard
    session with one of `any_of`; an automation token gets 403). It mirrors
    the relay's route table, and a test keeps the two equal.
    `x-burrow-destructive: true` marks an operation that is not a DELETE
    but removes or revokes something; MCP clients must confirm it.
  version: 0.4.0
  license:
    name: MIT
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost:8080
        description: Burrow control-plane host.

tags:
  - name: auth
    description: Session login, logout, password change, passkey enrolment.
  - name: users
    description: Admin user management.
  - name: roles
    description: Roles + permission catalog (editable custom roles).
  - name: sessions
    description: Per-user session list / revoke.
  - name: tokens
    description: Personal client tokens (burrowc connect).
  - name: tunnels
    description: Live tunnels owned by the caller.
  - name: services
    description: Durable per-service config (access mode, api-keys, policy, ip/geo, inspector, cache).
  - name: cache
    description: Exact-match prompt cache (settings, stats, purge).
  - name: redaction
    description: PII / secret redaction rules + preview.
  - name: guardrails
    description: Prompt-injection guardrails settings.
  - name: models
    description: AI providers, synthetic models and gateway keys.
  - name: rate-limits
    description: Quota + rate-limit CRUD and usage.
  - name: cost
    description: Cost pricing + budgets + summary / export.
  - name: inspector
    description: Per-service request inspector (ring buffer, replay, SSE).
  - name: audit
    description: Audit log events + chain verify / export / fingerprint.
  - name: webhooks
    description: Outbound HMAC webhooks (CRUD + deliveries + test/pause/resume).
  - name: automation
    description: Bearer-token automation API.
  - name: backups
    description: Backup / restore JSON API.
  - name: geo
    description: Global geo lookup status.
  - name: settings
    description: Admin settings (config + SMTP test + retention).
  - name: clients
    description: Live client (control session) overview.
  - name: events
    description: Server-sent events stream (dashboard refresh).
  - name: metrics
    description: Prometheus 0.0.4 scrape endpoint.
  - name: openapi
    description: OpenAPI spec discovery and embedded browser viewer.
  - name: database
    description: Database backend status (driver, connection URL, alpha flag).
  - name: oauth
    description: OAuth 2.1 authorization server for MCP clients (consent, connected apps, clients).

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: __Host-burrow_session
      description: |
        Session cookie issued by POST /api/v1/auth/login. On an HTTPS
        deployment (Secure cookies) it is `__Host-burrow_session`, and the
        CSRF cookie `__Host-burrow_csrf`: a `__Host-` cookie cannot carry a
        Domain, so no other host of the site can set one for the dashboard.
        Over plain http (development) the names are `burrow_session` and
        `burrow_csrf`. On HTTPS the bare `burrow_session` of an earlier
        version is still accepted while the `__Host-` one is absent, but only
        for a session created before the first start of v0.12.1 (setting
        auth.bare_cookie_cutoff). State-changing
        cookie-authed requests MUST also send the CSRF cookie's value as the
        double-submit header (`X-CSRF-Token`).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bua_<token>
      description: |
        Automation bearer token (`Authorization: Bearer bua_...`). Bypasses
        CSRF (the token IS the CSRF defense). Permissions are the
        intersection of the user's current role and the set declared at
        mint time.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit token for cookie-authed state-changing requests.
        Value mirrors the CSRF cookie (`__Host-burrow_csrf`, or `burrow_csrf`
        over plain http) that came with the session cookie.
    GatewayKey:
      type: http
      scheme: bearer
      bearerFormat: bgw_<key>
      description: |
        AI gateway key (`Authorization: Bearer bgw_...`, or the same value
        in `x-api-key`). Used by the model and tool endpoints of the
        gateway only; it is never accepted by /api/v1.
    OAuthAccessToken:
      type: http
      scheme: bearer
      bearerFormat: boa_<token>
      description: |
        OAuth access token from Burrow's authorization server
        (`Authorization: Bearer boa_...`, never in `x-api-key`), issued for
        exactly one MCP endpoint (its resource): `/mcp/burrow`, `/mcp` or
        `/mcp/<slug>`, and accepted there only. Each use checks the token,
        its grant (not revoked), the endpoint, and the user as they are now
        (not suspended; at a gateway endpoint the role must still grant
        `ai:configure:own` or `ai:configure:any`). It is never accepted by
        /api/v1.

  schemas:
    AIProvider:
      type: object
      description: >
        One model provider: a slug under which a model backend is served at
        base_url. Identity fields come from the providers table;
        api_key_count, status and the 24h counts are read live from the
        backing service.
      required: [slug, name, kind, api_format, service_id, base_url, upstream_base_url, credential_slot, credential_present, credential_slots, breaker_open, billing, supports_responses, max_concurrent, in_use, model_count, model_alias, concrete_model, backend_type, api_key_count, requests_24h, cache_hits_24h, latency_p95_ms, status, client_session_id, state, last_seen, last_client]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
        name: { type: string }
        kind: { type: string, enum: [tunnel, direct] }
        api_format: { type: string, enum: [openai, anthropic] }
        service_id:
          type: string
          description: >
            The backing service. For a direct provider this is its own row
            of type "direct", named like the provider; it holds the
            provider's API keys and AI configuration and is not listed by
            GET /api/v1/services. Its upstream-credential and domains routes
            answer 409, like its slug and access-mode routes.
        base_url:
          type: string
          description: >
            https://<auth_domain>/ai/<provider>/v1, or "" when the relay has
            no auth domain.
        upstream_base_url:
          type: string
          description: Direct providers only. Where the relay sends requests; "" for a tunnel provider.
          example: https://openrouter.ai/api/v1
        credential_slot:
          type: string
          description: >
            Direct providers only. Name of the vault slot that holds the
            upstream credential. The credential itself is configured on the
            relay and is never accepted or returned by this API.
          example: OPENROUTER
        credential_present:
          type: boolean
          description: >
            Whether the vault holds a value for the slot. For a provider
            with several slots: whether it holds one for every slot.
        credential_slots:
          type: array
          readOnly: true
          description: >
            The slots credential_slot names, in the order they are tried,
            each with whether the vault holds a value for it. Never the
            value. Empty for a tunnel provider.
          items:
            type: object
            required: [slot, present]
            properties:
              slot: { type: string, example: ZAI }
              present: { type: boolean }
        breaker_open:
          type: boolean
          readOnly: true
          description: >
            Whether the gateway is skipping the provider right now because
            recent requests to it failed. It is tried again automatically
            after a short pause; reading this field does not start that
            trial. The state is kept in memory and starts closed after a
            restart.
        auth_header:
          type: string
          description: >
            Direct providers, admin callers only. The request header that
            carries the credential upstream. Left out for other callers and
            for tunnel providers.
          example: Authorization
        auth_format:
          type: string
          description: >
            Direct providers, admin callers only. The header value with the
            literal placeholder {key} where the relay puts the credential;
            the credential itself is never part of it.
          example: 'Bearer {key}'
        extra_header_names:
          type: array
          items: { type: string }
          description: >
            Direct providers, admin callers only. Names, sorted, of the
            static headers the relay adds to every upstream request; []
            when there are none. The values are write-only: they are set
            with extra_headers in the request body and never returned.
        billing: { type: string, enum: [metered, flat] }
        supports_responses:
          type: boolean
          description: >
            Whether the provider offers the OpenAI Responses API
            (POST /responses), as its operator stated; nothing probes the
            upstream. While it is false, POST /openai/v1/responses (and
            /ai/v1/responses) for a model of this provider answers 400
            endpoint_unsupported without calling the provider. The
            provider's own path, /ai/<provider>/v1/responses, is passed
            through whatever this says. Always false for a provider whose
            api_format is anthropic.
        max_concurrent:
          type: integer
          minimum: 0
          maximum: 1000
          description: >
            How many requests the provider serves at once; 0 means no limit.
            The limit covers every way to the provider: /ai/<provider>/…
            (POST requests) and the dialect endpoints, where each credential
            slot shares it. A request that finds no free place waits, for at
            most 60 seconds or the model's attempt timeout, whichever is
            shorter. When none comes free the next target of the model is
            tried; with none left the answer is 429 provider_busy with a
            Retry-After header. A change applies from the next request on;
            requests already being served are not interrupted.
        in_use:
          type: integer
          readOnly: true
          description: >
            How many of the max_concurrent places are taken at this moment.
            Always 0 while max_concurrent is 0.
        model_count:
          type: integer
          description: Number of entries in the provider's stored model list.
        model_alias:
          type: string
          description: >
            Name of the first synthetic model, by name, that targets this
            provider; empty when none does. (The field named a model alias
            before aliases became synthetic models.)
        concrete_model:
          type: string
          description: The model that synthetic model sends to this provider.
        backend_type:
          type: string
          enum: [other]
          description: Always "other"; kept for clients that read it.
        api_key_count: { type: integer }
        requests_24h: { type: integer }
        cache_hits_24h: { type: integer }
        latency_p95_ms:
          type: integer
          description: >
            The 95th percentile of the time the upstream took to answer, over
            the last 24 h's requests it answered with a 2xx (cache hits left
            out); 0 when there is none.
        status:
          type: string
          enum: [Connected, Degraded, Offline]
          description: >
            Tunnel provider: whether its client is connected. Direct provider:
            Connected when the credential slot is set, Offline otherwise.
            Degraded is reserved: the handler never sends it today.
        client_session_id: { type: string }
        state:
          type: string
          enum: [online, offline, never_connected, ready, not_configured]
          description: >
            Tunnel provider: `online` while a client serves its backing
            service, `offline` when a client served it before and none does
            now, `never_connected` otherwise. Direct provider: `ready` when
            every credential slot it names holds a value, `not_configured`
            otherwise. `status` keeps its values beside it.
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: >
            Tunnel provider: when a client last served it, written when its
            tunnel is registered and when it goes away. Null while no client
            has served it, and always null for a direct provider.
        last_client:
          type: string
          description: >
            Tunnel provider: the name of the client token of the client that
            served it last. Empty while no client has served it, and always
            empty for a direct provider.
    MCPSource:
      type: object
      description: >
        One tool source of the MCP gateway. The credential is never part of
        it: credential_slot names a vault slot, credential_present tells
        whether the slot holds a value.
      required: [slug, name, kind, service_id, endpoint_url, url, credential_slot, credential_present, auth_header, auth_format, protocol_version, rpm, max_concurrent, timeout_s, enabled, last_sync_at, last_sync_error, tool_count, pending_count, created_at, updated_at]
      properties:
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,22}[a-z0-9])?$' }
        name: { type: string }
        kind: { type: string, enum: [remote, tunnel] }
        service_id:
          type: string
          description: The backing service row. Hidden for a remote source; the bound http service for a tunnel source.
        endpoint_url:
          type: string
          description: 'https://<auth_domain>/mcp/<slug>; empty while the relay has no auth domain.'
        url: { type: string, description: 'The upstream MCP URL of a remote source; empty for a tunnel source.' }
        credential_slot: { type: string, description: 'Name of the vault slot; empty when the upstream needs no credential.' }
        credential_present: { type: boolean }
        auth_header: { type: string }
        auth_format: { type: string, description: 'Holds the literal {key} placeholder, never the credential.' }
        protocol_version:
          type: string
          description: The MCP revision pinned toward the upstream; empty negotiates.
        rpm: { type: integer, description: 'Calls per minute the source accepts; 0 = no limit.' }
        max_concurrent: { type: integer, description: 'Calls served at once; 0 = no limit.' }
        timeout_s: { type: integer, description: 'Per-call timeout, 1-300.' }
        enabled: { type: boolean }
        last_sync_at: { type: string, format: date-time, nullable: true }
        last_sync_error:
          type: string
          description: >
            Why the last sync failed, or what it skipped; "" after a clean
            sync. A token caller (automation token or OAuth grant) gets only
            a fixed class (upstream error, upstream unreachable, upstream
            refused the credential, credential missing, client not connected,
            tools skipped, upstream response too large, source disabled,
            sync already running, sync failed): the full text can carry words
            the upstream wrote. A dashboard session gets the full text.
        tool_count: { type: integer, description: 'Tools the upstream offers, not counting removed ones.' }
        pending_count: { type: integer, description: 'Tools waiting for approval.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MCPSourceCreate:
      type: object
      additionalProperties: false
      required: [slug, kind]
      properties:
        slug: { type: string }
        name: { type: string, description: 'Display name, at most 120 characters; the slug when left out.' }
        kind: { type: string, enum: [remote, tunnel] }
        service_id: { type: string, description: 'Kind tunnel: the http service to bind.' }
        url: { type: string, description: 'Kind remote: an https URL.' }
        credential_slot: { type: string, description: 'Kind remote: one vault slot, 1-32 characters of A-Z, 0-9 and _.' }
        auth_header: { type: string, description: 'Kind remote: default Authorization.' }
        auth_format: { type: string, description: 'Kind remote: must contain {key} once; default "Bearer {key}".' }
        protocol_version: { type: string, description: 'A revision date such as 2025-06-18; empty negotiates.' }
        rpm: { type: integer, minimum: 0, maximum: 100000 }
        max_concurrent: { type: integer, minimum: 0, maximum: 1000, description: 'Default 16; 0 = no limit.' }
        timeout_s: { type: integer, minimum: 1, maximum: 300 }
        enabled: { type: boolean, description: 'Default true.' }
    MCPSourceUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        url: { type: string }
        credential_slot: { type: string }
        auth_header: { type: string }
        auth_format: { type: string }
        protocol_version: { type: string }
        rpm: { type: integer, minimum: 0, maximum: 100000 }
        max_concurrent: { type: integer, minimum: 0, maximum: 1000 }
        timeout_s: { type: integer, minimum: 1, maximum: 300 }
        enabled: { type: boolean }
    MCPSourceTool:
      type: object
      description: >
        One tool of a tool source as the last sync saw it. Only an approved
        tool that is not hidden is served; a new tool, or one whose
        definition changed, is pending until approved. A definition is the
        tool's name, title, description, inputSchema, outputSchema and
        annotations as the upstream sent them (untrusted text).
      required: [name, status, current_hash, approved_hash, definition, approved_definition, hidden, rename, description_override, read_only, upstream_read_only, effective_read_only, served_name, served, serve_issue, aggregated_name, aggregated_issue, guardrail_hits, updated_at]
      properties:
        name: { type: string, description: "The upstream's own name." }
        status: { type: string, enum: [approved, pending, removed] }
        current_hash: { type: string, description: 'sha256 of the current definition; send it when approving.' }
        approved_hash: { type: string, description: 'sha256 of the approved definition; empty before the first approval.' }
        definition: { type: object, additionalProperties: true, description: 'The current definition.' }
        approved_definition:
          type: object
          additionalProperties: true
          nullable: true
          description: The approved definition, shown next to a changed one; null before the first approval.
        hidden: { type: boolean }
        rename: { type: string, description: 'The name it is served under instead; empty = its own name.' }
        description_override: { type: string, description: 'Served instead of the approved description; empty = none.' }
        read_only: { type: boolean, nullable: true, description: "The operator's classification; null = the upstream's readOnlyHint." }
        upstream_read_only: { type: boolean, description: 'The readOnlyHint of the current definition.' }
        effective_read_only: { type: boolean, description: 'What a read-only gateway key goes by.' }
        served_name: { type: string, description: 'The name on /mcp/<slug>: the rename, or the name.' }
        served: { type: boolean, description: 'Whether the gateway serves the tool now.' }
        serve_issue: { type: string, enum: ['', name_conflict], description: 'Why an approved, visible tool is not served: name_conflict when another tool of the source would be served under the same name (neither is served). Empty otherwise.' }
        aggregated_name:
          type: string
          nullable: true
          description: 'The name on the aggregated endpoint /mcp: <slug>__<served_name>. null when the tool is not served, or when aggregated_issue says why the name is unusable.'
        aggregated_issue:
          type: string
          enum: ['', name_too_long, name_invalid, name_conflict]
          description: 'Why a served tool, or one in a name conflict, is left off /mcp: name_too_long (<slug>__<name> over 64 characters), name_invalid (characters outside [A-Za-z0-9_-]) or name_conflict (see serve_issue). A rename fixes the first two; the tool stays on /mcp/<slug>. Empty otherwise.'
        guardrail_hits:
          type: array
          description: Guardrail request patterns that matched the current definition.
          items:
            type: object
            required: [field, pattern]
            properties:
              field: { type: string, enum: [title, description, input_schema, output_schema, annotations] }
              pattern: { type: string }
        updated_at: { type: string, format: date-time }
    MCPSourceToolUpdate:
      type: object
      additionalProperties: false
      properties:
        hidden: { type: boolean }
        rename:
          type: string
          description: A-Z, a-z, 0-9, _ and -, such that <slug>__<rename> is at most 64 characters, and not the name of another tool of the source; "" clears it.
        description_override: { type: string, description: 'At most 8192 bytes, no control characters but tab and newline; "" clears it.' }
        read_only: { type: boolean, nullable: true, description: "null goes back to the upstream's readOnlyHint." }
    MCPSyncResult:
      type: object
      required: [added, changed, removed, tool_count, pending_count, skipped]
      properties:
        added: { type: integer, description: 'Tools seen for the first time, or again after they were removed.' }
        changed: { type: integer, description: 'Tools whose definition changed (they are pending now).' }
        removed: { type: integer, description: 'Tools the upstream no longer lists.' }
        tool_count: { type: integer }
        pending_count: { type: integer }
        skipped:
          type: array
          items: { type: string }
          description: >
            Tools that were not stored (an invalid or repeated name, or a
            definition over 64 KiB). A token caller gets "(name withheld)"
            for each: the names are the upstream's words.
    AIProviderUpstream:
      type: object
      description: >
        Upstream settings of a direct provider. There is no field for the
        credential: credential_slot names a vault slot whose value is
        configured on the relay.
      properties:
        api_format:
          type: string
          enum: [openai, anthropic]
          default: openai
          description: >
            The API format the provider speaks. POST /api/v1/ai/providers
            takes it for both kinds; a tunnel provider changes it with
            PUT /api/v1/ai/providers/{slug}, a direct provider with its
            upstream settings. Another value is refused with 400.
        base_url:
          type: string
          maxLength: 2048
          description: >
            https URL of the upstream API, without credentials, query or
            fragment. Unless the relay allows private upstreams, a host that
            is or resolves to a private, loopback or link-local address is
            refused.
          example: https://openrouter.ai/api/v1
        credential_slot:
          type: string
          pattern: '^[A-Z0-9_]{1,32}$'
          example: OPENROUTER
        auth_header:
          type: string
          default: Authorization
          description: Header that carries the credential. An RFC 7230 token; not a hop-by-hop or forwarding header.
        auth_format:
          type: string
          maxLength: 128
          default: 'Bearer {key}'
          description: Value of the auth header. Must contain "{key}" exactly once; no control characters.
        extra_headers:
          type: object
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 512 }
          description: >
            Static headers sent with every upstream request; at most 16 and
            4096 bytes in total. Names are RFC 7230 tokens, values carry no
            control characters. Refused names: Host, Content-Length,
            Transfer-Encoding, Connection, Keep-Alive, TE, Trailer, Upgrade,
            Proxy-*, Authorization, X-Api-Key, Cookie, Forwarded,
            X-Forwarded-* and the auth header itself. Values are not returned
            by any endpoint.
          example: { X-Title: Burrow }
        billing: { type: string, enum: [metered, flat], default: metered }
        supports_responses:
          type: boolean
          description: >
            Whether the provider offers the OpenAI Responses API
            (POST /responses). Left out, it is false on create and keeps
            its stored value on update. true is refused with 400 unless
            api_format is openai; a provider cannot change to another
            format while it is true.
        max_concurrent:
          type: integer
          minimum: 0
          maximum: 1000
          description: >
            How many requests the provider serves at once; 0 means no limit.
            Left out, it is 0 on create and keeps its stored value on
            update. A value outside 0-1000 is refused with 400.
    AIModelTarget:
      type: object
      description: One provider and model a synthetic model can be sent to.
      required: [provider, model]
      properties:
        dialect:
          type: string
          enum: [openai, anthropic]
          description: >
            The API format the target is used for. It must equal the
            provider's api_format; left out of a request, it is filled in
            from the provider.
        provider:
          type: string
          description: Slug of an existing provider.
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: The provider's own model id. No control characters.
        available:
          type: boolean
          readOnly: true
          description: >
            Whether the target can be tried right now: its provider exists
            and speaks the target's dialect, the gateway is not skipping the
            provider (see breaker_open of the provider), and for a direct
            provider every credential slot is set, for a tunnel provider
            its client is connected. Responses only; a request that carries
            it is refused with 400.
    AIServingTarget:
      type: object
      nullable: true
      description: The target that answers right now; null when none is available.
      properties:
        provider: { type: string }
        model: { type: string }
    AIRequestAttempt:
      type: object
      description: >
        One attempt of a gateway request, as the attempt log holds it. It
        carries no credential, slot name, header or upstream body.
      required: [position, provider, model, status, error_code, duration_ms, ts]
      properties:
        position:
          type: integer
          description: >
            The order the attempts were made in, from 0. Not the position
            of a target in the model's list: a provider with several
            credential slots is tried once per slot, and targets the
            endpoint does not fit are left out.
        provider: { type: string, description: Provider slug. }
        model: { type: string, description: The provider's own model id. }
        status:
          type: integer
          description: Upstream HTTP status; 0 when none was received.
        error_code:
          type: string
          description: >
            Empty for the attempt that answered. Otherwise http_<status>,
            timeout, no_response, busy, breaker_open, dialect_mismatch,
            client_closed, stream_aborted, panic, or for a translated
            attempt upstream_invalid, upstream_error or translate_error.
        duration_ms: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
    AIModel:
      type: object
      description: >
        A synthetic model: a name that clients send as "model" on the
        gateway's endpoints and that resolves to an ordered list of provider
        targets per dialect. A request reaches the targets of its own
        dialect. Only when the model has none that can serve the endpoint
        and translate is on does it reach a target of the other dialect,
        through a translating pair (see translate and dialect_modes).
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,62}$'
          description: >
            Never contains "/". "v1" is reserved, and a name cannot equal a
            provider slug.
        description: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        fallback_on_rate_limit: { type: boolean }
        translate:
          type: boolean
          default: false
          description: >
            Lets a request in a format the model has no target for be
            translated to a target of another format. Off unless switched
            on: without it such a request is refused with 400. A request
            the model can serve in its own format is never translated.
            Left out, it is false on create and keeps its stored value on
            update.
        system_text:
          type: string
          default: ''
          description: >
            Text put in front of the app's own system content on Chat
            Completions, Responses and Messages requests (the key's text
            follows it). At most 8192 bytes, not characters; longer text is
            refused with 400. Empty means none. Left out, it is empty on
            create and keeps its stored value on update.
        routing:
          type: string
          enum: [ordered, fastest, cheapest]
          default: ordered
          description: >
            The order a request's targets are tried in: as configured
            (ordered), by the provider's p95 latency over 24 h (fastest) or
            by the blended price of the target model (cheapest). Left out, it
            is ordered on create and keeps its stored value on update; any
            other value is refused with 400.
        attempt_timeout_s:
          type: integer
          minimum: 1
          maximum: 600
          default: 60
          description: >
            How long one target may take to start its response before the
            next one is tried. A hosted provider (kind direct) gives up
            waiting for the response after 120 s whatever this value is; the
            attempt is then recorded as a timeout.
        total_timeout_s:
          type: integer
          minimum: 1
          maximum: 600
          default: 120
          description: Not shorter than attempt_timeout_s.
        targets:
          type: array
          minItems: 1
          maxItems: 16
          description: >
            At most 8 per dialect, and no target (dialect, provider and
            model) twice. Within one dialect the order is the order the
            targets are tried in.
          items: { $ref: '#/components/schemas/AIModelTarget' }
        dialects:
          type: array
          readOnly: true
          description: >
            The formats the model has targets in, sorted; derived from the
            targets. With translate on, the model can be served in a format
            that is not listed here: dialect_modes says how each format is
            served.
          items: { type: string, enum: [anthropic, openai] }
        serving:
          type: object
          readOnly: true
          description: >
            Per dialect the model has a target in: the first target that is
            available, in the order they are tried, or null when none is or
            the model is disabled (requests for it are refused).
            A dialect without targets has no key, also when the model is
            served there through translation (see dialect_modes). A request
            that carries this field is refused with 400.
          properties:
            openai: { $ref: '#/components/schemas/AIServingTarget' }
            anthropic: { $ref: '#/components/schemas/AIServingTarget' }
        dialect_modes:
          type: object
          readOnly: true
          description: >
            How the model is served per format, by the rule a request is
            routed by. native: a target of that format answers. translated:
            the model has no such target, translate is on and a target of
            the other format is reached through a translating pair.
            not_served: a request is refused (also for a disabled model).
            Both keys are always present. openai describes Chat Completions
            on /openai/v1, anthropic the Messages API on /anthropic. The
            mode says nothing about whether a target can be reached right
            now; that is serving and targets[].available. A request that
            carries this field is refused with 400.
          required: [openai, anthropic]
          properties:
            openai: { $ref: '#/components/schemas/AIModelMode' }
            anthropic: { $ref: '#/components/schemas/AIModelMode' }
        responses_mode:
          allOf: [ { $ref: '#/components/schemas/AIModelMode' } ]
          readOnly: true
          description: >
            How the Responses API (POST /openai/v1/responses, what Codex
            uses) is served. native: an OpenAI-format target offers it
            (the provider's supports_responses). translated: none does,
            translate is on and a target is reached through a pair.
            A request that carries this field is refused with 400.
        translation_pairs:
          type: object
          readOnly: true
          description: >
            The pairs a translated request can be sent through, in the
            order its targets are tried, each pair once. A key exists only
            where the mode is translated; the object is empty when nothing
            is. A request that carries this field is refused with 400.
          properties:
            openai:
              type: array
              items: { type: string, enum: [chat-messages] }
            anthropic:
              type: array
              items: { type: string, enum: [messages-chat] }
            responses:
              type: array
              items: { type: string, enum: [responses-chat, responses-messages] }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    AIModelMode:
      type: string
      enum: [native, translated, not_served]
    AIGatewayKey:
      type: object
      description: >
        A gateway key as every response but its creation shows it. The key
        itself is stored as a hash and is never returned again.
      required: [id, name, key_prefix, user_id, allowed_models, allowed_tools, tools_read_only, system_text, last_used, created_at, revoked_at]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        system_text:
          type: string
          description: >
            Text put in front of the app's own system content on requests
            made with this key (after the model's text). At most 8192 bytes;
            empty means none.
        key_prefix:
          type: string
          description: The first 8 characters of the key, for display.
          example: bgw_Ab3x
        user_id: { type: string, description: The owner. }
        allowed_models:
          type: array
          maxItems: 64
          description: >
            The models the key may use; empty means every model. An entry is
            a synthetic model name, "<provider>/<model>" or "<provider>/*".
          items: { type: string, maxLength: 264 }
        allowed_tools:
          type: array
          maxItems: 64
          description: >
            The MCP tools the key may call; empty means none, the opposite of
            allowed_models. An entry is "<source>__<tool>" or "<source>__*",
            where the source is a tool source's slug (1-24 characters of
            a-z, 0-9 and "-").
          items: { type: string, maxLength: 160 }
        tools_read_only:
          type: boolean
          description: >
            The key reaches only the tools its operator classed as read-only.
        last_used: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    GatewayKeyUpdate:
      type: object
      description: >
        The body of PUT /api/v1/ai/keys/{id}. A field left out stays as it
        is; an allow-list that is given replaces the list, and an empty one
        clears it.
      properties:
        allowed_models:
          type: array
          maxItems: 64
          description: >
            Replaces the model allow-list; empty means every model. An entry
            is a synthetic model name, "<provider>/<model>" or "<provider>/*".
          items: { type: string, maxLength: 264 }
        allowed_tools:
          type: array
          maxItems: 64
          description: >
            Replaces the tool allow-list; empty means no tools. An entry is
            "<source>__<tool>" or "<source>__*".
          items: { type: string, maxLength: 160 }
        tools_read_only:
          type: boolean
          description: Limits the key to tools classed read-only, or lifts the limit.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: No control characters.
        system_text:
          type: string
          description: At most 8192 bytes, not characters. Empty clears it.
    AIProviderModel:
      type: object
      description: One entry of a provider's stored model list.
      required: [id, display_name, context_length, synced_at]
      properties:
        id: { type: string, maxLength: 200, example: google/gemini-x }
        display_name: { type: string, maxLength: 200 }
        context_length: { type: integer, format: int64, minimum: 0 }
        synced_at: { type: string, format: date-time }
    EndpointMetrics:
      type: object
      description: >
        Metering aggregates for one AI provider over the trailing 24 h, read
        from the usage events. The fields are 0 when the provider had no
        usage in that time or the store cannot be read.
      required: [requests_24h, tokens_in_24h, tokens_out_24h, cost_usd_24h, cache_hit_ratio_24h, requests_per_minute]
      properties:
        requests_24h: { type: integer }
        tokens_in_24h: { type: integer }
        tokens_out_24h: { type: integer }
        cost_usd_24h: { type: number, format: double }
        cache_hit_ratio_24h: { type: number, format: double }
        requests_per_minute:
          type: array
          items: { type: integer }
          description: 60-element array — one bucket per minute over the trailing hour.
    KnownClient:
      type: object
      description: >
        A client token with what the relay knows of the machine that uses it.
        The platform fields and `served` come from the client and are display
        text only.
      required: [token_id, token_name, user_id, status, last_seen, os, arch, client_version, remote_addr, served, sessions]
      properties:
        token_id:
          type: string
          description: >
            The id of the client token. Empty for a live session whose token
            was revoked meanwhile; such a row is always `online`.
        token_name: { type: string }
        user_id: { type: string, description: The owner of the token. }
        status:
          type: string
          enum: [online, offline, never_connected]
          description: >
            `online` while at least one session of the token is live,
            `offline` when it connected before and no session is live,
            `never_connected` otherwise.
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: >
            When the relay last wrote the session down: when it connected,
            when what it serves changed and when it ended. Null while the
            token never connected. For an online client with nothing stored
            it is the time the session connected.
        os:
          type: string
          description: >
            Operating system of the newest live session, or of the last
            session; empty while the token never connected. The same holds
            for `arch`, `client_version` and `remote_addr`.
        arch: { type: string }
        client_version: { type: string }
        remote_addr: { type: string }
        served:
          type: array
          description: >
            The names of the services the live sessions serve, or the last
            session served. Sorted; empty while the token never connected.
          items: { type: string }
        sessions:
          type: array
          description: >
            The live sessions of the token, newest first, each as
            `GET /api/v1/clients` lists it. Empty unless `status` is `online`.
          items: { $ref: '#/components/schemas/Client' }
    OAuthRequest:
      type: object
      description: >
        An OAuth authorization request waiting for the user's decision, as the
        consent page shows it. client_name and redirect_uri come from the
        client (its metadata document or its registration): treat them as
        untrusted text and show redirect_host. Holds no code or token.
      required: [id, client_id, client_name, client_kind, redirect_uri, redirect_host, localhost_redirect, resource, resource_kind, source, scopes, sources, can_grant_tools, password_required, created_at, expires_at]
      properties:
        id: { type: string }
        client_id: { type: string, description: 'A pre-registered id (bcl_…) or the https URL of the client metadata document.' }
        client_name: { type: string }
        client_kind: { type: string, enum: [registered, metadata_document] }
        redirect_uri: { type: string }
        redirect_host: { type: string, description: 'The host the browser is sent back to; for an app scheme, the scheme followed by a colon.' }
        localhost_redirect: { type: boolean, description: 'The redirect goes to this machine only (warn).' }
        resource: { type: string, description: 'The MCP endpoint the token will be good for (the audience).' }
        resource_kind:
          type: string
          enum: [burrow, gateway, source]
          description: '`burrow`: /mcp/burrow (scopes); `gateway`: /mcp (tools of every source); `source`: /mcp/<slug>.'
        source: { type: string, description: 'The tool source of a `source` resource; empty otherwise.' }
        scopes:
          type: array
          items: { type: string }
          description: 'What the client asked for: burrow:read, burrow:write or permission strings at /mcp/burrow; mcp:tools at a gateway resource.'
        sources:
          type: array
          description: 'The tool sources a gateway grant can name ("<slug>__*"); empty at /mcp/burrow.'
          items:
            type: object
            required: [slug, name]
            properties:
              slug: { type: string }
              name: { type: string }
        can_grant_tools: { type: boolean, description: 'The caller may grant tools (ai:configure:own or :any).' }
        password_required: { type: boolean, description: 'No services domain is set: approving needs the password (inline or a recent POST /auth/reauth).' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    OAuthRedirect:
      type: object
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          description: Where to send the browser next; the client's redirect URI with code, state and iss (or error, state and iss).
    OAuthGrant:
      type: object
      description: A connected app. Never holds a token.
      required: [id, client_id, client_name, user_id, user_email, resource, scopes, allowed_tools, tools_read_only, created_at, last_used]
      properties:
        id: { type: string }
        client_id: { type: string }
        client_name: { type: string }
        user_id: { type: string }
        user_email: { type: string }
        resource: { type: string }
        scopes: { type: array, items: { type: string } }
        allowed_tools:
          type: array
          items: { type: string }
          description: 'A gateway grant''s tool allow-list ("<source>__<tool>", "<source>__*"); empty at /mcp/burrow.'
        tools_read_only: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used: { type: string, format: date-time, nullable: true }
    OAuthClient:
      type: object
      description: A pre-registered public OAuth client. There is no client secret.
      required: [client_id, name, redirect_uris, created_by, created_at]
      properties:
        client_id: { type: string }
        name: { type: string }
        redirect_uris: { type: array, items: { type: string } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
    Empty:
      type: object
      description: Empty JSON object response.
    OK:
      type: object
      properties:
        ok:
          type: boolean
    User:
      type: object
      description: A user account as the admin endpoints return it.
      required: [id, email, role, status, last_login, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        status: { type: string, enum: [active, suspended] }
        last_login: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Service:
      type: object
      required: [id, name, type, slug, url, access_mode, api_key_header, gateway_only, connected, remote_port, local_addr, status, last_seen, last_client, client_session_id, provider_slug]
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [http, tcp, direct]
          description: >
            direct is the backing row of a direct AI provider. It is never
            listed; GET /api/v1/services/{serviceID} returns it by id.
        slug:
          type: string
          description: URL segment of an http service; empty for tcp or until one is assigned.
        url:
          type: string
          description: Public address, `https://<auth_domain>/svc/<slug>/`; empty without a slug or auth domain, and empty while `gateway_only` is true.
        access_mode: { type: string, enum: [open, api_key, burrow_login, mtls] }
        api_key_header:
          type: string
          description: The request header that carries the key in api_key mode.
          example: Authorization
        gateway_only:
          type: boolean
          description: When true the service is reachable through the AI gateway only; its `/svc/<slug>/` address and custom domains answer 404.
        connected: { type: boolean }
        remote_port:
          type: integer
          description: Public port of a connected tcp service; 0 for http and while not connected.
        local_addr:
          type: string
          description: Address the client forwards to; empty while not connected.
        status:
          type: string
          enum: [online, offline, never_connected]
          description: >
            `online` while a client serves the service, `offline` when a
            client served it before and none does now, `never_connected`
            otherwise. `connected` is true exactly while it is `online`.
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: >
            When a client last served the service, written when its tunnel is
            registered and when it goes away. Null while no client has served
            it.
        last_client:
          type: string
          description: >
            The name of the client token of the client that served the
            service last. Empty while no client has served it.
        client_session_id:
          type: string
          description: The client session that serves the service now; empty while none does.
        provider_slug:
          type: string
          description: The slug of the tunnel provider this service backs; empty when it backs none.
    Tunnel:
      type: object
      description: One live tunnel of the caller.
      required: [id, name, type, remote_port, local_addr, bytes_in, bytes_out, connected]
      properties:
        id:
          type: string
          description: Id of the live tunnel; a new one with every connect.
        name: { type: string }
        type: { type: string, enum: [http, tcp] }
        remote_port: { type: integer }
        local_addr: { type: string }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        connected: { type: boolean }
        service_id:
          type: string
          description: Id of the durable service of an http tunnel, for the /api/v1/services/{serviceID} routes; omitted for tcp.
        url:
          type: string
          description: Public address of an http tunnel, `https://<auth_domain>/svc/<slug>/`; omitted for tcp and for a gateway-only service.
        access_mode:
          type: string
          enum: [open, api_key, burrow_login, mtls]
          description: The access mode in effect; omitted for tcp.
    Session:
      type: object
      required: [id, ip, user_agent, created_at, expires_at, current]
      properties:
        id:
          type: string
          description: A hash of the session, never the session cookie itself. `DELETE /sessions/{id}` takes it.
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current:
          type: boolean
          description: Whether the request was made with this session.
    Token:
      type: object
      description: A client token as it is listed. The token itself is returned once, when it is created.
      required: [id, name, last_used, created_at, expires_at]
      properties:
        id: { type: string }
        name: { type: string }
        last_used: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the token stops working; null for one that never does. A token past it is refused like an unknown one.
    ClientLoginRequest:
      type: object
      description: >
        A client sign-in request as the dashboard shows it. hostname, os, arch,
        client_version and suggested_token_name were sent by the client: treat
        them as untrusted text. Holds neither the device code nor a token.
      required: [user_code, hostname, os, arch, client_version, source_ip, status, suggested_token_name, age_seconds, created_at, expires_at, password_required]
      properties:
        user_code: { type: string, example: "ABCD-EFGH" }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        client_version: { type: string }
        source_ip:
          type: string
          description: Address the client started the request from, as the relay saw it.
        status: { type: string, enum: [pending, approved, denied] }
        suggested_token_name:
          type: string
          description: The client's suggestion, else its hostname.
        age_seconds:
          type: integer
          description: Seconds since the request was started, by the relay's clock.
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        password_required:
          type: boolean
          description: >
            True when approving takes the account password (`password` in
            the approve body): the relay has no services domain
            (BURROW_SERVICES_DOMAIN), so tunnelled apps share the
            dashboard's origin.
    AccessModeReq:
      type: object
      required: [access_mode]
      properties:
        access_mode: { type: string, enum: [open, api_key, burrow_login, mtls] }
        api_key_header:
          type: string
          description: >
            api_key mode only, ignored for the other modes. The request
            header that carries the key; an RFC 7230 token.
          example: X-Api-Key
        mtls_ca_pem:
          type: string
          description: >
            mtls mode only, where it is required; ignored for the other
            modes. A PEM bundle with at least one CERTIFICATE block: the
            trust anchor client certificates are verified against.
    ConnectionLog:
      type: object
      required: [id, kind, service_id, tunnel_id, user_id, client_session_id, source_ip, user_agent, started_at, ended_at, duration_ms, bytes_in, bytes_out, status, reason]
      properties:
        id: { type: string }
        kind: { type: string, enum: [control, http_proxy, tcp_proxy] }
        service_id: { type: string }
        tunnel_id: { type: string }
        user_id: { type: string }
        client_session_id: { type: string }
        source_ip: { type: string }
        user_agent: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        status: { type: string, enum: [closed_clean, closed_error, closed_idle, rejected] }
        reason: { type: string }
    ConnectionLogRollup:
      type: object
      required: [day, service_id, kind, sessions, bytes_in, bytes_out, avg_duration_ms, p95_duration_ms]
      properties:
        day: { type: string, format: date }
        service_id: { type: string }
        kind: { type: string }
        sessions: { type: integer, format: int64 }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        avg_duration_ms: { type: integer, format: int64 }
        p95_duration_ms: { type: integer, format: int64 }
        top_source_ips:
          type: array
          description: >
            The source addresses with the most sessions of the group. Left
            out while the setting connection_logs.rollup_include_top_ips is
            "false"; an empty list when it is on and the group has none.
          items:
            type: object
            required: [ip, sessions]
            properties:
              ip: { type: string }
              sessions: { type: integer, format: int64 }
    ServiceDetail:
      description: One service with what only the detail view has.
      allOf:
        - $ref: '#/components/schemas/Service'
        - type: object
          required: [api_key_count, access_policy]
          properties:
            api_key_count: { type: integer }
            access_policy:
              type: array
              description: The role allowlist of burrow_login mode, as GET .../access-policy returns it.
              items: { type: string }
    ServiceApiKey:
      type: object
      description: >
        A per-service API key as it is listed. The key itself is stored as a
        hash and is never returned again.
      required: [id, name, last_used, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        last_used: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ServiceIpGeoInput:
      type: object
      description: >
        IP and country rules of one service. A list that is left out is
        stored as empty; enabled left out is false.
      properties:
        enabled: { type: boolean }
        allow_cidrs:
          type: array
          description: Checked when stored; a malformed entry is refused with 400.
          items: { type: string, example: 203.0.113.0/24 }
        block_cidrs:
          type: array
          items: { type: string, example: 198.51.100.7/32 }
        allow_countries:
          type: array
          description: ISO 3166-1 alpha-2 codes.
          items: { type: string, example: DE }
        block_countries:
          type: array
          description: ISO 3166-1 alpha-2 codes.
          items: { type: string, example: US }
    ServiceIpGeo:
      description: The stored rules; every list is present, empty when unset.
      allOf:
        - $ref: '#/components/schemas/ServiceIpGeoInput'
        - type: object
          required: [enabled, allow_cidrs, block_cidrs, allow_countries, block_countries]
    UpstreamCredentialBinding:
      type: object
      description: >
        The upstream credential bound to a service. While none is bound the
        object holds slot_present false and nothing else. The credential
        itself is configured on the relay and is never returned.
      required: [slot_present]
      properties:
        slot: { type: string, description: Name of the vault slot., example: OPENAI }
        header_name: { type: string, example: Authorization }
        header_format: { type: string, example: 'Bearer {key}' }
        slot_present:
          type: boolean
          description: Whether the vault holds a value for the slot.
    CustomDomain:
      type: object
      description: >
        A custom domain of a service with the data of its certificate. The
        private key is never returned.
      required: [id, service_id, hostname, cert_sha256, not_before, not_after, created_at, updated_at, status, status_updated_at]
      properties:
        id: { type: string }
        service_id: { type: string }
        hostname: { type: string, description: Lower case. }
        cert_sha256: { type: string, description: Fingerprint of the stored certificate. }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, active, cert_expiring, cert_expired] }
        status_updated_at: { type: string, format: date-time }
    SessionUser:
      type: object
      description: The signed-in user as login and /me return it.
      required: [id, email, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string }
    Me:
      description: >
        The caller as /me returns it: the SessionUser fields plus the caller's
        effective permissions (a session's role, or a token's declared and
        still granted permissions), in the order the server lists them.
      allOf:
        - $ref: '#/components/schemas/SessionUser'
        - type: object
          required: [permissions, services_domain]
          properties:
            permissions:
              type: array
              items: { type: string }
            services_domain:
              type: string
              description: >
                BURROW_SERVICES_DOMAIN, the second host name that serves
                tunnelled apps under /svc/; "" when unset (they share the
                dashboard's origin). Given to every signed-in caller.
    Client:
      type: object
      description: One live client, that is one control session of a connected burrow client.
      required: [session_id, user_id, token_name, remote_addr, os, arch, client_version, service_count, total_bytes_in, total_bytes_out]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        token_name: { type: string }
        remote_addr: { type: string }
        os: { type: string }
        arch: { type: string }
        client_version: { type: string }
        service_count: { type: integer }
        total_bytes_in: { type: integer, format: int64 }
        total_bytes_out: { type: integer, format: int64 }
    ClientService:
      type: object
      description: One service (tunnel) of a live client.
      required: [id, name, type, remote_port, local_addr, access_mode, bytes_in, bytes_out, total_bytes_in, total_bytes_out]
      properties:
        id: { type: string, description: Id of the live tunnel. }
        name: { type: string }
        type: { type: string, enum: [http, tcp] }
        service_id:
          type: string
          description: Id of the durable service of an http tunnel; omitted for tcp.
        remote_port: { type: integer }
        local_addr: { type: string }
        access_mode: { type: string }
        bytes_in: { type: integer, format: int64, description: Since this connect. }
        bytes_out: { type: integer, format: int64, description: Since this connect. }
        total_bytes_in: { type: integer, format: int64, description: Stored total; survives a reconnect. }
        total_bytes_out: { type: integer, format: int64, description: Stored total; survives a reconnect. }
    ClientDetail:
      description: A live client with its services.
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          required: [services]
          properties:
            services:
              type: array
              items: { $ref: '#/components/schemas/ClientService' }
    Role:
      type: object
      description: A role as the list returns it.
      required: [name, description, created_at, builtin, default_for_new_users]
      properties:
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        builtin:
          type: boolean
          description: A built-in role cannot be changed or deleted.
        default_for_new_users: { type: boolean }
    RoleDetail:
      description: A role with its permissions.
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              description: Permission keys, see GET /api/v1/roles/permissions. Those of a built-in role are fixed in code.
              items: { type: string }
    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$'
          description: Lower-case letters, digits and dashes, 1 to 64 characters, no dash at either end.
        description: { type: string }
        permissions:
          type: array
          description: Permission keys; an unknown key is refused with 400.
          items: { type: string }
        default_for_new_users: { type: boolean }
    Permission:
      type: object
      description: One entry of the permission catalog.
      required: [key, group, description]
      properties:
        key: { type: string, example: 'tokens:manage:own' }
        group: { type: string, description: Section label for display., example: Client tokens }
        description: { type: string }
    AutomationPreset:
      type: object
      description: A named starting point for the permissions of an automation token.
      required: [name, description, permissions]
      properties:
        name: { type: string, enum: [read-only, operator, full] }
        description: { type: string }
        permissions:
          type: array
          description: The preset's permissions, cut to what the caller holds.
          items: { type: string }
    AutomationToken:
      type: object
      description: An automation token as it is listed. The token itself is returned once, when it is created.
      required: [id, name, prefix, user_id, role_at_mint, permissions, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix:
          type: string
          description: The first 10 characters of the token, for display.
          example: bua_Ab3xYz
        user_id: { type: string }
        role_at_mint: { type: string, description: The role of the user when the token was created. }
        permissions:
          type: array
          description: The permission keys the token declares.
          items: { type: string }
        expires_at:
          type: string
          format: date-time
          description: Left out for a token that does not expire.
        last_used:
          type: string
          format: date-time
          description: Left out until the token is used.
        created_at: { type: string, format: date-time }
    CacheSettingsInput:
      type: object
      description: >
        Settings of the exact-match prompt cache. A field that is left out
        is false or 0; applies_per left out is global.
      properties:
        enabled: { type: boolean }
        applies_per: { type: string, enum: [global, per_endpoint, per_api_key], default: global }
        ttl_seconds: { type: integer }
        max_entries: { type: integer }
        max_per_entry_kb: { type: integer }
    CacheSettings:
      description: Stored cache settings; every field is present.
      allOf:
        - $ref: '#/components/schemas/CacheSettingsInput'
        - type: object
          required: [enabled, applies_per, ttl_seconds, max_entries, max_per_entry_kb]
    CacheSemanticSettingsInput:
      type: object
      description: Settings of the semantic (similarity) tier of the cache.
      properties:
        enabled: { type: boolean }
        min_similarity: { type: number, format: double, minimum: 0, maximum: 1 }
        embedding_mode: { type: string, enum: [local, none] }
        embedding_url: { type: string }
        embedding_model: { type: string }
        fallback_policy: { type: string, enum: [treat_as_miss, return_cached_marked] }
        promote_on_miss: { type: boolean }
        max_index_entries: { type: integer }
    CacheSemanticSettings:
      description: Semantic-tier settings; every field is present.
      allOf:
        - $ref: '#/components/schemas/CacheSemanticSettingsInput'
        - type: object
          required: [enabled, min_similarity, embedding_mode, embedding_url, embedding_model, fallback_policy, promote_on_miss, max_index_entries]
    CacheSettingsView:
      type: object
      description: What GET /api/v1/cache/settings returns.
      required: [global, semantic, per_service]
      properties:
        global: { $ref: '#/components/schemas/CacheSettings' }
        semantic:
          description: >
            The built-in defaults of the semantic tier. A service sets its
            own values in the cache.semantic section of its AI configuration.
          allOf: [ { $ref: '#/components/schemas/CacheSemanticSettings' } ]
        per_service:
          type: array
          description: One entry per service that has an AI configuration.
          items:
            allOf:
              - $ref: '#/components/schemas/CacheSettings'
              - type: object
                required: [service_id, override]
                properties:
                  service_id: { type: string }
                  override:
                    type: boolean
                    description: >
                      Whether the service's AI configuration has a cache
                      section. Without one the entry shows the built-in
                      defaults.
    CacheStats:
      type: object
      description: >
        Counters of both cache tiers. The hit rates are kept in memory and
        start at 0 after a restart.
      required: [entries, on_disk_bytes, hit_rate_24h, semantic_entries, semantic_disk_bytes, semantic_hit_rate_24h, semantic_similar_returned_24h, semantic_promotions_24h]
      properties:
        entries: { type: integer }
        on_disk_bytes: { type: integer, format: int64 }
        hit_rate_24h: { type: number, format: double }
        semantic_entries: { type: integer }
        semantic_disk_bytes: { type: integer, format: int64 }
        semantic_hit_rate_24h: { type: number, format: double }
        semantic_similar_returned_24h: { type: integer }
        semantic_promotions_24h: { type: integer }
    ServiceAiConfig:
      type: object
      description: >
        The AI configuration of one service: one JSON object, stored and
        returned as it was written ({} while none was written). The sections
        below are the ones the relay reads; a section that is left out or
        null is off. Any other key is stored and ignored. On write only
        cache.semantic.min_similarity (0 to 1) and
        cache.semantic.embedding_mode (local or none) are checked.
      additionalProperties: true
      properties:
        cache:
          description: Exact-match cache of this service, with its semantic tier.
          allOf:
            - $ref: '#/components/schemas/CacheSettingsInput'
            - type: object
              properties:
                semantic: { $ref: '#/components/schemas/CacheSemanticSettingsInput' }
        redaction:
          type: object
          properties:
            enabled: { type: boolean }
            for_logs_only: { type: boolean }
        guardrails:
          type: object
          properties:
            enabled: { type: boolean }
            action: { type: string, enum: [log_only, refuse_403, refuse_safe] }
        inspector:
          type: object
          properties:
            enabled: { type: boolean }
            max_requests: { type: integer }
        anthropic:
          type: object
          description: Keeps the service's traffic on the metering chain; requests are not rewritten.
          properties:
            enabled: { type: boolean }
    RateLimitInput:
      type: object
      required: [scope, dimension, limit, burst]
      properties:
        scope: { type: string, enum: [api_key, gateway_key, model, role, service, global] }
        subject:
          type: string
          maxLength: 256
          description: >
            Whom the rule applies to. Required for every scope but global,
            which must not have one. For gateway_key the key's id, for model
            the model's name on the gateway endpoints.
        dimension:
          type: string
          enum: [rpm, bpm]
          description: rpm counts requests, bpm estimated bytes / 4.
        limit: { type: integer, minimum: 1 }
        burst: { type: integer, minimum: 1 }
        window:
          type: string
          enum: [minute, day]
          default: minute
          description: A day runs from UTC midnight.
    RateLimit:
      description: A stored rate-limit rule.
      allOf:
        - $ref: '#/components/schemas/RateLimitInput'
        - type: object
          required: [id, subject, window]
          properties:
            id: { type: string }
    RateLimitUsage:
      type: object
      required: [limits]
      properties:
        limits:
          type: array
          description: The rules that apply to the subject, each with its live counters.
          items:
            allOf:
              - $ref: '#/components/schemas/RateLimit'
              - type: object
                required: [used, reset_seconds]
                properties:
                  used: { type: integer, format: int64 }
                  reset_seconds: { type: integer }
    CostPricingEntryInput:
      type: object
      required: [model]
      properties:
        provider:
          type: string
          description: Provider slug. Left out, the price applies to the model under any provider.
        model: { type: string }
        input_per_million: { type: number, format: double, minimum: 0 }
        output_per_million: { type: number, format: double, minimum: 0 }
        per_request_usd:
          type: number
          format: double
          minimum: 0
          description: >
            USD for one request that reports no tokens (image generation,
            speech, transcription, and a rerank answer that bills only Cohere
            search units, which are no tokens). A request with token counts is
            priced by tokens; one without by this price, and costs 0 and
            counts in unpriced_requests of the cost summary when it is 0 or
            unset.
    CostPricingInput:
      type: object
      description: A whole price table; it replaces the one in use.
      required: [version, entries]
      properties:
        version: { type: string, minLength: 1 }
        entries:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CostPricingEntryInput' }
    CostPricing:
      type: object
      description: The price table in use. Only entries that name a provider are listed.
      required: [version, entries]
      properties:
        version: { type: string }
        entries:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CostPricingEntryInput'
              - type: object
                required: [provider, model, input_per_million, output_per_million, per_request_usd]
    CostSummary:
      type: object
      required: [window, total_usd, tokens_in, tokens_out, top_consumers, pct_of_budget, unpriced_requests]
      properties:
        window: { type: string, enum: [today, week, month, year] }
        total_usd: { type: number, format: double }
        unpriced_requests:
          type: integer
          format: int64
          description: >
            Requests of the window that were answered without a token count
            (images, speech, transcription, a rerank that bills only search
            units) and whose model has no per_request_usd price: they are
            counted at 0.
        tokens_in: { type: integer, format: int64 }
        tokens_out: { type: integer, format: int64 }
        top_consumers:
          type: array
          items:
            type: object
            required: [api_key_id, service_id, tokens_in, tokens_out, usd]
            properties:
              api_key_id: { type: string }
              service_id: { type: string }
              tokens_in: { type: integer, format: int64 }
              tokens_out: { type: integer, format: int64 }
              usd: { type: number, format: double }
        pct_of_budget:
          type: number
          format: double
          nullable: true
          description: >
            For window today, the highest ratio of today's spend to daily_usd
            over the budgets. Null for the other windows and whenever there
            is no such ratio.
        group_by:
          type: string
          enum: [gateway_key, model, provider, target_model, dialect]
          description: Present only when the group_by parameter was sent.
        groups:
          type: array
          description: Present only when the group_by parameter was sent.
          items:
            type: object
            required: [key, requests, tokens_in, tokens_out, usd]
            properties:
              key: { type: string }
              requests: { type: integer, format: int64 }
              tokens_in: { type: integer, format: int64 }
              tokens_out: { type: integer, format: int64 }
              usd: { type: number, format: double }
    BudgetInput:
      type: object
      required: [scope, action_on_exceed]
      properties:
        scope: { type: string, enum: [api_key, service, user, global, gateway_key, model] }
        subject_id:
          type: string
          maxLength: 256
          description: Required for every scope but global, which must not have one. Taken as sent, never trimmed.
        daily_usd:
          type: number
          format: double
          minimum: 0
          description: At least one of daily_usd and daily_tokens must be above 0.
        daily_tokens: { type: integer, format: int64, minimum: 0 }
        action_on_exceed: { type: string, enum: [alert_webhook, throttle_zero, disable_key] }
        alert_webhook_id: { type: string, nullable: true }
    Budget:
      description: A stored budget with today's usage.
      allOf:
        - $ref: '#/components/schemas/BudgetInput'
        - type: object
          required: [id, subject_id, daily_usd, daily_tokens, alert_webhook_id, current_usd, current_tokens, exceeded]
          properties:
            id: { type: string }
            current_usd: { type: number, format: double }
            current_tokens: { type: integer, format: int64 }
            exceeded: { type: boolean }
    RedactionRuleInput:
      type: object
      required: [name, pattern, action, scope]
      properties:
        name: { type: string }
        pattern: { type: string, description: A regular expression in Go (RE2) syntax. }
        action: { type: string, enum: [mask, drop, hash] }
        scope: { type: string, enum: [request_body, response_body, both, tool_arguments, tool_result], description: "tool_arguments and tool_result apply to MCP tool calls on the tool gateway; both applies to them too." }
    RedactionRule:
      description: A redaction rule, built-in or custom.
      allOf:
        - $ref: '#/components/schemas/RedactionRuleInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
    RedactionRules:
      type: object
      required: [built_in, custom]
      properties:
        built_in:
          type: array
          description: The bundled rules. They cannot be changed or deleted (409).
          items: { $ref: '#/components/schemas/RedactionRule' }
        custom:
          type: array
          items: { $ref: '#/components/schemas/RedactionRule' }
    RedactionSettingsInput:
      type: object
      description: Global redaction settings. A field that is left out is false or empty.
      properties:
        enabled: { type: boolean }
        redact_for_logs_only: { type: boolean }
        rule_ids:
          type: array
          description: Ids of the selected rules.
          items: { type: string }
        presidio_enabled: { type: boolean }
        presidio_url:
          type: string
          description: Left out of an answer while it is empty.
    RedactionSettings:
      description: Stored redaction settings.
      allOf:
        - $ref: '#/components/schemas/RedactionSettingsInput'
        - type: object
          required: [enabled, redact_for_logs_only, rule_ids, presidio_enabled]
    RedactionSettingsView:
      type: object
      description: What GET /api/v1/redaction/settings returns.
      required: [global, per_service]
      properties:
        global: { $ref: '#/components/schemas/RedactionSettings' }
        per_service:
          type: array
          description: One entry per service that has an AI configuration.
          items:
            allOf:
              - $ref: '#/components/schemas/RedactionSettings'
              - type: object
                required: [service_id, override]
                properties:
                  service_id: { type: string }
                  override:
                    type: boolean
                    description: >
                      Whether the service's AI configuration has a redaction
                      section. Without one the entry shows the defaults.
    GuardrailPreviewRequest:
      type: object
      required: [pattern, text]
      properties:
        pattern: { type: string, maxLength: 512 }
        text: { type: string }
    GuardrailPreviewResult:
      type: object
      required: [matches, truncated]
      properties:
        matches:
          type: array
          items:
            type: object
            required: [start, end, text]
            properties:
              start: { type: integer, description: 'Byte offset into text.' }
              end: { type: integer, description: 'Byte offset into text, exclusive.' }
              text: { type: string }
        truncated: { type: boolean, description: 'True when there were more than 100 matches.' }
    GuardrailSettingsInput:
      type: object
      required: [action]
      properties:
        enabled: { type: boolean }
        action: { type: string, enum: [log_only, refuse_403, refuse_safe] }
        answers: { $ref: '#/components/schemas/GuardrailAnswerSettings' }
        custom_patterns:
          type: array
          maxItems: 50
          description: >
            The operator's own patterns, matched after the bundled ones of
            their direction. Ids are unique and no bundled id. A list that
            breaks a rule is refused with 400 naming the first bad pattern.
          items: { $ref: '#/components/schemas/GuardrailCustomPattern' }
        judge: { $ref: '#/components/schemas/JudgeSettings' }
    GuardrailSettings:
      type: object
      description: >
        Stored global guardrail settings. They apply to every gateway request
        (also for a provider without an AI configuration) and to every service
        with an AI configuration. A service's own guardrails section overrides
        enabled and action only when its enabled is true; a section with
        enabled false counts as no override. enabled switches the request
        patterns only: answers, custom_patterns and judge are always the
        global ones and run on their own switches, whatever enabled says.
      required: [enabled, action, answers, custom_patterns, judge]
      properties:
        enabled: { type: boolean }
        action: { type: string, enum: [log_only, refuse_403, refuse_safe] }
        answers:
          type: object
          description: See GuardrailAnswerSettings.
          required: [enabled, action]
          properties:
            enabled: { type: boolean }
            action: { type: string, enum: [flag, block] }
        custom_patterns:
          type: array
          description: See GuardrailCustomPattern; [] when there are none.
          items:
            type: object
            required: [id, pattern, direction, description]
            properties:
              id: { type: string }
              pattern: { type: string }
              direction: { type: string, enum: [request, answer, both] }
              description: { type: string }
        judge:
          type: object
          description: See JudgeSettings; the defaults are filled in.
          required: [enabled, model, policy, check, timeout_ms, on_failure]
          properties:
            enabled: { type: boolean }
            model: { type: string }
            policy: { type: string }
            check: { type: string, enum: [requests, requests_and_answers] }
            timeout_ms: { type: integer }
            on_failure: { type: string, enum: [allow, refuse] }
    JudgeSettings:
      type: object
      description: >
        The judge: a synthetic model that classifies the text of requests
        (Chat Completions, Responses, Messages, legacy completions, the media
        and rerank endpoints; tool results included; a gateway key's system
        text first; after redaction, at most 16384 bytes: a longer text keeps
        its first 4096 bytes and its end, with the last user message) against
        the policy, after the patterns and before the cache. It runs on its
        own enabled switch, whether or not the request patterns are on, for
        every gateway request and every service with an AI configuration. It gets a bundled English instruction, then the policy, and
        must answer {"verdict": "allow" | "block", "reason": "…"}. A block
        refuses the request with 403 guardrail_judge_refused (the reason goes
        to the request inspector only, never to the audit log or the app).
        With check requests_and_answers an answer that comes in one piece is
        held and judged too, and withheld on a block (502
        guardrail_judge_blocked_answer): its text and the arguments of its
        tool calls (an answer of tool calls only is judged), on the Chat
        Completions, Responses, Messages and legacy completions endpoints, so
        every tool-call turn that does not stream costs a judge call too.
        Streamed answers are never judged. A response-cache entry stored
        under other judge settings (or by a version before v0.12.1) is a
        miss. A
        timeout, an error or an answer that is no verdict is a failure:
        on_failure allow lets the request through, refuse refuses it as a
        block; failures are audited as guardrail.judge_failed (one entry per
        service, class, direction and gateway key per hour). An answer
        larger than the relay holds (256 KiB) is a failure of class
        too_large. Judge calls are metered as usage of the judge model for
        the judged request's service; they are not charged to its rate
        limits, not stopped by budgets, and not held to the IP/geo policy of
        the judge provider's service. Defaults {enabled: false, model: "", policy: "", check:
        requests, timeout_ms: 3000, on_failure: allow}.
      properties:
        enabled: { type: boolean }
        model:
          type: string
          description: The name of an existing synthetic model; required when enabled.
        policy:
          type: string
          maxLength: 4000
          description: The operator's policy in plain text; maxLength counts characters.
        check:
          type: string
          enum: [requests, requests_and_answers]
          description: An empty or missing value is stored as requests.
        timeout_ms:
          type: integer
          minimum: 500
          maximum: 30000
          description: How long the judge may take; 0 or missing is stored as 3000.
        on_failure:
          type: string
          enum: [allow, refuse]
          description: An empty or missing value is stored as allow.
    GuardrailAnswerSettings:
      type: object
      description: >
        Inspection of answers (Chat Completions, legacy completions,
        Responses, Messages) for secrets: their text and the arguments of
        their tool calls, whole and streamed (streamed arguments with their
        simple JSON escapes decoded). flag delivers the answer and records the hit; block
        withholds a whole answer (502 guardrail_blocked_answer) and stops a
        streamed one with an error event. Defaults {enabled: false, action: flag}.
      properties:
        enabled: { type: boolean }
        action:
          type: string
          enum: [flag, block]
          description: An empty or missing action is stored as flag.
    GuardrailCustomPattern:
      type: object
      required: [id, pattern, direction]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_-]{1,64}$'
        pattern:
          type: string
          minLength: 1
          maxLength: 512
          description: A Go RE2 regular expression that does not match empty text; maxLength counts characters.
        direction:
          type: string
          enum: [request, answer, both]
          description: request runs on the request body, answer on the text of answers.
        description:
          type: string
          maxLength: 200
    GuardrailSettingsView:
      type: object
      description: What GET /api/v1/guardrails/settings returns.
      required: [global, per_service]
      properties:
        global: { $ref: '#/components/schemas/GuardrailSettings' }
        per_service:
          type: array
          description: One entry per service that has an AI configuration.
          items:
            type: object
            required: [service_id, enabled, action]
            properties:
              service_id: { type: string }
              enabled:
                type: boolean
                nullable: true
                description: Null while the service has no guardrails section of its own.
              action:
                type: string
                nullable: true
                description: log_only, refuse_403 or refuse_safe; null while the service has no guardrails section of its own.
    InspectorEntry:
      type: object
      description: >
        One captured request with its response. A body is a string: the
        text itself when it is valid UTF-8, else base64; the matching
        *_encoding field says which. Fields that are empty are left out,
        except the ones listed as required.
      required: [id, service_id, ts, method, path, status, duration_ms, bytes_in, bytes_out, translated, dropped, provider, model, gateway_key_id]
      properties:
        id: { type: string }
        service_id: { type: string }
        api_key_id: { type: string }
        ts: { type: string, format: date-time }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        duration_ms: { type: integer, format: int64 }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        req_headers:
          type: object
          additionalProperties: { type: string }
        req_body: { type: string }
        req_body_encoding: { type: string, enum: [utf8, base64] }
        resp_headers:
          type: object
          additionalProperties: { type: string }
        resp_body: { type: string }
        resp_body_encoding: { type: string, enum: [utf8, base64] }
        truncated: { type: boolean }
        bytes_omitted: { type: integer, format: int64 }
        cache: { type: string, enum: [HIT, MISS, SKIP] }
        redactions:
          type: array
          items:
            type: object
            required: [rule, count]
            properties:
              rule: { type: string }
              count: { type: integer }
        trace_id: { type: string }
        remote_ip: { type: string }
        mcp:
          type: object
          description: Set when the request is a recognised MCP (JSON-RPC) call.
          required: [method]
          properties:
            method: { type: string }
            tool: { type: string }
            params:
              description: The call's params as they were sent; any JSON value.
        adapter_lossy: { type: boolean }
        guardrail:
          type: object
          description: >
            Set when a guardrail pattern matched the request or its answer:
            the pattern's id (never the matched text), the direction and the
            action taken (log_only, refuse_403, refuse_safe for a request;
            flag or block for an answer). mid_stream is true when a streamed
            answer was stopped after part of it had been sent.
          required: [pattern, direction, action]
          properties:
            pattern: { type: string }
            direction: { type: string, enum: [request, answer] }
            action: { type: string }
            mid_stream: { type: boolean }
            in:
              type: string
              enum: [key_system_text]
              description: >
                Present when the request pattern matched the gateway key's
                system text rather than the request itself.
        judge:
          type: object
          description: >
            Set when the judge applied to the request or its answer (when both
            were judged, this is the answer's mark and request_judge the
            request's): the verdict, the judge's reason for a block, and the
            class of a failure. not_judged means there was no text to judge
            (an image-only request, an answer of tool calls without
            arguments); its reason is "no text". too_large is an answer larger
            than the relay holds (256 KiB).
          required: [direction, verdict]
          properties:
            direction: { type: string, enum: [request, answer] }
            verdict: { type: string, enum: [allow, block, failed, not_judged] }
            reason: { type: string }
            failure: { type: string, enum: [timeout, error, malformed, unavailable, too_large] }
            refused:
              type: boolean
              description: >
                True when the verdict is failed and on_failure refuse turned
                the failure into a refusal; absent when the request was let
                through.
        request_guardrail:
          type: object
          description: >
            The request's pattern mark (as in guardrail) when its answer got a
            pattern mark of its own, which guardrail then holds; absent
            otherwise.
          required: [pattern, direction, action]
          properties:
            pattern: { type: string }
            direction: { type: string, enum: [request] }
            action: { type: string }
            mid_stream: { type: boolean, description: Never true for a request. }
            in: { type: string, enum: [key_system_text] }
        request_judge:
          type: object
          description: >
            The judge's mark on the request (as in judge) when its answer was
            judged as well, which judge then holds; absent otherwise.
          required: [direction, verdict]
          properties:
            direction: { type: string, enum: [request] }
            verdict: { type: string, enum: [allow, block, failed, not_judged] }
            reason: { type: string }
            failure: { type: string, enum: [timeout, error, malformed, unavailable, too_large] }
            refused: { type: boolean }
        purpose:
          type: string
          enum: [guardrail-judge]
          description: Set on the relay's own call to the judge model; absent for an app's request.
        translated:
          type: string
          enum: ['', messages-chat, responses-chat, chat-messages, responses-messages]
          description: >
            The pair that translated the request, as in the response header
            Burrow-Translated. Empty for a request served in its own format.
        dropped:
          type: array
          items: { type: string }
          description: >
            What the translation left out, as in the response header
            Burrow-Dropped: sorted names, never null, empty when nothing
            was left out. A final "more" says the list was cut; it is not a
            name. A name can end in text the client chose (after a prefix
            such as "unknown:"); treat every name as plain text.
        provider:
          type: string
          description: >
            Slug of the provider that answered. Empty for a request that came
            without a gateway key (a service's own address, or a service API
            key on /ai/<provider>/).
        model:
          type: string
          description: >
            The model the caller asked for, under the name it has on the
            gateway endpoints ("<provider>/<id>" on a provider's own path).
            Empty where provider is, and for a request that names no model.
        gateway_key_id:
          type: string
          description: Id of the gateway key the caller presented, or empty.
        oauth_grant_id:
          type: string
          description: >
            Id of the OAuth grant whose access token made a tool call
            (gateway_key_id is then empty). Absent otherwise.
        kind:
          type: string
          enum: [mcp]
          description: '`mcp` for a tool call (the `mcp` method is tools/call); absent for a model request.'
        source:
          type: string
          description: The slug of the tool source a tool call went to (also in provider); absent for a model request.
    InspectorReplayRequest:
      type: object
      description: >
        Optional overrides for a replay. Without a body the captured request
        is sent again as it was.
      properties:
        headers:
          type: object
          description: Set on top of the captured request headers.
          additionalProperties: { type: string }
        body:
          type: string
          description: Replaces the captured request body when it is not empty.
        body_encoding: { type: string, enum: [utf8, base64], default: utf8 }
        follow_routing:
          type: boolean
          description: Accepted; the relay does not act on it.
    AuditEvent:
      type: object
      description: One row of the audit log. Rows are chained by hash.
      required: [id, ts, actor_id, actor_email, action, subject_id, subject_label, result, source_ip, user_agent, request_id, payload, prev_hash, hash]
      properties:
        id:
          type: string
          description: The id of the last row of a page is the before_id of the next, older page.
        ts: { type: string, format: date-time }
        actor_id: { type: string }
        actor_email: { type: string }
        action: { type: string, example: service.create }
        subject_id: { type: string }
        subject_label: { type: string }
        result: { type: string, example: ok }
        source_ip: { type: string }
        user_agent: { type: string }
        request_id: { type: string }
        payload:
          type: object
          description: Details of the action; {} when there are none.
          additionalProperties: true
        prev_hash: { type: string }
        hash: { type: string }
    WebhookEvent:
      type: string
      description: The closed set of events a webhook can subscribe to.
      enum:
        - webhook.test
        - tunnel.connected
        - tunnel.disconnected
        - tunnel.failed
        - access.denied
        - quota.exceeded
        - budget.exceeded
        - redaction.applied
        - guardrail.refused
        - cert.expiring
        - audit.exported
        - backup.completed
        - ai.upstream_error
        - ai.cache_promotion
        - audit.policy_change
        - service.created
        - service.deleted
        - connection.session_summary
        - custom_domain.cert.expiring
    WebhookInput:
      type: object
      required: [name, url, events]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Not blank after trimming. maxLength counts bytes.
        url: { type: string, format: uri, description: An http or https URL. }
        events:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WebhookEvent' }
        paused: { type: boolean }
        payload_template:
          type: string
          description: >
            Optional Go template of the request body, checked against the
            first event when it is stored. Left out or empty, the body is
            {"event": ..., "data": ...}.
    Webhook:
      type: object
      description: >
        A webhook as it is listed. The signing secret is stored as a hash and
        is returned once, in the answer to the creation.
      required: [id, name, url, events, paused, status, consecutive_failures, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        paused: { type: boolean }
        status: { type: string, enum: [ok, failing] }
        consecutive_failures: { type: integer }
        first_failure_at:
          type: string
          format: date-time
          description: Left out while the webhook is not failing.
        created_at: { type: string, format: date-time }
        signing_secret:
          type: string
          description: Only in the answer to the creation ("whsec_" and 64 hex characters). Shown this once.
    WebhookDelivery:
      type: object
      description: One delivery attempt.
      required: [id, webhook_id, event, ts, status_code, attempt, latency_ms, request_body_preview, response_body_preview]
      properties:
        id: { type: string }
        webhook_id: { type: string }
        event: { type: string }
        ts: { type: string, format: date-time }
        status_code: { type: integer }
        attempt: { type: integer }
        latency_ms: { type: integer }
        request_body_preview: { type: string }
        response_body_preview: { type: string }
    Settings:
      type: object
      description: >
        The non-secret settings; every value is a string. A key that was
        never set is left out of an answer. On write a key that is not
        listed here is ignored and a listed key that is left out keeps its
        value. The SMTP password is not a setting: the relay reads it from
        its environment.
      properties:
        smtp.host: { type: string }
        smtp.port: { type: string, example: '587' }
        smtp.username: { type: string }
        smtp.from: { type: string }
        smtp.tls: { type: string, enum: [none, starttls, implicit] }
        connection_logs.rollup_include_top_ips:
          type: string
          description: >
            "false" turns the top_source_ips lists of the connection-log
            rollups off and removes the stored ones; any other value, or
            none, leaves them on.
          example: 'true'
    SettingsView:
      description: >
        What GET answers: the settings, and services_domain, which the relay
        reads from its environment and a write ignores.
      allOf:
        - $ref: '#/components/schemas/Settings'
        - type: object
          properties:
            services_domain:
              type: string
              description: >
                BURROW_SERVICES_DOMAIN: the host that serves tunnelled apps,
                or "" when it is not set. Always present in an answer.
              example: apps.example.com
    RetentionSettingsInput:
      type: object
      description: How long the relay keeps its records. A field that is left out keeps its stored value.
      properties:
        audit_retention_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: 0 keeps every entry forever.
        inspector_retention_count: { type: integer, minimum: 1, maximum: 1000 }
        usage_retention_days: { type: integer, minimum: 1, maximum: 3650 }
        redaction_retention_days: { type: integer, minimum: 1, maximum: 3650 }
        connection_logs_retention_days: { type: integer, minimum: 1, maximum: 3650 }
        connection_logs_rollups_retention_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: 0 keeps every rollup forever.
        webhook_deliveries_retention_days: { type: integer, minimum: 1, maximum: 365 }
    RetentionSettings:
      type: object
      description: The stored retention settings. A value that was never set reads as 0.
      required: [audit_retention_days, inspector_retention_count, usage_retention_days, redaction_retention_days, connection_logs_retention_days, connection_logs_rollups_retention_days, webhook_deliveries_retention_days, audit_retention_note]
      properties:
        audit_retention_days: { type: integer }
        inspector_retention_count: { type: integer }
        usage_retention_days: { type: integer }
        redaction_retention_days: { type: integer }
        connection_logs_retention_days: { type: integer }
        connection_logs_rollups_retention_days: { type: integer }
        webhook_deliveries_retention_days: { type: integer }
        audit_retention_note:
          type: string
          description: Fixed text that says which audit entries the retention removes and which it keeps.
    Backup:
      type: object
      description: One backup archive in the relay's backup directory.
      required: [id, path, taken_at, version, size_bytes, db_sha256]
      properties:
        id: { type: string, description: The archive's file name without ".tar.gz". }
        path: { type: string, description: Path of the archive on the relay. }
        taken_at: { type: string, format: date-time }
        version: { type: string, description: The relay version that wrote the archive. }
        size_bytes: { type: integer, format: int64 }
        db_sha256: { type: string }

  responses:
    ProtectedResourceMetadata:
      description: The protected resource metadata document (CORS `*`).
      content:
        application/json:
          schema:
            type: object
            required: [resource, authorization_servers, scopes_supported]
            properties:
              resource: { type: string }
              authorization_servers: { type: array, items: { type: string } }
              scopes_supported: { type: array, items: { type: string } }
              bearer_methods_supported: { type: array, items: { type: string } }
              resource_name: { type: string }
    Unauthorized:
      description: Missing / invalid session or bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but the caller lacks permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ForbiddenOrReauth:
      description: |
        The caller lacks permission, or the route needs a recent password
        confirmation. While the relay has no services domain
        (`BURROW_SERVICES_DOMAIN`), this route answers 403
        `{"error":"reauth_required"}` to a dashboard session that has not
        confirmed its password in the last ten minutes: call
        `POST /api/v1/auth/reauth`, then repeat the request. Automation
        tokens are exempt.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string }
    PathServiceID:
      name: serviceID
      in: path
      required: true
      schema: { type: string }

# Default security: cookie+CSRF or bearer. Individual public routes override
# with `security: []`.
security:
  - CookieAuth: []
    CSRFToken: []
  - BearerAuth: []

paths:
  # ────────────────────────────────────────────────────────────────────────
  # Prometheus scrape (outside /api/v1 by convention; gated by metrics:read)
  # ────────────────────────────────────────────────────────────────────────
  /metrics:
    get:
      tags: [metrics]
      operationId: metricsGet
      x-burrow-permission: {kind: needs, any_of: ["metrics:read"]}
      summary: Prometheus 0.0.4 scrape (closed metric set)
      description: |
        Returns the Burrow closed-metric set in Prometheus text exposition
        format. Gated by admin OR the `metrics:read` permission.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Management MCP server (outside /api/v1; automation tokens only)
  # ────────────────────────────────────────────────────────────────────────
  /mcp/burrow:
    post:
      tags: [mcp]
      operationId: mcpManagement
      x-burrow-mcp: false
      summary: Management MCP endpoint (Streamable HTTP, stateless)
      description: |
        Burrow's own management tools for MCP clients. Each request carries
        one JSON-RPC 2.0 message as defined by the Model Context Protocol
        and is answered with one JSON body. The MCP revisions 2026-07-28,
        2025-11-25, 2025-06-18 and 2025-03-26 are served; no session is kept
        and no `Mcp-Session-Id` is issued.

        `tools/list` returns only the tools the token may call. `tools/call`
        on any other name is answered like a call on a tool that does not
        exist. The session cookie is not accepted.

        The token is an automation token (`bua_`) or an OAuth access token
        (`boa_`) issued for this endpoint. An OAuth token's permissions are
        its scopes (`burrow:read`, the role's read permissions;
        `burrow:write`, all of the role's; or permission strings)
        intersected with the user's role now. A tool call is replayed
        through the JSON API in-process, as the token's user; the JSON API
        itself never accepts an OAuth token. A 401 carries `WWW-Authenticate:
        Bearer resource_metadata="<issuer>/.well-known/oauth-protected-resource/mcp/burrow",
        scope="burrow:read"`, with `error="invalid_token"` when a token was
        presented and refused (a bare `Bearer` while the authorization server
        is off). At most 300 requests per
        token and minute and 1200 per client address and minute (the address
        limit applies before the token is looked at); bodies up to 1 MiB.
      security:
        - BearerAuth: []
        - OAuthAccessToken: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema: { type: string }
          description: The MCP revision of the request, as the client negotiated it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification.
      responses:
        '200':
          description: The JSON-RPC response; protocol errors are responses too.
          content:
            application/json:
              schema: { type: object }
        '202': { description: A notification was accepted. No body. }
        '400': { description: Not an MCP request (malformed JSON, a JSON-RPC batch, missing Accept, unsupported revision). Plain text. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sent by a browser from another origin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { description: Body over 1 MiB. Plain text. }
        '415': { description: Content-Type is not application/json. Plain text. }
        '429':
          description: Rate-limited, per token or per client address.
          headers:
            Retry-After:
              description: Seconds until the request may be retried.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [mcp]
      operationId: mcpManagementGet
      x-burrow-mcp: false
      summary: Not offered (the endpoint opens no server-to-client stream)
      security:
        - BearerAuth: []
        - OAuthAccessToken: []
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { description: 'Always. `Allow: POST`.' }
        '429':
          description: Rate-limited, per token or per client address.
          headers:
            Retry-After:
              description: Seconds until the request may be retried.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [mcp]
      operationId: mcpManagementDelete
      x-burrow-mcp: false
      summary: Not offered (the endpoint keeps no session to end)
      security:
        - BearerAuth: []
        - OAuthAccessToken: []
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sent by a browser from another origin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { description: 'Always. `Allow: POST`.' }
        '429':
          description: Rate-limited, per token or per client address.
          headers:
            Retry-After:
              description: Seconds until the request may be retried.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /mcp:
    post:
      tags: [mcp]
      operationId: mcpAggregated
      x-burrow-mcp: false
      summary: Every tool source behind one address (Streamable HTTP, stateless)
      description: |
        The tools of every enabled tool source that the gateway key may use,
        on one endpoint. A tool is named `<slug>__<tool>` (the tool part is
        the operator's rename when there is one), so two sources never
        collide, and the key's `allowed_tools` entries (`<slug>__*` or
        `<slug>__<tool>`) match exactly that name. The list is ordered by
        that name. An empty `allowed_tools` sees nothing.

        A tool is offered here only when its name is usable: `<slug>__<tool>`
        must be at most 64 characters, from `[A-Za-z0-9_-]`. A tool with a
        longer name or other characters (a dot, say) is offered on
        `/mcp/<slug>` only, and the catalog flags it (`aggregated_name`
        null, `aggregated_issue`); a rename fixes it. A tool in a name
        conflict is offered nowhere.

        Otherwise this is `/mcp/<slug>`: the same key, the same revisions and
        stateless handling, the same per-call pipeline (limits, redaction,
        guardrails, timeout, result cap, metering, audit), the same refusal
        of methods beyond tools, and the same answers for a tool that is not
        allowed or does not exist. A call is attributed to the source the
        name belongs to. `tools/list` is marked `cacheScope: private`, `ttlMs: 0`.

        An OAuth access token issued for `/mcp` is accepted in place of a key;
        its grant's `allowed_tools` and `tools_read_only` act like a key's,
        and its calls are attributed to the grant (`oauth_grant_id`), not to a
        gateway key. A 401 carries `WWW-Authenticate: Bearer
        resource_metadata="<issuer>/.well-known/oauth-protected-resource/mcp",
        scope="mcp:tools"`, with `error="invalid_token"` when a credential was
        presented and refused.
      security:
        - GatewayKey: []
        - OAuthAccessToken: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema: { type: string }
          description: The MCP revision of the request, as the client negotiated it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification.
      responses:
        '200':
          description: The JSON-RPC response; protocol errors are responses too.
          content:
            application/json:
              schema: { type: object }
        '202': { description: A notification was accepted. No body. }
        '400': { description: Not an MCP request (malformed JSON, a JSON-RPC batch, missing Accept, unsupported revision). }
        '401':
          description: No valid gateway key (missing, unknown, revoked, or its owner is suspended or may no longer configure the gateway).
          headers:
            WWW-Authenticate:
              description: A Bearer challenge.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Sent by a browser from another origin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { description: Body over 1 MiB. }
        '429':
          description: Rate-limited per client address (the bucket of `/mcp/{slug}`).
          headers:
            Retry-After:
              description: Seconds until the request may be retried.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The tool gateway is not configured on this relay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [mcp]
      operationId: mcpAggregatedGet
      x-burrow-mcp: false
      summary: Not offered (the endpoint opens no server-to-client stream)
      security:
        - GatewayKey: []
        - OAuthAccessToken: []
      responses:
        '401':
          description: No valid gateway key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { description: 'Always, for a valid key. `Allow: POST`.' }
    delete:
      tags: [mcp]
      operationId: mcpAggregatedDelete
      x-burrow-mcp: false
      summary: Not offered (the endpoint keeps no session to end)
      security:
        - GatewayKey: []
        - OAuthAccessToken: []
      responses:
        '401':
          description: No valid gateway key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { description: 'Always, for a valid key. `Allow: POST`.' }

  /mcp/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
        description: The tool source's slug.
    post:
      tags: [mcp]
      operationId: mcpToolSource
      x-burrow-mcp: false
      summary: One tool source behind gateway keys (Streamable HTTP, stateless)
      description: |
        The tools of one tool source, for MCP clients with a gateway key.
        Each request carries one JSON-RPC 2.0 message and is answered with
        one JSON body; the revisions of /mcp/burrow are served and no
        session is kept.

        `tools/list` returns the approved, visible tools the key's
        `allowed_tools` names (as `<slug>__<tool>` or `<slug>__*`, by the
        name the tool is served under; with `tools_read_only` only tools
        classed read-only). A call on any other name is answered like a call
        on a tool that does not exist. Tools keep their native names here,
        or the operator's rename. Methods beyond tools (`resources/*`,
        `prompts/*`, …) are refused with JSON-RPC error -32601.

        A `tools/call` passes the key's rate limits, then the source's
        concurrency (`max_concurrent`, 0 = no limit) and requests-per-minute
        limits (a limit hit is a JSON-RPC error whose data carries
        `retryAfterMs`). Rate limits with window minute count tool calls
        like model requests: those scoped to the gateway key, to the
        source's backing service and global ones; day-window quotas neither
        count nor refuse tool calls. Then come redaction (scopes
        `tool_arguments` and `tool_result`), the guardrail request patterns
        on the arguments and the answer patterns on the result, a timeout
        (the source's, at most 300 s) and a 1 MiB cap on the result. An
        unreachable upstream, a refusal or an oversized result is a tool
        result with `isError: true` and a short message. The call is
        metered (`kind` mcp), captured by the backing service's inspector
        when it is on, and audited (`mcp.gateway.call`).

        An OAuth access token issued for `/mcp/<slug>` (this source) is
        accepted in place of a key, and nowhere else; its grant's
        `allowed_tools` and `tools_read_only` act like a key's, its calls
        count against the backing service's and global rate limits, and they
        are attributed to the grant (`oauth_grant_id` on the usage row, the
        inspector entry and the audit row), not to a gateway key. A 401
        carries `WWW-Authenticate: Bearer
        resource_metadata="<issuer>/.well-known/oauth-protected-resource/mcp/<slug>",
        scope="mcp:tools"`, with `error="invalid_token"` when a credential was
        presented and refused (a bare `Bearer` while the authorization server
        is off).
      security:
        - GatewayKey: []
        - OAuthAccessToken: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema: { type: string }
          description: The MCP revision of the request, as the client negotiated it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 request or notification.
      responses:
        '200':
          description: The JSON-RPC response; protocol errors are responses too.
          content:
            application/json:
              schema: { type: object }
        '202': { description: A notification was accepted. No body. }
        '400': { description: Not an MCP request (malformed JSON, a JSON-RPC batch, missing Accept, unsupported revision). }
        '401':
          description: No valid gateway key (missing, unknown, revoked, or its owner is suspended or may no longer configure the gateway).
          headers:
            WWW-Authenticate:
              description: A Bearer challenge.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Sent by a browser from another origin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No enabled tool source has this slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { description: Body over 1 MiB. }
        '429':
          description: Rate-limited per client address.
          headers:
            Retry-After:
              description: Seconds until the request may be retried.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The tool gateway is not configured on this relay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [mcp]
      operationId: mcpToolSourceGet
      x-burrow-mcp: false
      summary: Not offered (the endpoint opens no server-to-client stream)
      security:
        - GatewayKey: []
        - OAuthAccessToken: []
      responses:
        '401':
          description: No valid gateway key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No enabled tool source has this slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { description: 'Always, for a valid key and source. `Allow: POST`.' }
    delete:
      tags: [mcp]
      operationId: mcpToolSourceDelete
      x-burrow-mcp: false
      summary: Not offered (the endpoint keeps no session to end)
      security:
        - GatewayKey: []
        - OAuthAccessToken: []
      responses:
        '401':
          description: No valid gateway key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No enabled tool source has this slug.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '405': { description: 'Always, for a valid key and source. `Allow: POST`.' }

  # ────────────────────────────────────────────────────────────────────────
  # OAuth 2.1 authorization server for MCP clients (outside /api/v1)
  # ────────────────────────────────────────────────────────────────────────
  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      operationId: oauthMetadataGet
      x-burrow-mcp: false
      security: []
      summary: Authorization server metadata (RFC 8414)
      description: >
        Public. The issuer is the dashboard's https origin
        (BURROW_AUTH_DOMAIN or the first ACME domain); endpoints, PKCE S256
        only, public clients only (`none`), authorization_code and
        refresh_token, client ID metadata documents, RFC 9207 `iss`. Without
        a configured issuer the authorization server is off and this and the
        other three OAuth endpoints answer 404, except to a request sent to a
        loopback host (development), whose issuer is that origin and whose
        answers are not cacheable.
      responses:
        '200':
          description: The metadata document.
          content:
            application/json:
              schema:
                type: object
                required: [issuer, authorization_endpoint, token_endpoint, revocation_endpoint, response_types_supported, grant_types_supported, code_challenge_methods_supported, token_endpoint_auth_methods_supported, scopes_supported, client_id_metadata_document_supported, authorization_response_iss_parameter_supported]
                properties:
                  issuer: { type: string }
                  authorization_endpoint: { type: string }
                  token_endpoint: { type: string }
                  revocation_endpoint: { type: string }
                  response_types_supported: { type: array, items: { type: string } }
                  response_modes_supported: { type: array, items: { type: string } }
                  grant_types_supported: { type: array, items: { type: string } }
                  code_challenge_methods_supported: { type: array, items: { type: string } }
                  token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
                  revocation_endpoint_auth_methods_supported: { type: array, items: { type: string } }
                  scopes_supported: { type: array, items: { type: string } }
                  client_id_metadata_document_supported: { type: boolean }
                  authorization_response_iss_parameter_supported: { type: boolean }
                  resource_indicators_supported: { type: boolean }
        '404': { description: The relay runs without an authorization server. }
  /.well-known/oauth-protected-resource:
    get:
      tags: [oauth]
      operationId: oauthProtectedResourceGet
      x-burrow-mcp: false
      security: []
      summary: Protected resource metadata of the origin (RFC 9728)
      description: >
        Public. The document for the origin itself (`resource` is the
        issuer). MCP clients use the document of the endpoint they connect
        to, at the path the 401 challenge names. 404 while the authorization
        server is off.
      responses:
        '200': { $ref: '#/components/responses/ProtectedResourceMetadata' }
        '404': { description: The relay runs without an authorization server. }
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [oauth]
      operationId: oauthProtectedResourceGatewayGet
      x-burrow-mcp: false
      security: []
      summary: Protected resource metadata of /mcp (RFC 9728)
      description: >
        Public. `resource` is `<issuer>/mcp`, `authorization_servers` the
        issuer, `scopes_supported` `mcp:tools`. 404 while the authorization
        server is off.
      responses:
        '200': { $ref: '#/components/responses/ProtectedResourceMetadata' }
        '404': { description: The relay runs without an authorization server. }
  /.well-known/oauth-protected-resource/mcp/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
        description: '`burrow` for the management server, else a tool source''s slug.'
    get:
      tags: [oauth]
      operationId: oauthProtectedResourceSourceGet
      x-burrow-mcp: false
      security: []
      summary: Protected resource metadata of /mcp/burrow or /mcp/<slug> (RFC 9728)
      description: >
        Public. `resource` is `<issuer>/mcp/<slug>`, `authorization_servers`
        the issuer; `scopes_supported` is `burrow:read`, `burrow:write` for
        the management server and `mcp:tools` for a tool source.
        `resource_name` is generic ("Burrow tools"): the source's name is not
        shown. 404 for an unknown or disabled tool source and while the
        authorization server is off; that an unauthenticated caller can tell
        which slugs exist this way is accepted (the MCP endpoint itself tells
        the same to any credential holder).
      responses:
        '200': { $ref: '#/components/responses/ProtectedResourceMetadata' }
        '404': { description: No such resource, or the relay runs without an authorization server. }
  /oauth/authorize:
    get:
      tags: [oauth]
      operationId: oauthAuthorize
      x-burrow-mcp: false
      security: []
      summary: Authorization endpoint
      description: >
        Public, 60 requests per address and minute. Checks the client (a
        pre-registered id, or an https client_id whose metadata document is
        fetched from a public address, at most 64 KiB in 5 s, no redirects,
        cached 5 minutes to 24 hours) and its redirect URI (exact; a loopback
        http URI may differ in port). Until both are known good an error is a
        page (400). Then PKCE S256, `resource` (one of this relay's MCP
        endpoints: /mcp/burrow, /mcp, /mcp/<slug> of an enabled source) and
        the scopes are checked; an error goes back to the redirect URI with
        `error`, `state` and `iss` (not cacheable). A valid request is kept
        ten minutes and the browser is sent to the consent page
        `/oauth/consent?request=<id>`. At most 20 requests per client address
        and 2000 in all wait for a decision; beyond that the client is told
        `temporarily_unavailable`.
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: resource, in: query, required: true, schema: { type: string } }
        - { name: scope, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
      responses:
        '302': { description: 'To the consent page, or back to the client with error, state and iss.' }
        '400': { description: The client or its redirect URI is not valid. An HTML page. }
        '429': { description: Too many requests from this address. }
  /oauth/token:
    post:
      tags: [oauth]
      operationId: oauthToken
      x-burrow-mcp: false
      security: []
      summary: Token endpoint
      description: >
        Public clients only: client_id in the body or as the user name of
        HTTP Basic with an empty password; a client secret is refused
        (invalid_client). `authorization_code` needs code, redirect_uri,
        code_verifier and client_id (and `resource`, if sent, must match). A
        code is good for 60 s and once: a second use revokes what the first
        one got, or keeps it from being issued when it lands first, and is
        audited as `oauth.refresh.reuse` too. A request naming another client
        does not use the code up. `refresh_token` rotates: every refresh token
        is good once, and using one again revokes the grant (audited as
        `oauth.refresh.reuse`). The rule is strict: two refreshes sent at
        once with the same token count as a reuse, so at most one gets new
        tokens and the grant is revoked; a client must refresh one at a time.
        `scope` on a refresh, if sent, must name exactly the grant's scopes
        (`invalid_scope` otherwise; narrowing is not offered). Access tokens
        (boa_) live one hour, refresh tokens (bor_) 30 days. 120 requests per
        address and minute.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
                client_id: { type: string }
                refresh_token: { type: string }
                resource: { type: string }
                scope: { type: string }
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [access_token, token_type, expires_in, refresh_token, scope]
                properties:
                  access_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer }
                  refresh_token: { type: string }
                  scope: { type: string }
        '400':
          description: An RFC 6749 error (invalid_request, invalid_grant, invalid_target, invalid_scope, unsupported_grant_type).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  error_description: { type: string }
        '401': { description: invalid_client (a client secret was sent). }
        '429': { description: Too many requests from this address. }
  /oauth/revoke:
    post:
      tags: [oauth]
      operationId: oauthRevoke
      x-burrow-mcp: false
      security: []
      summary: Token revocation (RFC 7009)
      description: >
        Public clients only (client_id as at the token endpoint). A refresh
        token revokes its grant, an access token itself. Answers 200 for an
        unknown token or another client's token too (and leaves the latter
        alone).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string }
                client_id: { type: string }
      responses:
        '200': { description: Revoked, or nothing to revoke. }
        '400': { description: A malformed request (invalid_request). }
        '401': { description: invalid_client (a client secret was sent). }
        '429': { description: Too many requests from this address. }

  # ────────────────────────────────────────────────────────────────────────
  # Auth (login is public; everything else requires a session)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      x-burrow-permission: {kind: public, any_of: []}
      x-burrow-mcp: false
      summary: Password login
      description: |
        Refuses login CSRF: a browser request from another origin (a
        `Sec-Fetch-Site` other than `same-origin` or `none`, or without that
        header an `Origin` that is not the request's host) gets 403, and a
        `text/plain` body gets 415. A request with neither header (a CLI)
        passes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session cookie issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: A cross-origin browser request (`cross-origin request refused`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: A text/plain body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate-limited (per-IP or global).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      x-burrow-permission: {kind: self, any_of: []}
      x-burrow-mcp: false
      summary: Clear the session cookie
      responses:
        '204': { description: Session cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/reauth:
    post:
      tags: [auth]
      operationId: authReauth
      x-burrow-permission: {kind: self, any_of: []}
      x-burrow-mcp: false
      summary: Confirm the caller's password
      description: |
        Opens a ten-minute window in which the current dashboard session may
        call the routes that mint a secret or change who may do what (they
        answer 403 `reauth_required` outside it). Needed only while the relay
        has no services domain (`BURROW_SERVICES_DOMAIN`); with one the call
        still succeeds and the guard is off. Rate-limited like sign-in, audited
        as `auth.reauth`; ten wrong passwords in a minute from one session lock that session for that minute (429); other sessions of the user are not affected. A dashboard session only: an automation token has no
        window and gets 403. A cross-origin browser request gets 403 as on
        POST /api/v1/auth/login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200':
          description: The window is open.
          content:
            application/json:
              schema:
                type: object
                required: [expires_at]
                properties:
                  expires_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Too many attempts. }

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      operationId: authChangePassword
      x-burrow-permission: {kind: self, any_of: []}
      x-burrow-mcp: false
      summary: Change the caller's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [auth]
      operationId: meGet
      x-burrow-permission: {kind: self, any_of: []}
      summary: Current authenticated principal
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Sessions
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/sessions:
    get:
      tags: [sessions]
      operationId: sessionsList
      x-burrow-permission: {kind: needs, any_of: ["sessions:manage:own", "sessions:manage:any"]}
      summary: List the caller's active sessions
      responses:
        '200':
          description: List of session records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/{id}:
    delete:
      tags: [sessions]
      operationId: sessionDelete
      x-burrow-permission: {kind: needs, any_of: ["sessions:manage:own", "sessions:manage:any"]}
      summary: Revoke one of the caller's sessions
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/revoke-all:
    post:
      tags: [sessions]
      operationId: sessionsRevokeAll
      x-burrow-permission: {kind: needs, any_of: ["sessions:manage:own", "sessions:manage:any"]}
      x-burrow-destructive: true
      summary: Revoke every session except the current one
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '200':
          description: Count of sessions revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Tokens (personal client tokens)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: clientTokensList
      x-burrow-permission: {kind: needs, any_of: ["tokens:manage:own", "tokens:manage:any"]}
      summary: List the caller's client tokens
      responses:
        '200':
          description: List of tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tokens]
      operationId: clientTokenCreate
      x-burrow-permission: {kind: needs, any_of: ["tokens:manage:own", "tokens:manage:any"]}
      x-burrow-mcp: false
      summary: Issue a new client token (plaintext returned ONCE)
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                expires_at:
                  type: string
                  format: date-time
                  description: >
                    Optional (RFC 3339). Must be in the future and at most 365
                    days ahead, else 400. Without it the token never expires.
                    When the caller authenticated with an automation token that
                    has an expiry, the new token expires no later than that
                    token: a later or missing value becomes the automation
                    token's expiry. A token that a sign-in request approval
                    mints has no expiry.
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                required: [name, token, expires_at]
                properties:
                  name: { type: string }
                  token: { type: string, description: The client token. Shown this once. }
                  expires_at: { type: string, format: date-time, nullable: true, description: The expiry the token got; null for none. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tokens/{id}:
    delete:
      tags: [tokens]
      operationId: clientTokenDelete
      x-burrow-permission: {kind: needs, any_of: ["tokens:manage:own", "tokens:manage:any"]}
      summary: Revoke a client token
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Token revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Tunnels (live runtime view) + v0.2 back-compat access-mode setter
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/tunnels:
    get:
      tags: [tunnels]
      operationId: tunnelsList
      x-burrow-permission: {kind: needs, any_of: ["tunnels:read:own", "tunnels:read:any"]}
      summary: List the caller's live tunnels
      responses:
        '200':
          description: List of tunnels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tunnel' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tunnels/{id}/access-mode:
    put:
      tags: [tunnels]
      operationId: tunnelAccessModeUpdate
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      x-burrow-mcp: false
      summary: Set tunnel access mode (v0.2 back-compat — delegates to services)
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_mode]
              properties:
                access_mode:
                  type: string
                  enum: [open, api_key, burrow_login]
                  description: mtls needs a CA bundle and is set with PUT /api/v1/services/{serviceID}/access-mode.
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '204': { description: Access mode set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The mode is not available on this relay or for this service (mTLS needs host routing). }

  # ────────────────────────────────────────────────────────────────────────
  # Services
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/services:
    get:
      tags: [services]
      operationId: servicesList
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: List services visible to the caller
      description: |
        The backing rows of direct AI providers (type "direct") are not
        listed; they are managed under /api/v1/ai/providers. Their API keys
        and AI configuration are reachable through the service endpoints by
        id, while a change of slug or access mode answers 409.
      responses:
        '200':
          description: List of services.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [services]
      operationId: serviceCreate
      x-burrow-permission: {kind: needs, any_of: ["services:configure:any"]}
      x-burrow-mcp: false
      summary: Admin pre-provisions a service row (v0.5.2)
      description: |
        Inserts a services row exactly as supplied so dashboard / e2e flows
        can target a known service_id before any client connects. Permission:
        admin. Audit: `service.create` with payload `{by_admin: true}`.
        Client-side `RegisterService` continues to upsert against the same
        row when the client subsequently connects with the same `service_id`.

        Not a tool of the management MCP server (`/mcp/burrow`): it sets the new service's access mode, and an agent steered by untrusted text must not widen access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id]
              properties:
                service_id:  { type: string, pattern: '^[a-z0-9_-]{3,64}$' }
                title:       { type: string, maxLength: 120 }
                access_mode: { type: string, enum: [public, open, api_key, burrow_login] }
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
                  description: Optional. Generated when the client first connects if omitted.
      responses:
        '201':
          description: Service row created.
          content:
            application/json:
              schema:
                type: object
                required: [id, slug, created_at]
                properties:
                  id:         { type: string }
                  slug:       { type: string }
                  created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: service_id or slug already in use. }

  /api/v1/services/slug-suggestion:
    get:
      tags: [services]
      operationId: serviceSlugSuggestionGet
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: Suggest a slug no service uses
      description: A suggestion only; uniqueness is enforced when the slug is saved.
      responses:
        '200':
          description: A free slug.
          content:
            application/json:
              schema:
                type: object
                required: [slug]
                properties:
                  slug: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}:
    get:
      tags: [services]
      operationId: serviceGet
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: Service detail (config + live state)
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: Service detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [services]
      operationId: serviceDelete
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: Delete the service
      description: >-
        The owner, or a holder of services:configure:any, deletes the service.
        Its URL stops working, and its API keys, access policy, domains, AI
        configuration, cache, budgets and rate limits go with it. Usage and cost
        history stay. Anyone else gets 404, as for a service that does not
        exist. A service that a client is connected for cannot be deleted (409):
        stop the client or remove the tunnel from its config first. A client
        that registers the same tunnel name later creates a new service, in
        mode open; the settings made in the dashboard do not come back. A
        service that an AI provider uses is also refused with 409: delete the
        provider, and the models that use it, first.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '204': { description: Service deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A client is connected for the service, or an AI provider (or a model that uses it) still uses it. }

  /api/v1/services/{serviceID}/access-mode:
    put:
      tags: [services]
      operationId: serviceAccessModeUpdate
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      x-burrow-mcp: false
      summary: Set the service's access mode
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessModeReq' }
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '204': { description: Access mode set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The mode is not available on this relay or for this service (mTLS needs host routing). }

  /api/v1/services/{serviceID}/slug:
    put:
      tags: [services]
      operationId: serviceSlugUpdate
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: Change the service's slug
      description: The old URL stops working immediately; there is no redirect.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
      responses:
        '200':
          description: Slug changed.
          content:
            application/json:
              schema:
                type: object
                required: [slug, url]
                properties:
                  slug: { type: string }
                  url:  { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Slug already in use. }

  /api/v1/services/{serviceID}/gateway-only:
    put:
      tags: [services]
      operationId: serviceGatewayOnlyUpdate
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      x-burrow-mcp: false
      summary: Reach the service through the AI gateway only
      description: |
        With `gateway_only` true the service answers 404 at `/svc/<slug>/`, on
        its custom domains and on every other direct address, exactly like a
        service that does not exist. It stays reachable through the AI gateway
        (`/ai/<provider>/`, `/openai/v1`, `/anthropic`), where the provider's
        policy and key checks apply as before. Same permission as the other
        service settings. Audited as `service.gateway_only.update`.

        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_only]
              properties:
                gateway_only: { type: boolean }
      responses:
        '200':
          description: Setting stored.
          content:
            application/json:
              schema:
                type: object
                required: [gateway_only]
                properties:
                  gateway_only: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The service is not an http service, or backs a direct AI provider. }

  /api/v1/services/{serviceID}/api-keys:
    get:
      tags: [services]
      operationId: serviceApiKeysList
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: List per-service API keys
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: List of api-key summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [services]
      operationId: serviceApiKeyCreate
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      x-burrow-mcp: false
      summary: Mint a new per-service API key (plaintext returned ONCE)
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '201':
          description: Key created.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, key]
                properties:
                  id: { type: string }
                  name: { type: string }
                  key: { type: string, description: The key. Shown this once. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/api-keys/{id}:
    delete:
      tags: [services]
      operationId: serviceApiKeyDelete
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: Revoke a per-service API key
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - { $ref: '#/components/parameters/PathID' }
      responses:
        '204': { description: Key revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{serviceID}/access-policy:
    get:
      tags: [services]
      operationId: serviceAccessPolicyGet
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: Get the role allowlist for burrow_login access
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: List of role names.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [services]
      operationId: serviceAccessPolicyUpdate
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: Replace the role allowlist
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items: { type: string }
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '204': { description: Policy updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/ip-geo:
    get:
      tags: [services]
      operationId: serviceIpGeoGet
      x-burrow-permission: {kind: needs, any_of: ["ipgeo:manage:own", "ipgeo:manage:any"]}
      summary: Get per-service IP / Geo allow / deny rules
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: IP/Geo configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIpGeo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [services]
      operationId: serviceIpGeoUpdate
      x-burrow-permission: {kind: needs, any_of: ["ipgeo:manage:own", "ipgeo:manage:any"]}
      summary: Replace per-service IP / Geo rules
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceIpGeoInput' }
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/cache/entries:
    delete:
      tags: [services, cache]
      operationId: serviceCacheEntriesDelete
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:own", "ai:configure:any"]}
      summary: Purge per-service exact-cache entries
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '204': { description: Purged. Nothing is returned. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/ai-config:
    get:
      tags: [services, cache]
      operationId: serviceAiConfigGet
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:own", "ai:configure:any"]}
      summary: Read per-service AI gateway configuration
      description: >
        Returns the stored service-level AI config blob, or an empty object
        ({}) when none has been written yet. Permission: service owner OR
        ai:configure:any (admin).
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: The stored AI config blob (or {} if unset).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAiConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [services, cache]
      operationId: serviceAiConfigUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:own", "ai:configure:any"]}
      x-burrow-mcp: false
      summary: Store per-service AI gateway configuration
      description: >
        Persists the service-level AI config blob. Validates
        cache.semantic.min_similarity (must be in [0.0, 1.0]) and
        cache.semantic.embedding_mode (must be "local" or "none"). All
        other fields are stored as-is. Permission: service owner OR
        ai:configure:any (admin).

        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAiConfig' }
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Inspector (per-service ring buffer + replay + SSE)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/services/{serviceID}/inspector/requests:
    get:
      tags: [inspector]
      operationId: inspectorRequestsList
      x-burrow-permission: {kind: needs, any_of: ["inspector:read:own", "inspector:read:any"]}
      summary: List captured requests
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: status
          in: query
          description: Only requests answered with this status.
          schema: { type: integer, minimum: 100, maximum: 599 }
        - name: q
          in: query
          description: Only requests whose method, path, provider or model contains this text (case-sensitive).
          schema: { type: string }
        - name: since
          in: query
          description: Only requests captured at or after this time.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Only requests captured at or before this time.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: At most this many requests. 0 or left out - no limit.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The captured requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InspectorEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/inspector/requests/{rid}:
    get:
      tags: [inspector]
      operationId: inspectorRequestGet
      x-burrow-permission: {kind: needs, any_of: ["inspector:read:own", "inspector:read:any"]}
      summary: Get a captured request envelope
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The captured request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectorEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{serviceID}/inspector/requests/{rid}/replay:
    post:
      tags: [inspector]
      operationId: inspectorRequestReplay
      x-burrow-permission: {kind: needs, any_of: ["inspector:replay:own", "inspector:replay:any"]}
      summary: Re-fire the captured request through the proxy chain
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectorReplayRequest' }
      responses:
        '200':
          description: The request was sent again; new_entry is what the inspector captured of it.
          content:
            application/json:
              schema:
                type: object
                required: [new_entry]
                properties:
                  new_entry: { $ref: '#/components/schemas/InspectorEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: The replay failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Replay engine unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/services/{serviceID}/inspector/requests/{rid}/replay-compare:
    post:
      tags: [inspector]
      operationId: inspectorRequestReplayCompare
      x-burrow-permission: {kind: needs, any_of: ["inspector:replay:own", "inspector:replay:any"]}
      summary: Replay and diff against the original response
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectorReplayRequest' }
      responses:
        '200':
          description: The captured request, its replay (sent past the cache) and what differs between the two responses.
          content:
            application/json:
              schema:
                type: object
                required: [original, replayed, diff]
                properties:
                  original: { $ref: '#/components/schemas/InspectorEntry' }
                  replayed: { $ref: '#/components/schemas/InspectorEntry' }
                  diff:
                    type: object
                    required: [headers, body]
                    properties:
                      headers:
                        type: array
                        description: One line per response header that differs.
                        items: { type: string }
                      body:
                        type: string
                        description: A unified diff of the response bodies; for a binary response a summary of the sizes.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: The replay failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Replay engine unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/services/{serviceID}/inspector/stream:
    get:
      tags: [inspector]
      operationId: inspectorStream
      x-burrow-permission: {kind: dashboard, any_of: ["inspector:read:own", "inspector:read:any"]}
      x-burrow-mcp: false
      summary: SSE stream of newly-captured requests (no timeout, no CSRF)
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: text/event-stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Cache (global settings + stats + purge)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/cache/settings:
    get:
      tags: [cache]
      operationId: cacheSettingsGet
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: Get prompt-cache settings
      responses:
        '200':
          description: Cache settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CacheSettingsView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [cache]
      operationId: cacheSettingsUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      summary: Replace prompt-cache settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CacheSettingsInput' }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cache/stats:
    get:
      tags: [cache]
      operationId: cacheStatsGet
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: Cache hit / miss / size counters
      responses:
        '200':
          description: Stats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CacheStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/cache/entries:
    delete:
      tags: [cache]
      operationId: cacheEntriesDelete
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      summary: Purge ALL cache entries (admin / ai:configure:any)
      responses:
        '204': { description: Purged, the exact-match and the semantic tier. Nothing is returned. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cache/semantic/entries:
    delete:
      tags: [cache]
      operationId: cacheSemanticEntriesDelete
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      summary: Purge ALL semantic cache entries (admin / ai:configure:any)
      description: >
        Clears the semantic similarity tier only; the exact-match cache is
        unaffected. In-memory chromem-go collections are also dropped so
        stale state does not survive until next process restart.
      responses:
        '204': { description: Cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Redaction
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/redaction/rules:
    get:
      tags: [redaction]
      operationId: redactionRulesList
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: List redaction rules
      responses:
        '200':
          description: The built-in and the custom rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedactionRules' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [redaction]
      operationId: redactionRuleCreate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      x-burrow-mcp: false
      summary: Create a new redaction rule
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedactionRuleInput' }
      responses:
        '201':
          description: Rule created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedactionRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }

  /api/v1/redaction/rules/{id}:
    put:
      tags: [redaction]
      operationId: redactionRuleUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      x-burrow-mcp: false
      summary: Update a redaction rule
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedactionRuleInput' }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Built-in rules are read-only. }
    delete:
      tags: [redaction]
      operationId: redactionRuleDelete
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      x-burrow-mcp: false
      summary: Delete a redaction rule
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }

  /api/v1/redaction/settings:
    get:
      tags: [redaction]
      operationId: redactionSettingsGet
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: Get redaction settings
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedactionSettingsView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [redaction]
      operationId: redactionSettingsUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      x-burrow-mcp: false
      summary: Replace redaction settings
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedactionSettingsInput' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }

  /api/v1/redaction/preview:
    post:
      tags: [redaction]
      operationId: redactionPreview
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      summary: Preview redaction of a sample payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: The text to scan, at most 1 MiB. An empty text has no match.
                scope: { type: string, enum: [request_body, response_body, both, tool_arguments, tool_result], default: request_body }
      responses:
        '200':
          description: Preview result.
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      required: [rule, start, end, value]
                      properties:
                        rule: { type: string, description: Name of the rule that matched. }
                        start: { type: integer, description: Byte offset of the match in body. }
                        end: { type: integer, description: Byte offset after the match. }
                        value: { type: string, description: The matched text. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Guardrails
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/guardrails/settings:
    get:
      tags: [guardrails]
      operationId: guardrailSettingsGet
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: Get prompt-injection guardrail settings
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardrailSettingsView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [guardrails]
      operationId: guardrailSettingsUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      x-burrow-mcp: false
      summary: Replace guardrail settings
      description: >
        400 when action is not log_only, refuse_403 or refuse_safe, when
        answers.action is not flag or block (empty means flag), or when
        custom_patterns has more than 50 entries or an entry with a bad or
        repeated id, a bundled id, an empty pattern, a pattern longer than
        512 characters, not valid Go RE2 syntax or matching empty text, a direction other than
        request, answer or both, or a description longer than 200
        characters. The message names the first bad pattern by id.
        400 as well for judge settings that break JudgeSettings: no model
        while enabled, a model that is no existing synthetic model ("judge
        model … does not exist", or "judge model … is disabled" for a model that
        is switched off), a policy longer than 4000 characters, a
        timeout_ms outside 500 to 30000, or a check or on_failure outside
        their values. answers, custom_patterns and judge keep their stored
        values when the body leaves them out.

        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardrailSettingsInput' }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/guardrails/preview:
    post:
      tags: [guardrails]
      operationId: guardrailPreview
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      summary: Test a custom pattern against a sample text
      description: >
        Lists where the pattern matches in text, as byte offsets into text, at
        most the first 100 matches (truncated says whether there were more).
        The pattern must be valid as a custom pattern: Go RE2 syntax, 1 to 512
        characters, not matching empty text; a 400 carries the message the
        settings update gives. The body is at most 64 KiB. Empty text gives an
        empty list. Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardrailPreviewRequest' }
      responses:
        '200':
          description: The matches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardrailPreviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/guardrails/patterns:
    get:
      tags: [guardrails]
      operationId: guardrailPatternsList
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: List bundled guardrail pattern names + descriptions
      description: >
        The bundled request patterns (direction request), then the bundled
        answer patterns (direction answer), each in match order. Regex
        sources are not returned. Custom patterns are part of the settings.
      responses:
        '200':
          description: List of patterns.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, description, direction]
                  properties:
                    id: { type: string }
                    description: { type: string }
                    direction: { type: string, enum: [request, answer] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Rate limits
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/rate-limits:
    get:
      tags: [rate-limits]
      operationId: rateLimitsList
      x-burrow-permission: {kind: needs, any_of: ["quotas:read:own", "quotas:read:any"]}
      summary: List configured rate-limit rules
      description: >
        Each rule is {id, scope, subject, dimension, limit, burst, window}.
        scope is one of api_key, gateway_key, model, role, service, global.
        The subject of a gateway_key rule is the gateway key's id; that of a
        model rule is the model's name on the gateway endpoints (a synthetic
        model's name, or "<provider>/<model>", which also covers requests on
        /ai/<provider>/…), matched exactly; it holds across all keys.
        dimension is rpm
        (requests) or bpm (estimated bytes / 4); window is minute or day (a
        day runs from UTC midnight).
      responses:
        '200':
          description: List of rules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RateLimit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [rate-limits]
      operationId: rateLimitCreate
      x-burrow-permission: {kind: needs, any_of: ["quotas:manage:any"]}
      summary: Create a rate-limit rule
      description: >
        Body {scope, subject, dimension, limit, burst, window}. scope is one
        of api_key, gateway_key, model, role, service, global; every scope
        but global needs a subject (at most 256 characters). Anything else is
        400, e.g. "scope must be one of
        api_key|gateway_key|model|role|service|global".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateLimitInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/rate-limits/usage:
    get:
      tags: [rate-limits]
      operationId: rateLimitUsageGet
      x-burrow-permission: {kind: needs, any_of: ["quotas:read:own", "quotas:read:any"]}
      summary: Current rate-limit consumption per rule
      description: >
        The rules that apply to one subject, each with used and
        reset_seconds. With scope=gateway_key the subject is a gateway key's
        id: its owner may ask, anyone else needs quotas:read:any (403
        otherwise, the same for a key that does not exist). With scope=model
        the usage is that of every key, so quotas:read:any is required.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [api_key, gateway_key, model, role, service, global]
        - name: subject
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The rules that apply, each with used and reset_seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RateLimitUsage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/rate-limits/{id}:
    put:
      tags: [rate-limits]
      operationId: rateLimitUpdate
      x-burrow-permission: {kind: needs, any_of: ["quotas:manage:any"]}
      summary: Update a rate-limit rule
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateLimitInput' }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [rate-limits]
      operationId: rateLimitDelete
      x-burrow-permission: {kind: needs, any_of: ["quotas:manage:any"]}
      summary: Delete a rate-limit rule
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Cost
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/cost/pricing:
    get:
      tags: [cost]
      operationId: costPricingGet
      x-burrow-permission: {kind: needs, any_of: ["quotas:read:own", "quotas:read:any", "cost:pricing:manage"]}
      summary: Get the model-pricing table
      responses:
        '200':
          description: Pricing rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostPricing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [cost]
      operationId: costPricingUpdate
      x-burrow-permission: {kind: needs, any_of: ["cost:pricing:manage"]}
      summary: Replace the pricing table (admin)
      description: |
        Replaces the whole table. It is stored in the database and outlives
        a restart: at start-up the saved entries are merged over the bundled
        table (or the file named by BURROW_PRICING_PATH); a saved entry wins
        for its model, models only the start-up table has keep their price.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostPricingInput' }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cost/summary:
    get:
      tags: [cost]
      operationId: costSummaryGet
      x-burrow-permission: {kind: needs, any_of: ["quotas:read:any"]}
      summary: Aggregated cost summary
      description: >
        Admin, or a role with quotas:read:any. The body is {window,
        total_usd, tokens_in, tokens_out, top_consumers, pct_of_budget,
        unpriced_requests}. With
        group_by it also carries group_by and groups: one {key, requests,
        tokens_in, tokens_out, usd} per gateway key (key = the key's id),
        model (the name clients asked for; a request on /ai/<provider>/… is
        recorded as "<provider>/<model>"), provider (slug), target_model
        ("<provider>/<model>" that answered) or dialect. Groups are sorted by
        usd descending, then key; the group with the empty key comes last and
        holds the traffic the dimension does not apply to, plus whatever lies
        beyond the first 200 groups. A request answered by a fallback target
        counts for the model the client asked for and the provider that
        answered. A row is priced by the cost its upstream reported, else by
        the price table entry "<provider>/<target model>", then the target
        model, then the request kind. Prompt-cache tokens of an Anthropic
        answer count as input tokens.
      parameters:
        - name: window
          in: query
          description: today is the current UTC day; week, month and year are the last 7, 30 and 365 days.
          schema:
            type: string
            enum: [today, week, month, year]
            default: today
        - name: group_by
          in: query
          schema:
            type: string
            enum: [gateway_key, model, provider, target_model, dialect]
      responses:
        '200':
          description: Summary rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostSummary' }
        '400':
          description: >
            "window must be one of today|week|month|year" or "group_by must be
            one of gateway_key|model|provider|target_model|dialect".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cost/export:
    get:
      tags: [cost]
      operationId: costExport
      x-burrow-permission: {kind: needs, any_of: ["quotas:read:any"]}
      x-burrow-mcp: false
      summary: CSV export of cost data
      description: >
        One row per (service, service key, kind, gateway key, dialect,
        provider, requested model, target model) of the window, as ndjson
        (format=ndjson, the default) or CSV (format=csv). The route columns
        gateway_key_id, dialect, provider, requested_model, target_model and
        requests follow the token and byte columns; they are empty for
        traffic that did not come through a gateway key.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [ndjson, csv], default: ndjson }
        - name: window
          in: query
          schema: { type: string, enum: [today, week, month, year], default: today }
      responses:
        '200':
          description: A file download in the chosen format.
          content:
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/budgets:
    get:
      tags: [cost]
      operationId: budgetsList
      x-burrow-permission: {kind: needs, any_of: ["budgets:manage"]}
      summary: List budgets (admin)
      description: >
        Each budget is {id, scope, subject_id, daily_usd, daily_tokens,
        action_on_exceed, alert_webhook_id, current_usd, current_tokens,
        exceeded}. scope is one of api_key, service, user, global,
        gateway_key (subject_id = the gateway key's id) and model (subject_id
        = the model's name on the gateway endpoints: a synthetic model's name
        or "<provider>/<model>"; a request on /ai/<provider>/… counts for
        "<provider>/<model>" too, and a budget on a synthetic name counts
        only requests that asked for that name). daily_tokens caps input plus
        output tokens per UTC day; 0 means no token cap. A budget with a
        token cap is exceeded when current_tokens is above it, or when it
        also has a daily_usd above 0 and current_usd is above that; a budget
        without one is exceeded when current_usd is above daily_usd. A
        gateway_key or model budget whose action is throttle_zero or
        disable_key stops requests at the gateway while it is exceeded: 429
        budget_exceeded with Retry-After until UTC midnight, before any
        provider is called (disable_key on a gateway_key budget also revokes
        the key). A change takes up to 15 seconds to reach the gateway.
      responses:
        '200':
          description: List of budgets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [cost]
      operationId: budgetCreate
      x-burrow-permission: {kind: needs, any_of: ["budgets:manage"]}
      summary: Create a budget
      description: >
        Body {scope, subject_id, daily_usd, daily_tokens, action_on_exceed,
        alert_webhook_id}. daily_usd and daily_tokens must not be negative
        and at least one must be above 0: a token cap alone is a complete
        budget (a flat-rate provider costs 0 USD). Every scope but global
        needs a subject_id of at most 256 characters. subject_id is taken as
        sent, never trimmed: 400 "subject_id must not have leading or
        trailing whitespace" or "subject_id must not contain control
        characters" otherwise. For scope gateway_key it must be the id of an
        existing gateway key (revoked or not, of any user): 400 "unknown
        gateway key" otherwise. For scope model it is the model's name on the
        gateway endpoints: a synthetic model's name, or "<provider>/<model>".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/budgets/{id}:
    put:
      tags: [cost]
      operationId: budgetUpdate
      x-burrow-permission: {kind: needs, any_of: ["budgets:manage"]}
      summary: Update a budget
      description: Same body and rules as creating one; every field is replaced.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetInput' }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [cost]
      operationId: budgetDelete
      x-burrow-permission: {kind: needs, any_of: ["budgets:manage"]}
      summary: Delete a budget
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Audit
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/audit/events:
    get:
      tags: [audit]
      operationId: auditEventsList
      x-burrow-permission: {kind: needs, any_of: ["audit:read"]}
      summary: Query audit events
      description: |
        For a token caller (automation token or OAuth grant) the `reason` of
        `mcp.gateway.call` rows and the `error` of `mcp.source.sync` rows are
        shown as fixed classes (such as `upstream error`, `upstream
        unreachable`, `refused by a guardrail`, `limit reached`): they can
        carry words a tool source's upstream wrote. A dashboard session sees
        them as stored. The stored rows and the chain are not changed.
      parameters:
        - name: action
          in: query
          description: Only events with exactly this action.
          schema: { type: string }
        - name: actor
          in: query
          description: Only events of this actor, by id or email.
          schema: { type: string }
        - name: q
          in: query
          description: Only events whose action, subject label or actor email contains this text.
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: before_id
          in: query
          description: Only events older than the one with this id (the last id of the page before).
          schema: { type: string }
      responses:
        '200':
          description: One page of audit rows, newest first; an empty list when there are no more.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/audit/export:
    get:
      tags: [audit]
      operationId: auditExport
      x-burrow-permission: {kind: needs, any_of: ["audit:read"]}
      x-burrow-mcp: false
      summary: Export audit chain (signed JSONL)
      parameters:
        - name: action
          in: query
          schema: { type: string }
        - name: actor
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: JSONL stream.
          content:
            application/x-ndjson:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/audit/fingerprint:
    get:
      tags: [audit]
      operationId: auditFingerprintGet
      x-burrow-permission: {kind: needs, any_of: ["audit:read"]}
      summary: Audit signing-key public fingerprint
      responses:
        '200':
          description: Fingerprint.
          content:
            application/json:
              schema:
                type: object
                required: [public_key, fingerprint]
                properties:
                  public_key:
                    type: string
                    description: The audit signing key's public half, base64. The private key is never returned.
                  fingerprint:
                    type: string
                    description: SHA-256 of the public key, lower-case hex.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/audit/verify:
    post:
      tags: [audit]
      operationId: auditVerify
      x-burrow-permission: {kind: needs, any_of: ["audit:read"]}
      summary: Verify a range of audit chain entries
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Narrows the range; without a body the whole chain is verified.
              properties:
                from_id: { type: string }
                to_id: { type: string }
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  first_id: { type: string, description: Oldest row of the range; left out when the range is empty. }
                  last_id: { type: string, description: Newest row of the range; left out when the range is empty. }
                  mismatched_id:
                    type: string
                    description: The first row whose hash does not match; left out when ok is true.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Webhooks
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/webhooks:
    get:
      tags: [webhooks]
      operationId: webhooksList
      x-burrow-permission: {kind: needs, any_of: ["webhooks:manage"]}
      summary: List webhooks
      responses:
        '200':
          description: List of webhooks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Webhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [webhooks]
      operationId: webhookCreate
      x-burrow-permission: {kind: needs, any_of: ["webhooks:manage"]}
      x-burrow-mcp: false
      summary: Create a webhook (signing_secret returned ONCE)
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInput' }
      responses:
        '201':
          description: Webhook created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }

  /api/v1/webhooks/deliveries:
    get:
      tags: [webhooks]
      operationId: webhookDeliveriesList
      x-burrow-permission: {kind: needs, any_of: ["webhooks:manage"]}
      summary: List delivery attempts (recent)
      parameters:
        - name: webhook_id
          in: query
          description: Only the deliveries of this webhook.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
      responses:
        '200':
          description: Delivery rows, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/webhooks/{id}:
    put:
      tags: [webhooks]
      operationId: webhookUpdate
      x-burrow-permission: {kind: needs, any_of: ["webhooks:manage"]}
      x-burrow-mcp: false
      summary: Update a webhook
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInput' }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
    delete:
      tags: [webhooks]
      operationId: webhookDelete
      x-burrow-permission: {kind: needs, any_of: ["webhooks:manage"]}
      x-burrow-mcp: false
      summary: Delete a webhook
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/webhooks/{id}/test:
    post:
      tags: [webhooks]
      operationId: webhookTest
      x-burrow-permission: {kind: needs, any_of: ["webhooks:manage"]}
      x-burrow-mcp: false
      summary: Trigger a synchronous test delivery
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: A webhook.test event went through the delivery cycle. GET /api/v1/webhooks/deliveries shows the outcome. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500':
          description: The delivery failed; the message says why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/webhooks/{id}/pause:
    post:
      tags: [webhooks]
      operationId: webhookPause
      x-burrow-permission: {kind: needs, any_of: ["webhooks:manage"]}
      x-burrow-mcp: false
      summary: Pause webhook deliveries
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Paused. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/webhooks/{id}/resume:
    post:
      tags: [webhooks]
      operationId: webhookResume
      x-burrow-permission: {kind: needs, any_of: ["webhooks:manage"]}
      x-burrow-mcp: false
      summary: Resume webhook deliveries
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Resumed. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/webhooks/{id}/preview:
    post:
      tags: [webhooks]
      operationId: webhookPreview
      x-burrow-permission: {kind: needs, any_of: ["webhooks:manage"]}
      summary: Preview a payload template with caller-supplied fields
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: Event name for the default body; not used when the webhook has a payload template.
                fields:
                  type: object
                  description: The values the template (or the default body's "data") is rendered with.
                  additionalProperties: true
      responses:
        '200':
          description: Rendered template body and byte count.
          content:
            application/json:
              schema:
                type: object
                required: [rendered, size_bytes]
                properties:
                  rendered: { type: string, description: The request body as it would be sent. }
                  size_bytes: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Automation (bearer-token API)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/automation/presets:
    get:
      tags: [automation]
      operationId: automationPresetsList
      x-burrow-permission: {kind: needs, any_of: ["automation:tokens:manage:own", "automation:tokens:manage:any"]}
      summary: List the presets an automation token can be made from
      description: >
        Each preset's permission list is cut to the permissions the caller
        holds. A token stores the list sent when it is minted, not the preset's
        name, so a later change to a preset never widens an existing token.
      responses:
        '200':
          description: The presets, in the order read-only, operator, full.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutomationPreset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/automation/tokens:
    get:
      tags: [automation]
      operationId: automationTokensList
      x-burrow-permission: {kind: needs, any_of: ["automation:tokens:manage:own", "automation:tokens:manage:any"]}
      summary: List automation bearer tokens
      responses:
        '200':
          description: List of token summaries (no plaintext).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AutomationToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [automation]
      operationId: automationTokenCreate
      x-burrow-permission: {kind: needs, any_of: ["automation:tokens:manage:own", "automation:tokens:manage:any"]}
      summary: Mint an automation bearer token (plaintext returned ONCE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: No other field is accepted.
              required: [name]
              properties:
                name: { type: string }
                permissions:
                  type: array
                  description: >
                    The permission keys the token declares. Each must be
                    granted by the caller's role (403 otherwise).
                  items: { type: string }
                expires_at:
                  type: string
                  format: date-time
                  description: Left out, the token does not expire.
      responses:
        '201':
          description: Token minted.
          content:
            application/json:
              schema:
                type: object
                required: [token, plaintext]
                properties:
                  token: { $ref: '#/components/schemas/AutomationToken' }
                  plaintext:
                    type: string
                    description: The bearer token ("bua_" and the secret). Shown this once.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }

  /api/v1/automation/tokens/{id}:
    delete:
      tags: [automation]
      operationId: automationTokenDelete
      x-burrow-permission: {kind: needs, any_of: ["automation:tokens:manage:own", "automation:tokens:manage:any"]}
      summary: Revoke an automation bearer token
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Backups
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/backups:
    get:
      tags: [backups]
      operationId: backupsList
      x-burrow-permission: {kind: needs, any_of: ["backup:run"]}
      summary: List backup archives on disk
      responses:
        '200':
          description: List of backups.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Backup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [backups]
      operationId: backupCreate
      x-burrow-permission: {kind: needs, any_of: ["backup:run"]}
      summary: Trigger a new backup
      responses:
        '202':
          description: The archive was written; it is listed by GET /api/v1/backups under this id.
          content:
            application/json:
              schema:
                type: object
                required: [id, started_at]
                properties:
                  id: { type: string }
                  started_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/backups/{id}:
    delete:
      tags: [backups]
      operationId: backupDelete
      x-burrow-permission: {kind: needs, any_of: ["backup:run"]}
      summary: Delete a backup archive
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/backups/{id}/download:
    get:
      tags: [backups]
      operationId: backupDownload
      x-burrow-permission: {kind: needs, any_of: ["backup:run"]}
      x-burrow-mcp: false
      summary: Stream a backup archive
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '200':
          description: gzipped tarball.
          content:
            application/x-gzip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backups/{id}/verify:
    post:
      tags: [backups]
      operationId: backupVerify
      x-burrow-permission: {kind: needs, any_of: ["backup:run"]}
      summary: Verify a backup archive
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, sha256_match]
                properties:
                  ok: { type: boolean }
                  sha256_match: { type: boolean }
                  expected_sha256: { type: string, description: The digest the archive's manifest states. }
                  actual_sha256: { type: string, description: The digest of the database in the archive. }
                  error:
                    type: string
                    description: Why the archive could not be read; then ok is false and the digests are left out.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/backups/restore:
    post:
      tags: [backups]
      operationId: backupRestore
      x-burrow-permission: {kind: needs, every: true, any_of: ["backup:run"]}
      x-burrow-destructive: true
      x-burrow-mcp: false
      summary: Upload + restore an archive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive:
                  type: string
                  format: binary
                  description: The backup archive (.tar.gz), at most 64 MiB.
      responses:
        '202':
          description: Restore accepted (poll status endpoint).
          content:
            application/json:
              schema:
                type: object
                required: [restore_id]
                properties:
                  restore_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }

  /api/v1/backups/restores/{id}:
    get:
      tags: [backups]
      operationId: backupRestoreGet
      x-burrow-permission: {kind: needs, any_of: ["backup:run"]}
      x-burrow-mcp: false
      summary: Poll restore status
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '200':
          description: Status envelope.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, started_at, ended_at]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [running, done, failed] }
                  error: { type: string, description: Set when status is failed. }
                  started_at: { type: string, format: date-time }
                  ended_at:
                    type: string
                    format: date-time
                    description: 0001-01-01T00:00:00Z while the restore is running.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Roles (catalog + custom-role CRUD)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/roles:
    get:
      tags: [roles]
      operationId: rolesList
      x-burrow-permission: {kind: needs, any_of: ["roles:read", "roles:manage"]}
      summary: List roles (admin)
      responses:
        '200':
          description: List of roles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [roles]
      operationId: roleCreate
      x-burrow-permission: {kind: needs, any_of: ["roles:manage"]}
      x-burrow-mcp: false
      summary: Create a custom role
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }

  /api/v1/roles/permissions:
    get:
      tags: [roles]
      operationId: rolePermissionsList
      x-burrow-permission: {kind: needs, any_of: ["roles:read", "roles:manage", "automation:tokens:manage:own", "automation:tokens:manage:any"]}
      summary: List the permission catalog (every signed-in user)
      responses:
        '200':
          description: List of permissions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Permission' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/roles/{name}:
    get:
      tags: [roles]
      operationId: roleGet
      x-burrow-permission: {kind: needs, any_of: ["roles:read", "roles:manage"]}
      summary: Get a role (admin)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Role detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [roles]
      operationId: roleUpdate
      x-burrow-permission: {kind: needs, any_of: ["roles:manage"]}
      x-burrow-mcp: false
      summary: Update a custom role
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A field that is left out keeps its stored value.
              properties:
                description: { type: string }
                permissions:
                  type: array
                  description: Replaces the whole set. An unknown key is refused with 400.
                  items: { type: string }
                default_for_new_users: { type: boolean }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
    delete:
      tags: [roles]
      operationId: roleDelete
      x-burrow-permission: {kind: needs, any_of: ["roles:manage"]}
      x-burrow-mcp: false
      summary: Delete a custom role
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }

  # ────────────────────────────────────────────────────────────────────────
