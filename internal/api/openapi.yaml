        Validates and persists one or more retention settings. Omitted fields
        are left unchanged. Returns 204 on success, 400 on out-of-range values.

        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionSettingsInput' }
      responses:
