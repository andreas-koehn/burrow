openapi: 3.0.3
info:
  title: Burrow JSON API
  description: |
    The hand-written canonical OpenAPI v3 description of the Burrow JSON API
    (unified across v0.2.0, v0.3.0, and v0.4.0).

    Coverage is locked by `TestOpenAPI_RouteCoverage` in
    `internal/api/openapi_test.go`: every route the chi mux answers must
    appear in this document or the build fails. Health probes (`/healthz`,
    `/readyz`) and the doc-serving endpoints (`/api/v1/openapi.{yaml,json}`)
    are excluded by convention.

    Schemas are intentionally minimal — the goal is shape coverage for SDK
    code-generators (TypeScript-fetch, Go), not exhaustive validation. Full
    schemas can be filled in incrementally without invalidating downstream
    SDKs (additive only).
  version: 0.4.0
  license:
    name: MIT
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost:8080
        description: Burrow control-plane host.

tags:
  - name: auth
    description: Session login, logout, password change, passkey enrolment.
  - name: users
    description: Admin user management.
  - name: roles
    description: Roles + permission catalog (editable custom roles).
  - name: sessions
    description: Per-user session list / revoke.
  - name: tokens
    description: Personal client tokens (burrowc connect).
  - name: tunnels
    description: Live tunnels owned by the caller.
  - name: services
    description: Durable per-service config (access mode, api-keys, policy, ip/geo, inspector, cache).
  - name: cache
    description: Exact-match prompt cache (settings, stats, purge).
  - name: redaction
    description: PII / secret redaction rules + preview.
  - name: guardrails
    description: Prompt-injection guardrails settings.
  - name: models
    description: AI providers, synthetic models and gateway keys.
  - name: rate-limits
    description: Quota + rate-limit CRUD and usage.
  - name: cost
    description: Cost pricing + budgets + summary / export.
  - name: inspector
    description: Per-service request inspector (ring buffer, replay, SSE).
  - name: audit
    description: Audit log events + chain verify / export / fingerprint.
  - name: webhooks
    description: Outbound HMAC webhooks (CRUD + deliveries + test/pause/resume).
  - name: automation
    description: Bearer-token automation API.
  - name: backups
    description: Backup / restore JSON API.
  - name: geo
    description: Global geo lookup status.
  - name: settings
    description: Admin settings (config + SMTP test + retention).
  - name: clients
    description: Live client (control session) overview.
  - name: events
    description: Server-sent events stream (dashboard refresh).
  - name: metrics
    description: Prometheus 0.0.4 scrape endpoint.
  - name: openapi
    description: OpenAPI spec discovery and embedded browser viewer.
  - name: database
    description: Database backend status (driver, connection URL, alpha flag).

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: burrow_session
      description: |
        Session cookie issued by POST /api/v1/auth/login. State-changing
        cookie-authed requests MUST also send the burrow_csrf double-submit
        header (`X-CSRF-Token`).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bua_<token>
      description: |
        Automation bearer token (`Authorization: Bearer bua_...`). Bypasses
        CSRF (the token IS the CSRF defense). Permissions are the
        intersection of the user's current role and the set declared at
        mint time.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit token for cookie-authed state-changing requests.
        Value mirrors the burrow_csrf cookie.

  schemas:
    AIProvider:
      type: object
      description: >
        One model provider: a slug under which a model backend is served at
        base_url. Identity fields come from the providers table;
        api_key_count, status and the 24h counts are read live from the
        backing service. latency_p95_ms is always 0.
      required: [slug, name, kind, api_format, service_id, base_url, upstream_base_url, credential_slot, credential_present, credential_slots, breaker_open, billing, supports_responses, max_concurrent, in_use, model_count, model_alias, concrete_model, backend_type, api_key_count, requests_24h, cache_hits_24h, latency_p95_ms, status, client_session_id]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
        name: { type: string }
        kind: { type: string, enum: [tunnel, direct] }
        api_format: { type: string, enum: [openai, anthropic] }
        service_id:
          type: string
          description: >
            The backing service. For a direct provider this is its own row
            of type "direct", named like the provider; it holds the
            provider's API keys and AI configuration and is not listed by
            GET /api/v1/services. Its upstream-credential and domains routes
            answer 409, like its slug and access-mode routes.
        base_url:
          type: string
          description: >
            https://<auth_domain>/ai/<provider>/v1, or "" when the relay has
            no auth domain.
        upstream_base_url:
          type: string
          description: Direct providers only. Where the relay sends requests; "" for a tunnel provider.
          example: https://openrouter.ai/api/v1
        credential_slot:
          type: string
          description: >
            Direct providers only. Name of the vault slot that holds the
            upstream credential. The credential itself is configured on the
            relay and is never accepted or returned by this API.
          example: OPENROUTER
        credential_present:
          type: boolean
          description: >
            Whether the vault holds a value for the slot. For a provider
            with several slots: whether it holds one for every slot.
        credential_slots:
          type: array
          readOnly: true
          description: >
            The slots credential_slot names, in the order they are tried,
            each with whether the vault holds a value for it. Never the
            value. Empty for a tunnel provider.
          items:
            type: object
            required: [slot, present]
            properties:
              slot: { type: string, example: ZAI }
              present: { type: boolean }
        breaker_open:
          type: boolean
          readOnly: true
          description: >
            Whether the gateway is skipping the provider right now because
            recent requests to it failed. It is tried again automatically
            after a short pause; reading this field does not start that
            trial. The state is kept in memory and starts closed after a
            restart.
        auth_header:
          type: string
          description: >
            Direct providers, admin callers only. The request header that
            carries the credential upstream. Left out for other callers and
            for tunnel providers.
          example: Authorization
        auth_format:
          type: string
          description: >
            Direct providers, admin callers only. The header value with the
            literal placeholder {key} where the relay puts the credential;
            the credential itself is never part of it.
          example: 'Bearer {key}'
        extra_header_names:
          type: array
          items: { type: string }
          description: >
            Direct providers, admin callers only. Names, sorted, of the
            static headers the relay adds to every upstream request; []
            when there are none. The values are write-only: they are set
            with extra_headers in the request body and never returned.
        billing: { type: string, enum: [metered, flat] }
        supports_responses:
          type: boolean
          description: >
            Whether the provider offers the OpenAI Responses API
            (POST /responses), as its operator stated; nothing probes the
            upstream. While it is false, POST /openai/v1/responses (and
            /ai/v1/responses) for a model of this provider answers 400
            endpoint_unsupported without calling the provider. The
            provider's own path, /ai/<provider>/v1/responses, is passed
            through whatever this says. Always false for a provider whose
            api_format is anthropic.
        max_concurrent:
          type: integer
          minimum: 0
          maximum: 1000
          description: >
            How many requests the provider serves at once; 0 means no limit.
            The limit covers every way to the provider: /ai/<provider>/…
            (POST requests) and the dialect endpoints, where each credential
            slot shares it. A request that finds no free place waits, for at
            most 60 seconds or the model's attempt timeout, whichever is
            shorter. When none comes free the next target of the model is
            tried; with none left the answer is 429 provider_busy with a
            Retry-After header. A change applies from the next request on;
            requests already being served are not interrupted.
        in_use:
          type: integer
          readOnly: true
          description: >
            How many of the max_concurrent places are taken at this moment.
            Always 0 while max_concurrent is 0.
        model_count:
          type: integer
          description: Number of entries in the provider's stored model list.
        model_alias:
          type: string
          description: >
            Name of the first synthetic model, by name, that targets this
            provider; empty when none does. (The field named a model alias
            before aliases became synthetic models.)
        concrete_model:
          type: string
          description: The model that synthetic model sends to this provider.
        backend_type:
          type: string
          enum: [other]
          description: Always "other"; kept for clients that read it.
        api_key_count: { type: integer }
        requests_24h: { type: integer }
        cache_hits_24h: { type: integer }
        latency_p95_ms: { type: integer }
        status:
          type: string
          enum: [Connected, Degraded, Offline]
          description: >
            Tunnel provider: whether its client is connected. Direct provider:
            Connected when the credential slot is set, Offline otherwise.
        client_session_id: { type: string }
    AIProviderUpstream:
      type: object
      description: >
        Upstream settings of a direct provider. There is no field for the
        credential: credential_slot names a vault slot whose value is
        configured on the relay.
      properties:
        api_format: { type: string, enum: [openai, anthropic], default: openai }
        base_url:
          type: string
          maxLength: 2048
          description: >
            https URL of the upstream API, without credentials, query or
            fragment. Unless the relay allows private upstreams, a host that
            is or resolves to a private, loopback or link-local address is
            refused.
          example: https://openrouter.ai/api/v1
        credential_slot:
          type: string
          pattern: '^[A-Z0-9_]{1,32}$'
          example: OPENROUTER
        auth_header:
          type: string
          default: Authorization
          description: Header that carries the credential. An RFC 7230 token; not a hop-by-hop or forwarding header.
        auth_format:
          type: string
          maxLength: 128
          default: 'Bearer {key}'
          description: Value of the auth header. Must contain "{key}" exactly once; no control characters.
        extra_headers:
          type: object
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 512 }
          description: >
            Static headers sent with every upstream request; at most 16 and
            4096 bytes in total. Names are RFC 7230 tokens, values carry no
            control characters. Refused names: Host, Content-Length,
            Transfer-Encoding, Connection, Keep-Alive, TE, Trailer, Upgrade,
            Proxy-*, Authorization, X-Api-Key, Cookie, Forwarded,
            X-Forwarded-* and the auth header itself. Values are not returned
            by any endpoint.
          example: { X-Title: Burrow }
        billing: { type: string, enum: [metered, flat], default: metered }
        supports_responses:
          type: boolean
          description: >
            Whether the provider offers the OpenAI Responses API
            (POST /responses). Left out, it is false on create and keeps
            its stored value on update. true is refused with 400 unless
            api_format is openai; a provider cannot change to another
            format while it is true.
        max_concurrent:
          type: integer
          minimum: 0
          maximum: 1000
          description: >
            How many requests the provider serves at once; 0 means no limit.
            Left out, it is 0 on create and keeps its stored value on
            update. A value outside 0-1000 is refused with 400.
    AIModelTarget:
      type: object
      description: One provider and model a synthetic model can be sent to.
      required: [provider, model]
      properties:
        dialect:
          type: string
          enum: [openai, anthropic]
          description: >
            The API format the target is used for. It must equal the
            provider's api_format; left out of a request, it is filled in
            from the provider.
        provider:
          type: string
          description: Slug of an existing provider.
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: The provider's own model id. No control characters.
        available:
          type: boolean
          readOnly: true
          description: >
            Whether the target can be tried right now: its provider exists
            and speaks the target's dialect, the gateway is not skipping the
            provider (see breaker_open of the provider), and for a direct
            provider every credential slot is set, for a tunnel provider
            its client is connected. Responses only; a request that carries
            it is refused with 400.
    AIServingTarget:
      type: object
      nullable: true
      description: The target that answers right now; null when none is available.
      properties:
        provider: { type: string }
        model: { type: string }
    AIRequestAttempt:
      type: object
      description: >
        One attempt of a gateway request, as the attempt log holds it. It
        carries no credential, slot name, header or upstream body.
      required: [position, provider, model, status, error_code, duration_ms, ts]
      properties:
        position:
          type: integer
          description: >
            The order the attempts were made in, from 0. Not the position
            of a target in the model's list: a provider with several
            credential slots is tried once per slot, and targets the
            endpoint does not fit are left out.
        provider: { type: string, description: Provider slug. }
        model: { type: string, description: The provider's own model id. }
        status:
          type: integer
          description: Upstream HTTP status; 0 when none was received.
        error_code:
          type: string
          description: >
            Empty for the attempt that answered. Otherwise http_<status>,
            timeout, no_response, busy, breaker_open, dialect_mismatch,
            client_closed, stream_aborted, panic, or for a translated
            attempt upstream_invalid, upstream_error or translate_error.
        duration_ms: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
    AIModel:
      type: object
      description: >
        A synthetic model: a name that clients send as "model" on the
        gateway's endpoints and that resolves to an ordered list of provider
        targets per dialect. A request reaches the targets of its own
        dialect. Only when the model has none that can serve the endpoint
        and translate is on does it reach a target of the other dialect,
        through a translating pair (see translate and dialect_modes).
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,62}$'
          description: >
            Never contains "/". "v1" is reserved, and a name cannot equal a
            provider slug.
        description: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        fallback_on_rate_limit: { type: boolean }
        translate:
          type: boolean
          default: false
          description: >
            Lets a request in a format the model has no target for be
            translated to a target of another format. Off unless switched
            on: without it such a request is refused with 400. A request
            the model can serve in its own format is never translated.
            Left out, it is false on create and keeps its stored value on
            update.
        attempt_timeout_s:
          type: integer
          minimum: 1
          maximum: 600
          default: 60
          description: >
            How long one target may take to start its response before the
            next one is tried. A hosted provider (kind direct) gives up
            waiting for the response after 120 s whatever this value is; the
            attempt is then recorded as a timeout.
        total_timeout_s:
          type: integer
          minimum: 1
          maximum: 600
          default: 120
          description: Not shorter than attempt_timeout_s.
        targets:
          type: array
          minItems: 1
          maxItems: 16
          description: >
            At most 8 per dialect, and no target (dialect, provider and
            model) twice. Within one dialect the order is the order the
            targets are tried in.
          items: { $ref: '#/components/schemas/AIModelTarget' }
        dialects:
          type: array
          readOnly: true
          description: >
            The formats the model has targets in, sorted; derived from the
            targets. With translate on, the model can be served in a format
            that is not listed here: dialect_modes says how each format is
            served.
          items: { type: string, enum: [anthropic, openai] }
        serving:
          type: object
          readOnly: true
          description: >
            Per dialect the model has a target in: the first target that is
            available, in the order they are tried, or null when none is or
            the model is disabled (requests for it are refused).
            A dialect without targets has no key, also when the model is
            served there through translation (see dialect_modes). A request
            that carries this field is refused with 400.
          properties:
            openai: { $ref: '#/components/schemas/AIServingTarget' }
            anthropic: { $ref: '#/components/schemas/AIServingTarget' }
        dialect_modes:
          type: object
          readOnly: true
          description: >
            How the model is served per format, by the rule a request is
            routed by. native: a target of that format answers. translated:
            the model has no such target, translate is on and a target of
            the other format is reached through a translating pair.
            not_served: a request is refused (also for a disabled model).
            Both keys are always present. openai describes Chat Completions
            on /openai/v1, anthropic the Messages API on /anthropic. The
            mode says nothing about whether a target can be reached right
            now; that is serving and targets[].available. A request that
            carries this field is refused with 400.
          required: [openai, anthropic]
          properties:
            openai: { $ref: '#/components/schemas/AIModelMode' }
            anthropic: { $ref: '#/components/schemas/AIModelMode' }
        responses_mode:
          allOf: [ { $ref: '#/components/schemas/AIModelMode' } ]
          readOnly: true
          description: >
            How the Responses API (POST /openai/v1/responses, what Codex
            uses) is served. native: an OpenAI-format target offers it
            (the provider's supports_responses). translated: none does,
            translate is on and a target is reached through a pair.
            A request that carries this field is refused with 400.
        translation_pairs:
          type: object
          readOnly: true
          description: >
            The pairs a translated request can be sent through, in the
            order its targets are tried, each pair once. A key exists only
            where the mode is translated; the object is empty when nothing
            is. A request that carries this field is refused with 400.
          properties:
            openai:
              type: array
              items: { type: string, enum: [chat-messages] }
            anthropic:
              type: array
              items: { type: string, enum: [messages-chat] }
            responses:
              type: array
              items: { type: string, enum: [responses-chat, responses-messages] }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    AIModelMode:
      type: string
      enum: [native, translated, not_served]
    AIGatewayKey:
      type: object
      description: >
        A gateway key as every response but its creation shows it. The key
        itself is stored as a hash and is never returned again.
      required: [id, name, key_prefix, user_id, allowed_models, last_used, created_at, revoked_at]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        key_prefix:
          type: string
          description: The first 8 characters of the key, for display.
          example: bgw_Ab3x
        user_id: { type: string, description: The owner. }
        allowed_models:
          type: array
          maxItems: 64
          description: >
            The models the key may use; empty means every model. An entry is
            a synthetic model name, "<provider>/<model>" or "<provider>/*".
          items: { type: string, maxLength: 264 }
        last_used: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    AIProviderModel:
      type: object
      description: One entry of a provider's stored model list.
      required: [id, display_name, context_length, synced_at]
      properties:
        id: { type: string, maxLength: 200, example: google/gemini-x }
        display_name: { type: string, maxLength: 200 }
        context_length: { type: integer, format: int64, minimum: 0 }
        synced_at: { type: string, format: date-time }
    EndpointMetrics:
      type: object
      description: >
        Metering aggregates for one AI provider over the trailing 24 h.  All
        numeric fields are zeroed pending usage_events aggregation.
      required: [requests_24h, tokens_in_24h, tokens_out_24h, cost_usd_24h, cache_hit_ratio_24h, requests_per_minute]
      properties:
        requests_24h: { type: integer }
        tokens_in_24h: { type: integer }
        tokens_out_24h: { type: integer }
        cost_usd_24h: { type: number, format: double }
        cache_hit_ratio_24h: { type: number, format: double }
        requests_per_minute:
          type: array
          items: { type: integer }
          description: 60-element array — one bucket per minute over the trailing hour.
    KnownClient:
      type: object
      description: >
        A client token with what the relay knows of the machine that uses it.
        The platform fields and `served` come from the client and are display
        text only.
      required: [token_id, token_name, user_id, status, last_seen, os, arch, client_version, remote_addr, served, sessions]
      properties:
        token_id:
          type: string
          description: >
            The id of the client token. Empty for a live session whose token
            was revoked meanwhile; such a row is always `online`.
        token_name: { type: string }
        user_id: { type: string, description: The owner of the token. }
        status:
          type: string
          enum: [online, offline, never_connected]
          description: >
            `online` while at least one session of the token is live,
            `offline` when it connected before and no session is live,
            `never_connected` otherwise.
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: >
            When the relay last wrote the session down: when it connected,
            when what it serves changed and when it ended. Null while the
            token never connected.
        os:
          type: string
          description: >
            Operating system of the newest live session, or of the last
            session; empty while the token never connected. The same holds
            for `arch`, `client_version` and `remote_addr`.
        arch: { type: string }
        client_version: { type: string }
        remote_addr: { type: string }
        served:
          type: array
          description: >
            The names of the services the live sessions serve, or the last
            session served. Sorted; empty while the token never connected.
          items: { type: string }
        sessions:
          type: array
          description: >
            The live sessions of the token, newest first, each as
            `GET /api/v1/clients` lists it. Empty unless `status` is `online`.
          items: { $ref: '#/components/schemas/Client' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
    Empty:
      type: object
      description: Empty JSON object response.
    OK:
      type: object
      properties:
        ok:
          type: boolean
    User:
      type: object
      description: A user account as the admin endpoints return it.
      required: [id, email, role, status, last_login, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        status: { type: string, enum: [active, suspended] }
        last_login: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Service:
      type: object
      required: [id, name, type, slug, url, access_mode, api_key_header, gateway_only, connected, remote_port, local_addr]
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [http, tcp, direct]
          description: >
            direct is the backing row of a direct AI provider. It is never
            listed; GET /api/v1/services/{serviceID} returns it by id.
        slug:
          type: string
          description: URL segment of an http service; empty for tcp or until one is assigned.
        url:
          type: string
          description: Public address, `https://<auth_domain>/svc/<slug>/`; empty without a slug or auth domain, and empty while `gateway_only` is true.
        access_mode: { type: string, enum: [open, api_key, burrow_login, mtls] }
        api_key_header:
          type: string
          description: The request header that carries the key in api_key mode.
          example: Authorization
        gateway_only:
          type: boolean
          description: When true the service is reachable through the AI gateway only; its `/svc/<slug>/` address and custom domains answer 404.
        connected: { type: boolean }
        remote_port:
          type: integer
          description: Public port of a connected tcp service; 0 for http and while not connected.
        local_addr:
          type: string
          description: Address the client forwards to; empty while not connected.
    Tunnel:
      type: object
      description: One live tunnel of the caller.
      required: [id, name, type, remote_port, local_addr, bytes_in, bytes_out, connected]
      properties:
        id:
          type: string
          description: Id of the live tunnel; a new one with every connect.
        name: { type: string }
        type: { type: string, enum: [http, tcp] }
        remote_port: { type: integer }
        local_addr: { type: string }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        connected: { type: boolean }
        service_id:
          type: string
          description: Id of the durable service of an http tunnel, for the /api/v1/services/{serviceID} routes; omitted for tcp.
        url:
          type: string
          description: Public address of an http tunnel, `https://<auth_domain>/svc/<slug>/`; omitted for tcp and for a gateway-only service.
        access_mode:
          type: string
          enum: [open, api_key, burrow_login, mtls]
          description: The access mode in effect; omitted for tcp.
    Session:
      type: object
      required: [id, ip, user_agent, created_at, expires_at, current]
      properties:
        id: { type: string }
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current:
          type: boolean
          description: Whether the request was made with this session.
    Token:
      type: object
      description: A client token as it is listed. The token itself is returned once, when it is created.
      required: [id, name, last_used, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        last_used: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ClientLoginRequest:
      type: object
      description: >
        A client sign-in request as the dashboard shows it. hostname, os, arch,
        client_version and suggested_token_name were sent by the client: treat
        them as untrusted text. Holds neither the device code nor a token.
      required: [user_code, hostname, os, arch, client_version, source_ip, status, suggested_token_name, age_seconds, created_at, expires_at]
      properties:
        user_code: { type: string, example: "ABCD-EFGH" }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        client_version: { type: string }
        source_ip:
          type: string
          description: Address the client started the request from, as the relay saw it.
        status: { type: string, enum: [pending, approved, denied] }
        suggested_token_name:
          type: string
          description: The client's suggestion, else its hostname.
        age_seconds:
          type: integer
          description: Seconds since the request was started, by the relay's clock.
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    AccessModeReq:
      type: object
      required: [access_mode]
      properties:
        access_mode: { type: string, enum: [open, api_key, burrow_login, mtls] }
        api_key_header:
          type: string
          description: >
            api_key mode only, ignored for the other modes. The request
            header that carries the key; an RFC 7230 token.
          example: X-Api-Key
        mtls_ca_pem:
          type: string
          description: >
            mtls mode only, where it is required; ignored for the other
            modes. A PEM bundle with at least one CERTIFICATE block: the
            trust anchor client certificates are verified against.
    ConnectionLog:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [control, http_proxy, tcp_proxy] }
        service_id: { type: string }
        tunnel_id: { type: string }
        user_id: { type: string }
        client_session_id: { type: string }
        source_ip: { type: string }
        user_agent: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        status: { type: string, enum: [closed_clean, closed_error, closed_idle, rejected] }
        reason: { type: string }
    ConnectionLogRollup:
      type: object
      properties:
        day: { type: string, format: date }
        service_id: { type: string }
        kind: { type: string }
        sessions: { type: integer, format: int64 }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        avg_duration_ms: { type: integer, format: int64 }
        p95_duration_ms: { type: integer, format: int64 }
    ServiceDetail:
      description: One service with what only the detail view has.
      allOf:
        - $ref: '#/components/schemas/Service'
        - type: object
          required: [api_key_count, access_policy]
          properties:
            api_key_count: { type: integer }
            access_policy:
              type: array
              description: The role allowlist of burrow_login mode, as GET .../access-policy returns it.
              items: { type: string }
    ServiceApiKey:
      type: object
      description: >
        A per-service API key as it is listed. The key itself is stored as a
        hash and is never returned again.
      required: [id, name, last_used, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        last_used: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    ServiceIpGeoInput:
      type: object
      description: >
        IP and country rules of one service. A list that is left out is
        stored as empty; enabled left out is false.
      properties:
        enabled: { type: boolean }
        allow_cidrs:
          type: array
          description: Checked when stored; a malformed entry is refused with 400.
          items: { type: string, example: 203.0.113.0/24 }
        block_cidrs:
          type: array
          items: { type: string, example: 198.51.100.7/32 }
        allow_countries:
          type: array
          description: ISO 3166-1 alpha-2 codes.
          items: { type: string, example: DE }
        block_countries:
          type: array
          description: ISO 3166-1 alpha-2 codes.
          items: { type: string, example: US }
    ServiceIpGeo:
      description: The stored rules; every list is present, empty when unset.
      allOf:
        - $ref: '#/components/schemas/ServiceIpGeoInput'
        - type: object
          required: [enabled, allow_cidrs, block_cidrs, allow_countries, block_countries]
    UpstreamCredentialBinding:
      type: object
      description: >
        The upstream credential bound to a service. While none is bound the
        object holds slot_present false and nothing else. The credential
        itself is configured on the relay and is never returned.
      required: [slot_present]
      properties:
        slot: { type: string, description: Name of the vault slot., example: OPENAI }
        header_name: { type: string, example: Authorization }
        header_format: { type: string, example: 'Bearer {key}' }
        slot_present:
          type: boolean
          description: Whether the vault holds a value for the slot.
    CustomDomain:
      type: object
      description: >
        A custom domain of a service with the data of its certificate. The
        private key is never returned.
      required: [id, service_id, hostname, cert_sha256, not_before, not_after, created_at, updated_at, status, status_updated_at]
      properties:
        id: { type: string }
        service_id: { type: string }
        hostname: { type: string, description: Lower case. }
        cert_sha256: { type: string, description: Fingerprint of the stored certificate. }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, active, cert_expiring, cert_expired] }
        status_updated_at: { type: string, format: date-time }
    SessionUser:
      type: object
      description: The signed-in user as login and /me return it.
      required: [id, email, role]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string }
    Client:
      type: object
      description: One live client, that is one control session of a connected burrow client.
      required: [session_id, user_id, token_name, remote_addr, os, arch, client_version, service_count, total_bytes_in, total_bytes_out]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        token_name: { type: string }
        remote_addr: { type: string }
        os: { type: string }
        arch: { type: string }
        client_version: { type: string }
        service_count: { type: integer }
        total_bytes_in: { type: integer, format: int64 }
        total_bytes_out: { type: integer, format: int64 }
    ClientService:
      type: object
      description: One service (tunnel) of a live client.
      required: [id, name, type, remote_port, local_addr, access_mode, bytes_in, bytes_out, total_bytes_in, total_bytes_out]
      properties:
        id: { type: string, description: Id of the live tunnel. }
        name: { type: string }
        type: { type: string, enum: [http, tcp] }
        service_id:
          type: string
          description: Id of the durable service of an http tunnel; omitted for tcp.
        remote_port: { type: integer }
        local_addr: { type: string }
        access_mode: { type: string }
        bytes_in: { type: integer, format: int64, description: Since this connect. }
        bytes_out: { type: integer, format: int64, description: Since this connect. }
        total_bytes_in: { type: integer, format: int64, description: Stored total; survives a reconnect. }
        total_bytes_out: { type: integer, format: int64, description: Stored total; survives a reconnect. }
    ClientDetail:
      description: A live client with its services.
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          required: [services]
          properties:
            services:
              type: array
              items: { $ref: '#/components/schemas/ClientService' }
    Role:
      type: object
      description: A role as the list returns it.
      required: [name, description, created_at, builtin, default_for_new_users]
      properties:
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        builtin:
          type: boolean
          description: A built-in role cannot be changed or deleted.
        default_for_new_users: { type: boolean }
    RoleDetail:
      description: A role with its permissions.
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              description: Permission keys, see GET /api/v1/roles/permissions. Those of a built-in role are fixed in code.
              items: { type: string }
    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$'
          description: Lower-case letters, digits and dashes, 1 to 64 characters, no dash at either end.
        description: { type: string }
        permissions:
          type: array
          description: Permission keys; an unknown key is refused with 400.
          items: { type: string }
        default_for_new_users: { type: boolean }
    Permission:
      type: object
      description: One entry of the permission catalog.
      required: [key, group, description]
      properties:
        key: { type: string, example: 'tokens:manage:own' }
        group: { type: string, description: Section label for display., example: Client tokens }
        description: { type: string }
    AutomationToken:
      type: object
      description: An automation token as it is listed. The token itself is returned once, when it is created.
      required: [id, name, prefix, user_id, role_at_mint, permissions, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix:
          type: string
          description: The first 10 characters of the token, for display.
          example: bua_Ab3xYz
        user_id: { type: string }
        role_at_mint: { type: string, description: The role of the user when the token was created. }
        permissions:
          type: array
          description: The permission keys the token declares.
          items: { type: string }
        expires_at:
          type: string
          format: date-time
          description: Left out for a token that does not expire.
        last_used:
          type: string
          format: date-time
          description: Left out until the token is used.
        created_at: { type: string, format: date-time }
    CacheSettingsInput:
      type: object
      description: >
        Settings of the exact-match prompt cache. A field that is left out
        is false or 0; applies_per left out is global.
      properties:
        enabled: { type: boolean }
        applies_per: { type: string, enum: [global, per_endpoint, per_api_key], default: global }
        ttl_seconds: { type: integer }
        max_entries: { type: integer }
        max_per_entry_kb: { type: integer }
    CacheSettings:
      description: Stored cache settings; every field is present.
      allOf:
        - $ref: '#/components/schemas/CacheSettingsInput'
        - type: object
          required: [enabled, applies_per, ttl_seconds, max_entries, max_per_entry_kb]
    CacheSemanticSettingsInput:
      type: object
      description: Settings of the semantic (similarity) tier of the cache.
      properties:
        enabled: { type: boolean }
        min_similarity: { type: number, format: double, minimum: 0, maximum: 1 }
        embedding_mode: { type: string, enum: [local, none] }
        embedding_url: { type: string }
        embedding_model: { type: string }
        fallback_policy: { type: string, enum: [treat_as_miss, return_cached_marked] }
        promote_on_miss: { type: boolean }
        max_index_entries: { type: integer }
    CacheSemanticSettings:
      description: Semantic-tier settings; every field is present.
      allOf:
        - $ref: '#/components/schemas/CacheSemanticSettingsInput'
        - type: object
          required: [enabled, min_similarity, embedding_mode, embedding_url, embedding_model, fallback_policy, promote_on_miss, max_index_entries]
    CacheSettingsView:
      type: object
      description: What GET /api/v1/cache/settings returns.
      required: [global, semantic, per_service]
      properties:
        global: { $ref: '#/components/schemas/CacheSettings' }
        semantic:
          description: >
            The built-in defaults of the semantic tier. A service sets its
            own values in the cache.semantic section of its AI configuration.
          allOf: [ { $ref: '#/components/schemas/CacheSemanticSettings' } ]
        per_service:
          type: array
          description: One entry per service that has an AI configuration.
          items:
            allOf:
              - $ref: '#/components/schemas/CacheSettings'
              - type: object
                required: [service_id, override]
                properties:
                  service_id: { type: string }
                  override:
                    type: boolean
                    description: >
                      Whether the service's AI configuration has a cache
                      section. Without one the entry shows the built-in
                      defaults.
    CacheStats:
      type: object
      description: >
        Counters of both cache tiers. The hit rates are kept in memory and
        start at 0 after a restart.
      required: [entries, on_disk_bytes, hit_rate_24h, semantic_entries, semantic_disk_bytes, semantic_hit_rate_24h, semantic_similar_returned_24h, semantic_promotions_24h]
      properties:
        entries: { type: integer }
        on_disk_bytes: { type: integer, format: int64 }
        hit_rate_24h: { type: number, format: double }
        semantic_entries: { type: integer }
        semantic_disk_bytes: { type: integer, format: int64 }
        semantic_hit_rate_24h: { type: number, format: double }
        semantic_similar_returned_24h: { type: integer }
        semantic_promotions_24h: { type: integer }
    ServiceAiConfig:
      type: object
      description: >
        The AI configuration of one service: one JSON object, stored and
        returned as it was written ({} while none was written). The sections
        below are the ones the relay reads; a section that is left out or
        null is off. Any other key is stored and ignored. On write only
        cache.semantic.min_similarity (0 to 1) and
        cache.semantic.embedding_mode (local or none) are checked.
      additionalProperties: true
      properties:
        cache:
          description: Exact-match cache of this service, with its semantic tier.
          allOf:
            - $ref: '#/components/schemas/CacheSettingsInput'
            - type: object
              properties:
                semantic: { $ref: '#/components/schemas/CacheSemanticSettingsInput' }
        redaction:
          type: object
          properties:
            enabled: { type: boolean }
            for_logs_only: { type: boolean }
        guardrails:
          type: object
          properties:
            enabled: { type: boolean }
            action: { type: string, enum: [log_only, refuse_403, refuse_safe] }
        inspector:
          type: object
          properties:
            enabled: { type: boolean }
            max_requests: { type: integer }
        anthropic:
          type: object
          description: Keeps the service's traffic on the metering chain; requests are not rewritten.
          properties:
            enabled: { type: boolean }
    RateLimitInput:
      type: object
      required: [scope, dimension, limit, burst]
      properties:
        scope: { type: string, enum: [api_key, gateway_key, model, role, service, global] }
        subject:
          type: string
          maxLength: 256
          description: >
            Whom the rule applies to. Required for every scope but global,
            which must not have one. For gateway_key the key's id, for model
            the model's name on the gateway endpoints.
        dimension:
          type: string
          enum: [rpm, bpm]
          description: rpm counts requests, bpm estimated bytes / 4.
        limit: { type: integer, minimum: 1 }
        burst: { type: integer, minimum: 1 }
        window:
          type: string
          enum: [minute, day]
          default: minute
          description: A day runs from UTC midnight.
    RateLimit:
      description: A stored rate-limit rule.
      allOf:
        - $ref: '#/components/schemas/RateLimitInput'
        - type: object
          required: [id, subject, window]
          properties:
            id: { type: string }
    RateLimitUsage:
      type: object
      required: [limits]
      properties:
        limits:
          type: array
          description: The rules that apply to the subject, each with its live counters.
          items:
            allOf:
              - $ref: '#/components/schemas/RateLimit'
              - type: object
                required: [used, reset_seconds]
                properties:
                  used: { type: integer, format: int64 }
                  reset_seconds: { type: integer }
    CostPricingEntryInput:
      type: object
      required: [model]
      properties:
        provider:
          type: string
          description: Provider slug. Left out, the price applies to the model under any provider.
        model: { type: string }
        input_per_million: { type: number, format: double, minimum: 0 }
        output_per_million: { type: number, format: double, minimum: 0 }
    CostPricingInput:
      type: object
      description: A whole price table; it replaces the one in use.
      required: [version, entries]
      properties:
        version: { type: string, minLength: 1 }
        entries:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CostPricingEntryInput' }
    CostPricing:
      type: object
      description: The price table in use. Only entries that name a provider are listed.
      required: [version, entries]
      properties:
        version: { type: string }
        entries:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CostPricingEntryInput'
              - type: object
                required: [provider, model, input_per_million, output_per_million]
    CostSummary:
      type: object
      required: [window, total_usd, tokens_in, tokens_out, top_consumers, pct_of_budget]
      properties:
        window: { type: string, enum: [today, week, month, year] }
        total_usd: { type: number, format: double }
        tokens_in: { type: integer, format: int64 }
        tokens_out: { type: integer, format: int64 }
        top_consumers:
          type: array
          items:
            type: object
            required: [api_key_id, service_id, tokens_in, tokens_out, usd]
            properties:
              api_key_id: { type: string }
              service_id: { type: string }
              tokens_in: { type: integer, format: int64 }
              tokens_out: { type: integer, format: int64 }
              usd: { type: number, format: double }
        pct_of_budget:
          type: number
          format: double
          nullable: true
          description: >
            For window today, the highest ratio of today's spend to daily_usd
            over the budgets. Null for the other windows and whenever there
            is no such ratio.
        group_by:
          type: string
          enum: [gateway_key, model, provider, target_model, dialect]
          description: Present only when the group_by parameter was sent.
        groups:
          type: array
          description: Present only when the group_by parameter was sent.
          items:
            type: object
            required: [key, requests, tokens_in, tokens_out, usd]
            properties:
              key: { type: string }
              requests: { type: integer, format: int64 }
              tokens_in: { type: integer, format: int64 }
              tokens_out: { type: integer, format: int64 }
              usd: { type: number, format: double }
    BudgetInput:
      type: object
      required: [scope, action_on_exceed]
      properties:
        scope: { type: string, enum: [api_key, service, user, global, gateway_key, model] }
        subject_id:
          type: string
          maxLength: 256
          description: Required for every scope but global, which must not have one. Taken as sent, never trimmed.
        daily_usd:
          type: number
          format: double
          minimum: 0
          description: At least one of daily_usd and daily_tokens must be above 0.
        daily_tokens: { type: integer, format: int64, minimum: 0 }
        action_on_exceed: { type: string, enum: [alert_webhook, throttle_zero, disable_key] }
        alert_webhook_id: { type: string, nullable: true }
    Budget:
      description: A stored budget with today's usage.
      allOf:
        - $ref: '#/components/schemas/BudgetInput'
        - type: object
          required: [id, subject_id, daily_usd, daily_tokens, alert_webhook_id, current_usd, current_tokens, exceeded]
          properties:
            id: { type: string }
            current_usd: { type: number, format: double }
            current_tokens: { type: integer, format: int64 }
            exceeded: { type: boolean }
    RedactionRuleInput:
      type: object
      required: [name, pattern, action, scope]
      properties:
        name: { type: string }
        pattern: { type: string, description: A regular expression in Go (RE2) syntax. }
        action: { type: string, enum: [mask, drop, hash] }
        scope: { type: string, enum: [request_body, response_body, both] }
    RedactionRule:
      description: A redaction rule, built-in or custom.
      allOf:
        - $ref: '#/components/schemas/RedactionRuleInput'
        - type: object
          required: [id]
          properties:
            id: { type: string }
    RedactionRules:
      type: object
      required: [built_in, custom]
      properties:
        built_in:
          type: array
          description: The bundled rules. They cannot be changed or deleted (409).
          items: { $ref: '#/components/schemas/RedactionRule' }
        custom:
          type: array
          items: { $ref: '#/components/schemas/RedactionRule' }
    RedactionSettingsInput:
      type: object
      description: Global redaction settings. A field that is left out is false or empty.
      properties:
        enabled: { type: boolean }
        redact_for_logs_only: { type: boolean }
        rule_ids:
          type: array
          description: Ids of the selected rules.
          items: { type: string }
        presidio_enabled: { type: boolean }
        presidio_url:
          type: string
          description: Left out of an answer while it is empty.
    RedactionSettings:
      description: Stored redaction settings.
      allOf:
        - $ref: '#/components/schemas/RedactionSettingsInput'
        - type: object
          required: [enabled, redact_for_logs_only, rule_ids, presidio_enabled]
    RedactionSettingsView:
      type: object
      description: What GET /api/v1/redaction/settings returns.
      required: [global, per_service]
      properties:
        global: { $ref: '#/components/schemas/RedactionSettings' }
        per_service:
          type: array
          description: One entry per service that has an AI configuration.
          items:
            allOf:
              - $ref: '#/components/schemas/RedactionSettings'
              - type: object
                required: [service_id, override]
                properties:
                  service_id: { type: string }
                  override:
                    type: boolean
                    description: >
                      Whether the service's AI configuration has a redaction
                      section. Without one the entry shows the defaults.
    GuardrailSettingsInput:
      type: object
      required: [action]
      properties:
        enabled: { type: boolean }
        action: { type: string, enum: [log_only, refuse_403, refuse_safe] }
    GuardrailSettings:
      description: Stored guardrail settings.
      allOf:
        - $ref: '#/components/schemas/GuardrailSettingsInput'
        - type: object
          required: [enabled]
    GuardrailSettingsView:
      type: object
      description: What GET /api/v1/guardrails/settings returns.
      required: [global, per_service]
      properties:
        global: { $ref: '#/components/schemas/GuardrailSettings' }
        per_service:
          type: array
          description: One entry per service that has an AI configuration.
          items:
            type: object
            required: [service_id, enabled, action]
            properties:
              service_id: { type: string }
              enabled:
                type: boolean
                nullable: true
                description: Null while the service has no guardrails section of its own.
              action:
                type: string
                nullable: true
                description: log_only, refuse_403 or refuse_safe; null while the service has no guardrails section of its own.
    InspectorEntry:
      type: object
      description: >
        One captured request with its response. A body is a string: the
        text itself when it is valid UTF-8, else base64; the matching
        *_encoding field says which. Fields that are empty are left out,
        except the ones listed as required.
      required: [id, service_id, ts, method, path, status, duration_ms, bytes_in, bytes_out, translated, dropped]
      properties:
        id: { type: string }
        service_id: { type: string }
        api_key_id: { type: string }
        ts: { type: string, format: date-time }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        duration_ms: { type: integer, format: int64 }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        req_headers:
          type: object
          additionalProperties: { type: string }
        req_body: { type: string }
        req_body_encoding: { type: string, enum: [utf8, base64] }
        resp_headers:
          type: object
          additionalProperties: { type: string }
        resp_body: { type: string }
        resp_body_encoding: { type: string, enum: [utf8, base64] }
        truncated: { type: boolean }
        bytes_omitted: { type: integer, format: int64 }
        cache: { type: string, enum: [HIT, MISS, SKIP] }
        redactions:
          type: array
          items:
            type: object
            required: [rule, count]
            properties:
              rule: { type: string }
              count: { type: integer }
        trace_id: { type: string }
        remote_ip: { type: string }
        mcp:
          type: object
          description: Set when the request is a recognised MCP (JSON-RPC) call.
          required: [method]
          properties:
            method: { type: string }
            tool: { type: string }
            params:
              description: The call's params as they were sent; any JSON value.
        adapter_lossy: { type: boolean }
        translated:
          type: string
          enum: ['', messages-chat, responses-chat, chat-messages, responses-messages]
          description: >
            The pair that translated the request, as in the response header
            Burrow-Translated. Empty for a request served in its own format.
        dropped:
          type: array
          items: { type: string }
          description: >
            What the translation left out, as in the response header
            Burrow-Dropped: sorted names, never null, empty when nothing
            was left out. A final "more" says the list was cut; it is not a
            name. A name can end in text the client chose (after a prefix
            such as "unknown:"); treat every name as plain text.
    InspectorReplayRequest:
      type: object
      description: >
        Optional overrides for a replay. Without a body the captured request
        is sent again as it was.
      properties:
        headers:
          type: object
          description: Set on top of the captured request headers.
          additionalProperties: { type: string }
        body:
          type: string
          description: Replaces the captured request body when it is not empty.
        body_encoding: { type: string, enum: [utf8, base64], default: utf8 }
        follow_routing:
          type: boolean
          description: Accepted; the relay does not act on it.

  responses:
    Unauthorized:
      description: Missing / invalid session or bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but the caller lacks permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string }
    PathServiceID:
      name: serviceID
      in: path
      required: true
      schema: { type: string }

# Default security: cookie+CSRF or bearer. Individual public routes override
# with `security: []`.
security:
  - CookieAuth: []
    CSRFToken: []
  - BearerAuth: []

paths:
  # ────────────────────────────────────────────────────────────────────────
  # Prometheus scrape (outside /api/v1 by convention; gated by metrics:read)
  # ────────────────────────────────────────────────────────────────────────
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus 0.0.4 scrape (closed metric set)
      description: |
        Returns the Burrow closed-metric set in Prometheus text exposition
        format. Gated by admin OR the `metrics:read` permission.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Auth (login is public; everything else requires a session)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: authLogin
      x-burrow-mcp: false
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session cookie issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Rate-limited (per-IP or global).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      x-burrow-mcp: false
      summary: Clear the session cookie
      responses:
        '204': { description: Session cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      operationId: authChangePassword
      x-burrow-mcp: false
      summary: Change the caller's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [auth]
      operationId: meGet
      summary: Current authenticated principal
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Sessions
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/sessions:
    get:
      tags: [sessions]
      operationId: sessionsList
      summary: List the caller's active sessions
      responses:
        '200':
          description: List of session records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/{id}:
    delete:
      tags: [sessions]
      operationId: sessionDelete
      summary: Revoke one of the caller's sessions
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/revoke-all:
    post:
      tags: [sessions]
      operationId: sessionsRevokeAll
      summary: Revoke every session except the current one
      responses:
        '200':
          description: Count of sessions revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Tokens (personal client tokens)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: clientTokensList
      summary: List the caller's client tokens
      responses:
        '200':
          description: List of tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tokens]
      operationId: clientTokenCreate
      summary: Issue a new client token (plaintext returned ONCE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                required: [name, token]
                properties:
                  name: { type: string }
                  token: { type: string, description: The client token. Shown this once. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tokens/{id}:
    delete:
      tags: [tokens]
      operationId: clientTokenDelete
      summary: Revoke a client token
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Token revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Tunnels (live runtime view) + v0.2 back-compat access-mode setter
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/tunnels:
    get:
      tags: [tunnels]
      operationId: tunnelsList
      summary: List the caller's live tunnels
      responses:
        '200':
          description: List of tunnels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tunnel' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tunnels/{id}/access-mode:
    put:
      tags: [tunnels]
      operationId: tunnelAccessModeUpdate
      summary: Set tunnel access mode (v0.2 back-compat — delegates to services)
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_mode]
              properties:
                access_mode:
                  type: string
                  enum: [open, api_key, burrow_login]
                  description: mtls needs a CA bundle and is set with PUT /api/v1/services/{serviceID}/access-mode.
      responses:
        '204': { description: Access mode set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The mode is not available on this relay or for this service (mTLS needs host routing). }

  # ────────────────────────────────────────────────────────────────────────
  # Services
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/services:
    get:
      tags: [services]
      operationId: servicesList
      summary: List services visible to the caller
      description: |
        The backing rows of direct AI providers (type "direct") are not
        listed; they are managed under /api/v1/ai/providers. Their API keys
        and AI configuration are reachable through the service endpoints by
        id, while a change of slug or access mode answers 409.
      responses:
        '200':
          description: List of services.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [services]
      operationId: serviceCreate
      summary: Admin pre-provisions a service row (v0.5.2)
      description: |
        Inserts a services row exactly as supplied so dashboard / e2e flows
        can target a known service_id before any client connects. Permission:
        admin. Audit: `service.create` with payload `{by_admin: true}`.
        Client-side `RegisterService` continues to upsert against the same
        row when the client subsequently connects with the same `service_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id]
              properties:
                service_id:  { type: string, pattern: '^[a-z0-9_-]{3,64}$' }
                title:       { type: string, maxLength: 120 }
                access_mode: { type: string, enum: [public, open, api_key, burrow_login] }
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
                  description: Optional. Generated when the client first connects if omitted.
      responses:
        '201':
          description: Service row created.
          content:
            application/json:
              schema:
                type: object
                required: [id, slug, created_at]
                properties:
                  id:         { type: string }
                  slug:       { type: string }
                  created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: service_id or slug already in use. }

  /api/v1/services/slug-suggestion:
    get:
      tags: [services]
      operationId: serviceSlugSuggestionGet
      summary: Suggest a slug no service uses
      description: A suggestion only; uniqueness is enforced when the slug is saved.
      responses:
        '200':
          description: A free slug.
          content:
            application/json:
              schema:
                type: object
                required: [slug]
                properties:
                  slug: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}:
    get:
      tags: [services]
      operationId: serviceGet
      summary: Service detail (config + live state)
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: Service detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{serviceID}/access-mode:
    put:
      tags: [services]
      operationId: serviceAccessModeUpdate
      summary: Set the service's access mode
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessModeReq' }
      responses:
        '204': { description: Access mode set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The mode is not available on this relay or for this service (mTLS needs host routing). }

  /api/v1/services/{serviceID}/slug:
    put:
      tags: [services]
      operationId: serviceSlugUpdate
      summary: Change the service's slug
      description: The old URL stops working immediately; there is no redirect.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
      responses:
        '200':
          description: Slug changed.
          content:
            application/json:
              schema:
                type: object
                required: [slug, url]
                properties:
                  slug: { type: string }
                  url:  { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Slug already in use. }

  /api/v1/services/{serviceID}/gateway-only:
    put:
      tags: [services]
      operationId: serviceGatewayOnlyUpdate
      summary: Reach the service through the AI gateway only
      description: |
        With `gateway_only` true the service answers 404 at `/svc/<slug>/`, on
        its custom domains and on every other direct address, exactly like a
        service that does not exist. It stays reachable through the AI gateway
        (`/ai/<provider>/`, `/openai/v1`, `/anthropic`), where the provider's
        policy and key checks apply as before. Same permission as the other
        service settings. Audited as `service.gateway_only.update`.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_only]
              properties:
                gateway_only: { type: boolean }
      responses:
        '200':
          description: Setting stored.
          content:
            application/json:
              schema:
                type: object
                required: [gateway_only]
                properties:
                  gateway_only: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The service is not an http service, or backs a direct AI provider. }

  /api/v1/services/{serviceID}/api-keys:
    get:
      tags: [services]
      operationId: serviceApiKeysList
      summary: List per-service API keys
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: List of api-key summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [services]
      operationId: serviceApiKeyCreate
      summary: Mint a new per-service API key (plaintext returned ONCE)
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Key created.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, key]
                properties:
                  id: { type: string }
                  name: { type: string }
                  key: { type: string, description: The key. Shown this once. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/api-keys/{id}:
    delete:
      tags: [services]
      operationId: serviceApiKeyDelete
      summary: Revoke a per-service API key
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - { $ref: '#/components/parameters/PathID' }
      responses:
        '204': { description: Key revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{serviceID}/access-policy:
    get:
      tags: [services]
      operationId: serviceAccessPolicyGet
      summary: Get the role allowlist for burrow_login access
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: List of role names.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [services]
      operationId: serviceAccessPolicyUpdate
      summary: Replace the role allowlist
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items: { type: string }
      responses:
        '204': { description: Policy updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/ip-geo:
    get:
      tags: [services]
      operationId: serviceIpGeoGet
      summary: Get per-service IP / Geo allow / deny rules
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: IP/Geo configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIpGeo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [services]
      operationId: serviceIpGeoUpdate
      summary: Replace per-service IP / Geo rules
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceIpGeoInput' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/cache/entries:
    delete:
      tags: [services, cache]
      operationId: serviceCacheEntriesDelete
      summary: Purge per-service exact-cache entries
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '204': { description: Purged. Nothing is returned. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/ai-config:
    get:
      tags: [services, cache]
      operationId: serviceAiConfigGet
      summary: Read per-service AI gateway configuration
      description: >
        Returns the stored service-level AI config blob, or an empty object
        ({}) when none has been written yet. Permission: service owner OR
        ai:configure:any (admin).
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: The stored AI config blob (or {} if unset).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAiConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [services, cache]
      operationId: serviceAiConfigUpdate
      summary: Store per-service AI gateway configuration
      description: >
        Persists the service-level AI config blob. Validates
        cache.semantic.min_similarity (must be in [0.0, 1.0]) and
        cache.semantic.embedding_mode (must be "local" or "none"). All
        other fields are stored as-is. Permission: service owner OR
        ai:configure:any (admin).
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAiConfig' }
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Inspector (per-service ring buffer + replay + SSE)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/services/{serviceID}/inspector/requests:
    get:
      tags: [inspector]
      operationId: inspectorRequestsList
      summary: List captured requests
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: status
          in: query
          description: Only requests answered with this status.
          schema: { type: integer, minimum: 100, maximum: 599 }
        - name: q
          in: query
          description: Only requests whose method and path contain this text.
          schema: { type: string }
        - name: since
          in: query
          description: Only requests captured at or after this time.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: The captured requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InspectorEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/inspector/requests/{rid}:
    get:
      tags: [inspector]
      operationId: inspectorRequestGet
      summary: Get a captured request envelope
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The captured request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InspectorEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{serviceID}/inspector/requests/{rid}/replay:
    post:
      tags: [inspector]
      operationId: inspectorRequestReplay
      summary: Re-fire the captured request through the proxy chain
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectorReplayRequest' }
      responses:
        '200':
          description: The request was sent again; new_entry is what the inspector captured of it.
          content:
            application/json:
              schema:
                type: object
                required: [new_entry]
                properties:
                  new_entry: { $ref: '#/components/schemas/InspectorEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: The replay failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Replay engine unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/services/{serviceID}/inspector/requests/{rid}/replay-compare:
    post:
      tags: [inspector]
      operationId: inspectorRequestReplayCompare
      summary: Replay and diff against the original response
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectorReplayRequest' }
      responses:
        '200':
          description: The captured request, its replay (sent past the cache) and what differs between the two responses.
          content:
            application/json:
              schema:
                type: object
                required: [original, replayed, diff]
                properties:
                  original: { $ref: '#/components/schemas/InspectorEntry' }
                  replayed: { $ref: '#/components/schemas/InspectorEntry' }
                  diff:
                    type: object
                    required: [headers, body]
                    properties:
                      headers:
                        type: array
                        description: One line per response header that differs.
                        items: { type: string }
                      body:
                        type: string
                        description: A unified diff of the response bodies; for a binary response a summary of the sizes.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: The replay failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Replay engine unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/services/{serviceID}/inspector/stream:
    get:
      tags: [inspector]
      operationId: inspectorStream
      x-burrow-mcp: false
      summary: SSE stream of newly-captured requests (no timeout, no CSRF)
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: text/event-stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

