    get:
      tags: [webhooks]
      summary: List delivery attempts (recent)
      responses:
        '200':
          description: Delivery rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/webhooks/{id}:
    put:
      tags: [webhooks]
      summary: Update a webhook
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [webhooks]
      summary: Delete a webhook
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/webhooks/{id}/test:
    post:
      tags: [webhooks]
      summary: Trigger a synchronous test delivery
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '200':
          description: Delivery result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/webhooks/{id}/pause:
    post:
      tags: [webhooks]
      summary: Pause webhook deliveries
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Paused. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/webhooks/{id}/resume:
    post:
      tags: [webhooks]
      summary: Resume webhook deliveries
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Resumed. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/webhooks/{id}/preview:
    post:
      tags: [webhooks]
      summary: Preview a payload template with caller-supplied fields
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '200':
          description: Rendered template body and byte count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Automation (bearer-token API)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/automation/tokens:
    get:
      tags: [automation]
      summary: List automation bearer tokens
      responses:
        '200':
          description: List of token summaries (no plaintext).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [automation]
      summary: Mint an automation bearer token (plaintext returned ONCE)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '201':
          description: Token minted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/automation/tokens/{id}:
    delete:
      tags: [automation]
      summary: Revoke an automation bearer token
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Backups
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/backups:
    get:
      tags: [backups]
      summary: List backup archives on disk
      responses:
        '200':
          description: List of backups.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [backups]
      summary: Trigger a new backup
      responses:
        '200':
          description: New backup metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/backups/{id}:
    delete:
      tags: [backups]
      summary: Delete a backup archive
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/backups/{id}/download:
    get:
      tags: [backups]
      summary: Stream a backup archive
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '200':
          description: gzipped tarball.
          content:
            application/x-gzip:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backups/{id}/verify:
    post:
      tags: [backups]
      summary: Verify a backup archive
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backups/restore:
    post:
      tags: [backups]
      summary: Upload + restore an archive
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Restore accepted (poll status endpoint).
          content:
            application/json:
              schema:
                type: object
                properties:
                  restore_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/backups/restores/{id}:
    get:
      tags: [backups]
      summary: Poll restore status
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '200':
          description: Status envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Roles (catalog + custom-role CRUD)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/roles:
    get:
      tags: [roles]
      summary: List roles (admin)
      responses:
        '200':
          description: List of roles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [roles]
      summary: Create a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/roles/permissions:
    get:
      tags: [roles]
      summary: List the permission catalog (every signed-in user)
      responses:
        '200':
          description: List of permissions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/roles/{name}:
    get:
      tags: [roles]
      summary: Get a role (admin)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Role detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [roles]
      summary: Update a custom role
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [roles]
      summary: Delete a custom role
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Users (admin)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/users:
    get:
      tags: [users]
      summary: List users (admin)
      responses:
        '200':
          description: Paginated list of users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                role: { type: string }
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/{id}:
    patch:
      tags: [users]
      summary: Update a user (role / status) — admin
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string }
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [users]
      summary: Delete a user (admin)
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Settings (admin)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/settings:
    get:
      tags: [settings]
      summary: Get admin settings (admin)
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [settings]
      summary: Replace admin settings (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/settings/test-email:
    post:
      tags: [settings]
      summary: Send a test SMTP email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, format: email }
      responses:
        '200':
          description: Sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OK' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/settings/retention:
    get:
      tags: [settings]
      summary: Get retention settings (admin)
      description: >
        Returns the seven retention configuration knobs plus an advisory note
        explaining the audit-chain-safe deletion behavior.
      responses:
        '200':
          description: Retention settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [settings]
      summary: Replace retention settings (admin)
      description: >
        Validates and persists one or more retention settings. Omitted fields
        are left unchanged. Returns 204 on success, 400 on out-of-range values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Clients
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/clients:
    get:
      tags: [clients]
      summary: List live clients (admin)
      responses:
        '200':
          description: List of clients.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/clients/{sessionID}:
    get:
      tags: [clients]
      summary: Get one live client (admin)
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Client detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/clients/connect-info:
    get:
      tags: [clients]
      summary: Get the control-plane endpoint clients should dial
      description: >
        Returns the host:port a `burrow connect` invocation must point at
        with --server. Session-authed; any signed-in user may read it so
        the "Connect a client" wizard can print a working command.
      responses:
        '200':
          description: Connect info envelope.
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties:
                  server: { type: string, example: "relay.example.com:7000" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Geo
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/geo/status:
    get:
      tags: [geo]
      summary: Global geo-lookup status (enabled, db path, age)
      responses:
        '200':
          description: Status envelope.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  db_path: { type: string }
                  db_age_seconds: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # MCP (burrowd mcp — JSON-RPC 2.0 tool server, spec Part P)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/mcp/status:
    get:
      tags: [mcp]
      summary: burrowd mcp listener status (enabled, listen, token_id)
      responses:
        '200':
          description: Status envelope (plaintext bearer is never returned).
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  listen: { type: string }
                  token_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/mcp/tools:
    get:
      tags: [mcp]
      summary: Closed inventory of MCP tools (name, description, parameters_schema, permission)
      responses:
        '200':
          description: Tool inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    description: { type: string }
                    parameters_schema: { type: object }
                    permission: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Upstream credentials (spec Part B.2, v0.5.0 Task 5)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/upstream-credentials/slots:
    get:
      tags: [services]
      summary: List available vault slot handles (admin or ai:configure:any)
      responses:
        '200':
          description: Sorted list of slot handles registered in the env vault.
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/{serviceID}/upstream-credential:
    get:
      tags: [services]
      summary: Read the upstream-credential binding for a service
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Binding (when bound) or {slot_present:false} (when unbound).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [services]
      summary: Bind an upstream credential slot to a service
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot]
              properties:
                slot: { type: string }
                header_name: { type: string }
                header_format: { type: string }
      responses:
        '204': { description: Bound. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [services]
      summary: Unbind the upstream credential from a service
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Unbound (also returned when no binding existed). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Custom domains (v0.5.0 Task 7, spec D.2)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/services/{serviceID}/domains:
    get:
      tags: [services]
      summary: List custom domains bound to a service
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Array of custom domain objects (no key_pem).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [services]
      summary: Add a custom domain to a service
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, cert_pem, key_pem]
              properties:
                hostname: { type: string }
                cert_pem: { type: string }
                key_pem: { type: string }
      responses:
        '201':
          description: Domain created.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Hostname already bound. }
  /api/v1/services/{serviceID}/domains/{did}:
    get:
      tags: [services]
      summary: Get a single custom domain by ID
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Domain object (no key_pem).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [services]
      summary: Replace the cert/key for a custom domain
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
        - name: did
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, cert_pem, key_pem]
              properties:
                hostname: { type: string }
                cert_pem: { type: string }
                key_pem: { type: string }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Hostname already bound. }
    delete:
      tags: [services]
      summary: Remove a custom domain
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Connection Logs (spec E.2)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/connection-logs:
    get:
      tags: [audit]
      summary: List per-tunnel connection log entries (newest first)
      description: |
        Returns connection_logs rows with cursor pagination. Permission:
        admin OR audit:read. Filterable by kind, service_id, since, until,
        and free-text q. Cursor: ?before_id=<last_id> for the next older page.
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [control, http_proxy, tcp_proxy] }
        - name: service_id
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
        - name: before_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Array of connection log entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectionLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/connection-logs/rollups:
    get:
      tags: [audit]
      summary: List daily connection log rollup rows
      description: |
        Returns connection_log_rollups rows (daily aggregates). Permission:
        admin OR audit:read.
      parameters:
        - name: service_id
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [control, http_proxy, tcp_proxy] }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Array of rollup rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectionLogRollup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/connection-logs/export:
    get:
      tags: [audit]
      summary: Export connection logs as NDJSON or CSV
      description: |
        Streams all matching connection log rows as NDJSON (default) or
        CSV (?format=csv). Permission: admin OR audit:read.
        Up to 1000 rows in v0.5.0; full streaming deferred to Task 17.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [ndjson, csv], default: ndjson }
        - name: kind
          in: query
          schema: { type: string }
        - name: service_id
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Streamed NDJSON or CSV file.
          content:
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Events (SSE)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/events:
    get:
      tags: [events]
      summary: Server-sent events stream (dashboard refresh)
      responses:
        '200':
          description: text/event-stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # OpenAPI viewer (v0.5.0 Task 11, spec J.2)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/openapi/viewer/:
    get:
      tags: [openapi]
      summary: Embedded hand-rolled OpenAPI browser (metrics:read or admin)
      description: >
        Serves the embedded single-page OpenAPI viewer. Fetches
        /api/v1/openapi.yaml client-side (one same-origin GET) and renders
        a sidebar index of all routes with path, parameters, request body,
        and responses. Gated by admin OR metrics:read. No CDN, no phone-home.
      responses:
        '200':
          description: HTML viewer page.
          content:
            text/html:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/openapi/viewer/static/{file}:
    get:
      tags: [openapi]
      summary: Viewer static assets (closed allowlist — viewer.css, viewer.js only)
      description: >
        Serves viewer.css or viewer.js from the embedded FS. Any other path
        returns 404. Gated by admin OR metrics:read (same as the viewer HTML).
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, enum: [viewer.css, viewer.js] }
      responses:
        '200':
          description: CSS or JS asset.
          content:
            text/css:
              schema: { type: string }
            application/javascript:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # AI providers (v0.7.0)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/ai/providers:
    get:
      tags: [models]
      summary: List AI providers
      description: |
        Returns one entry per row of the providers table, ordered by slug.
        A caller who is not an admin sees only the providers whose backing
        service they may see (same visibility as GET /api/v1/services).
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Array of providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIProvider'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [models]
      summary: Create a provider (admin)
      description: |
        Kind "tunnel" registers an existing http service in API-key mode as
        a provider (service_id is required). Kind "direct" adds a provider
        the relay calls itself (base_url and credential_slot are required);
        its backing service is created with it and owned by the caller.
        The provider is then served at
        https://<auth_domain>/ai/<provider>/v1. When slug is empty it is
        derived from name. A field this body does not have (for example
        api_key) is refused with 400 naming the field, for either kind:
        the credential is set on the relay, not through this API. The
        upstream settings (api_format, base_url, credential_slot,
        auth_header, auth_format, extra_headers, billing) are for kind
        "direct"; on a tunnel create, or one without a kind, they are
        refused with 400 instead of being dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [name]
                  properties:
                    slug:
                      type: string
                      pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
                      description: Optional. "v1" is reserved.
                    name: { type: string, minLength: 1, maxLength: 120 }
                    kind: { type: string, enum: [tunnel, direct], default: tunnel }
                    service_id: { type: string, description: Kind "tunnel" only. }
                - $ref: '#/components/schemas/AIProviderUpstream'
            examples:
              tunnel:
                value: { name: Ollama, kind: tunnel, service_id: 0b1f6c0e-4f0a-4a55-9b53-0d0c8f5a2a11 }
              direct:
                value:
                  name: OpenRouter
                  slug: openrouter
                  kind: direct
                  base_url: https://openrouter.ai/api/v1
                  credential_slot: OPENROUTER
                  extra_headers: { X-Title: Burrow }
      responses:
        '201':
          description: Provider created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >
            The slug or the name is taken, the service already backs a
            provider, or the service is not an http service in API-key mode.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ai/providers/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [models]
      summary: Get one provider
      description: |
        Returns 404 when no provider has that slug or its backing service is
        not visible to the caller.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [models]
      summary: Change a provider's slug and name (admin)
      description: |
        After a slug change the old base URL stops working immediately;
        there is no redirect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
                  description: '"v1" is reserved.'
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Slug already in use.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [models]
      summary: Delete a provider (admin)
      description: |
        Removes the provider; its base URL stops working immediately. For a
        tunnel provider the backing service, its API keys and its tunnel are
        kept. For a direct provider the backing service is removed with it,
        and with that its API keys, AI configuration and model list; the
        vault slot is configured on the relay and is not touched.
      responses:
        '204': { description: Provider deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ai/providers/{slug}/upstream:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [models]
      summary: Change a direct provider's upstream settings (admin)
      description: |
        A field that is left out keeps its stored value, so the credential
        slot stays unless the body names another one. extra_headers {}
        removes all extra headers. The change applies to the next request.
        The response shows the stored auth_header and auth_format and the
        names of the extra headers (extra_header_names); header values are
        never returned. Concurrent updates of different fields are both
        kept. A field this body does not have (for example api_key) is
        refused with 400 naming the field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIProviderUpstream'
            example: { base_url: 'https://openrouter.ai/api/v1', billing: flat }
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The provider is a tunnel provider and has no upstream settings,
            or it was changed by someone else at the same time (try again).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ai/providers/{slug}/models:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [models]
      summary: List a provider's stored models
      description: |
        The list GET /ai/<provider>/v1/models answers from. Returns 404 when
        no provider has that slug or its backing service is not visible to
        the caller.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Models ordered by id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIProviderModel'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [models]
      summary: Add one model id by hand (admin)
      description: Works for either kind of provider. Adding an id that is already listed changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: No control characters, no surrounding space.
            example: { id: glm-5.1 }
      responses:
        '204': { description: Model added. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [models]
      summary: Remove one model id (admin)
      parameters:
        - name: id
          in: query
          required: true
          description: The model id. A query parameter because model ids contain "/".
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204': { description: Model removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ai/providers/{slug}/models/sync:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [models]
      summary: Read the model list from a direct provider's upstream (admin)
      description: |
        Calls GET <upstream_base_url>/models with the provider's credential
        and replaces the stored list with the answer. The call is bounded in
        time and size, follows no redirect and is subject to the same
        address guard as every upstream request. Of the upstream's answer
        only ids, names and context lengths are kept (at most 5000 models;
        malformed entries are skipped); nothing else of it is returned. One
        sync per provider runs at a time.
      responses:
        '200':
          description: The stored list was replaced.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The provider is a tunnel provider, its credential slot is not
            set, or a sync is already running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: >
            The upstream did not answer with a model list. The message names
            the cause in general terms (for example the status code), never
            the upstream's own answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Model sync is not available on this relay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ai/providers/{slug}/metrics:
    get:
      tags: [models]
      summary: Per-provider metrics over the trailing 24 h
      description: |
        Returns metering aggregates for one provider, read from usage_events
        of its backing service. Returns 404 when the provider does not exist
        or its backing service is not accessible to the caller.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Metering aggregates for the provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointMetrics'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Database backend status (v0.5.0 Task 15)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/database:
    get:
      tags: [database]
      summary: Database backend status (driver, URL, alpha flag)
      description: |
        Returns the active database driver ("sqlite" or "postgres"), a
        credential-redacted form of the connection string, and whether the
        Postgres alpha flag is in effect. Gated by admin OR metrics:read.
        No I/O — reads the startup-time configuration captured in Deps.
      responses:
        '200':
          description: Database backend status.
          content:
            application/json:
              schema:
                type: object
                required: [driver, postgres_alpha, url_redacted]
                properties:
                  driver:
                    type: string
                    enum: [sqlite, postgres]
                    description: Active database backend driver.
                  postgres_alpha:
                    type: boolean
                    description: >
                      True when the Postgres backend is running in
                      experimental/alpha mode (BURROW_EXPERIMENTAL_POSTGRES_BACKEND=true).
                  url_redacted:
                    type: string
                    description: >
                      Credential-redacted connection string. For SQLite this is
                      the on-disk file path; for Postgres user:pass is replaced
                      with ****:****.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
