  # ────────────────────────────────────────────────────────────────────────
  # Clients
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/clients:
    get:
      tags: [clients]
      operationId: clientsList
      x-burrow-permission: {kind: needs, any_of: ["tunnels:read:any"]}
      summary: List live clients (admin)
      responses:
        '200':
          description: List of clients.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/clients/known:
    get:
      tags: [clients]
      operationId: knownClientsList
      x-burrow-permission: {kind: needs, any_of: ["tunnels:read:any"]}
      summary: List every client that has a token (admin)
      description: >
        One row per client token of every user: a client that is online with
        its live sessions, a client that is offline with the last session the
        relay remembers, and a token that never connected. Online rows come
        first (by name), then the offline ones (last seen first), then those
        that never connected (by name). `GET /api/v1/clients` keeps listing
        the live sessions only.
      responses:
        '200':
          description: The known clients.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KnownClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/clients/{sessionID}:
    get:
      tags: [clients]
      operationId: clientGet
      x-burrow-permission: {kind: needs, any_of: ["tunnels:read:any"]}
      summary: Get one live client (admin)
      parameters:
        - name: sessionID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Client detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/clients/connect-info:
    get:
      tags: [clients]
      operationId: clientConnectInfoGet
      x-burrow-permission: {kind: needs, any_of: ["tokens:manage:own", "tokens:manage:any"]}
      summary: Get the control-plane endpoint clients should dial
      description: >
        Returns the host:port a `burrow connect` invocation must point at
        with --server. Session-authed; any signed-in user may read it so
        the "Connect a client" wizard can print a working command.
      responses:
        '200':
          description: Connect info envelope.
          content:
            application/json:
              schema:
                type: object
                required: [server]
                properties:
                  server: { type: string, example: "relay.example.com:7000" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/client/discovery:
    get:
      tags: [clients]
      operationId: clientDiscoveryGet
      x-burrow-permission: {kind: public, any_of: []}
      x-burrow-mcp: false
      summary: Tell a client where the control endpoint is and which version the relay runs
      description: >
        Public (no authentication): `burrow login <relay>` asks here before it
        has a token. `control` is the value `/clients/connect-info` returns;
        the control endpoint is a public port, not a secret. The response
        holds these four fields and nothing else. Rate-limited per source IP
        (60 requests per minute). Not cacheable.
      security: []
      responses:
        '200':
          description: Discovery document.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [control, version, min_client_version, protocol_version]
                properties:
                  control:
                    type: string
                    description: host:port of the control endpoint.
                    example: "burrow.example.com:7000"
                  version:
                    type: string
                    description: The relay's version.
                    example: "0.6.0"
                  min_client_version:
                    type: string
                    description: Oldest client version the relay accepts; empty when there is no minimum.
                    example: "0.6.0"
                  protocol_version:
                    type: integer
                    description: Version of the control protocol the relay speaks.
                    example: 1
                  control_cert_sha256:
                    type: string
                    description: >
                      SHA-256 of the leaf certificate the control port presents, as 64 lower-case hex
                      digits. `burrow login` reads it over the verified HTTPS dashboard and pins the
                      control port to it. Omitted when the relay cannot say.
                    example: "3b7a0c5e9f1d2a4b6c8e0f1a3b5d7f9021436587a9bcde0f1a2b3c4d5e6f7a8b"
        '429':
          description: Rate-limited (per source IP).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/client/login/start:
    post:
      tags: [clients]
      operationId: clientLoginStart
      x-burrow-permission: {kind: public, any_of: []}
      x-burrow-mcp: false
      summary: Start a browser-approved client sign-in
      description: >
        Public (no authentication): `burrow login <relay>` asks here before it
        has a token. The shape follows the OAuth device authorization grant
        (RFC 8628). The client shows `user_code` and `verification_url` to the
        user and polls `/client/login/poll` with `device_code`. `device_code`
        is returned here once and stored only as a hash. A request lives ten
        minutes. The strings in the body are display text only: the relay
        strips control characters and caps their length. Rate-limited per
        source IP (10 requests per minute); at most 20 requests may be
        pending at a time, and at most 5 from one source IP. Starting a
        request is not audited. Not cacheable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostname: { type: string, maxLength: 253, example: "laptop.local" }
                os: { type: string, maxLength: 64, example: "linux" }
                arch: { type: string, maxLength: 64, example: "amd64" }
                client_version: { type: string, maxLength: 64, example: "0.6.0" }
                token_name:
                  type: string
                  maxLength: 120
                  description: Optional name the client suggests for its token; the approver decides.
      responses:
        '200':
          description: Sign-in request opened.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [device_code, user_code, verification_url, expires_in, interval]
                properties:
                  device_code:
                    type: string
                    description: Secret of the client (32 random bytes, base64url). Never shown to the user.
                  user_code:
                    type: string
                    description: Code the user confirms in the dashboard.
                    example: "ABCD-EFGH"
                  verification_url:
                    type: string
                    example: "https://burrow.example.com/link?code=ABCD-EFGH"
                  expires_in:
                    type: integer
                    description: Lifetime of the request in seconds.
                    example: 600
                  interval:
                    type: integer
                    description: Shortest time between two polls, in seconds.
                    example: 2
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: Rate-limited (per source IP), or too many pending sign-in requests (in all, or from this source IP).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/client/login/poll:
    post:
      tags: [clients]
      operationId: clientLoginPoll
      x-burrow-permission: {kind: public, any_of: []}
      x-burrow-mcp: false
      summary: Collect the outcome of a client sign-in
      description: >
        Public (no authentication): `device_code` is the credential. Once the
        request is approved, the first poll mints the client token for the
        approving user, returns it and deletes the request in one
        transaction; the plaintext token is never stored and every later poll
        answers 410. Rate-limited per source IP (60 requests per minute);
        polling one device code more often than every `interval` seconds
        answers 429 with `error: slow_down`. Not cacheable.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code: { type: string }
      responses:
        '200':
          description: Approved. The token is returned exactly once.
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, token_name, email]
                properties:
                  token: { type: string, description: The new client token (plaintext). }
                  token_name: { type: string }
                  email: { type: string, description: Email of the user who approved and owns the token. }
        '202':
          description: No decision yet; poll again after `interval` seconds.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: The request was denied (`error` is `access_denied`). Reported once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: Unknown device code, expired request, or token collected already (`error` is `expired_token`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Polled too fast (`error` is `slow_down`), or rate-limited per source IP.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/client/login/requests/{user_code}:
    get:
      tags: [clients]
      operationId: clientLoginRequestGet
      x-burrow-permission: {kind: dashboard, any_of: ["tokens:manage:own", "tokens:manage:any"]}
      x-burrow-mcp: false
      summary: Show a client sign-in request to the signed-in user
      description: >
        Dashboard session only (automation bearer tokens are refused). The
        code is accepted with or without the dash, in any case. Unknown and
        expired codes are the same 404; after 20 wrong codes in a minute the
        user gets 429 on all three request endpoints. The strings that came
        from the client are untrusted display text.
      parameters:
        - { name: user_code, in: path, required: true, schema: { type: string }, example: "ABCD-EFGH" }
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientLoginRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Too many wrong codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/client/login/requests/{user_code}/approve:
    post:
      tags: [clients]
      operationId: clientLoginRequestApprove
      x-burrow-permission: {kind: dashboard, any_of: ["tokens:manage:own", "tokens:manage:any"]}
      x-burrow-mcp: false
      summary: Approve a client sign-in request
      description: >
        Dashboard session with the permission to manage client tokens
        (`tokens:manage:own` or `tokens:manage:any`), CSRF-protected like every
        state-changing session request. Marks the pending request approved by
        the caller; the client token is minted for the caller, with
        `token_name`, when the client collects it. Audited as
        `client.login.approved`. While the relay has no services domain
        (BURROW_SERVICES_DOMAIN) the session must have confirmed its password
        in the last ten minutes (`POST /api/v1/auth/reauth`; 403
        `reauth_required` otherwise). A body `password` is still accepted
        instead: 403 for a wrong one. It counts as a confirmation like
        `POST /auth/reauth`: audited as `auth.reauth`, and ten wrong
        passwords in a minute from one session (here, at `/auth/reauth` and
        at the password change together) lock that session for that minute
        (429). The route is limited per address like the sign-in;
        `password_required` on the request says which applies.
      parameters:
        - { name: user_code, in: path, required: true, schema: { type: string }, example: "ABCD-EFGH" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_name]
              properties:
                token_name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Name of the token to create; no control characters.
                password:
                  type: string
                  format: password
                  description: >
                    The caller's account password. Accepted instead of a
                    recent `POST /auth/reauth` while the relay has no
                    services domain; ignored otherwise.
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientLoginRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The request was approved or denied already; nothing changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many wrong codes, too many approvals from this address, or too many wrong passwords from this session (while the password is required).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/client/login/requests/{user_code}/deny:
    post:
      tags: [clients]
      operationId: clientLoginRequestDeny
      x-burrow-permission: {kind: dashboard, any_of: ["tokens:manage:own", "tokens:manage:any"]}
      x-burrow-mcp: false
      summary: Deny a client sign-in request
      description: >
        Dashboard session, CSRF-protected. Marks the pending request denied;
        the client's next poll answers 403. Audited as `client.login.denied`.
      parameters:
        - { name: user_code, in: path, required: true, schema: { type: string }, example: "ABCD-EFGH" }
      responses:
        '200':
          description: Denied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientLoginRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The request was approved or denied already; nothing changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many wrong codes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ────────────────────────────────────────────────────────────────────────
  # OAuth: consent, connected apps, pre-registered clients
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/oauth/requests/{id}:
    get:
      tags: [oauth]
      operationId: oauthRequestGet
      x-burrow-permission: {kind: dashboard, any_of: []}
      x-burrow-mcp: false
      summary: Show a pending OAuth authorization request
      description: >
        Dashboard session of a role that holds any permission (an automation
        token gets 403). The consent page reads the request that
        `GET /oauth/authorize` stored (ten minutes, decided once).
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/oauth/requests/{id}/approve:
    post:
      tags: [oauth]
      operationId: oauthRequestApprove
      x-burrow-permission: {kind: dashboard, any_of: []}
      x-burrow-mcp: false
      summary: Approve a pending OAuth authorization request
      description: >
        Dashboard session, CSRF-protected. Issues a 60-second single-use
        authorization code in the caller's name and answers the client's
        redirect URI with `code`, `state` and `iss`. At /mcp/burrow the
        scopes are burrow:read, burrow:write or permissions the caller's role
        grants (a token's permissions are the scopes intersected with the
        role at each use). At a gateway resource the caller needs
        ai:configure:own or :any, and the grant carries `allowed_tools`
        (absent: every source the request lists) and `tools_read_only`
        (absent: true). Audited as `oauth.grant.approve`. While the relay
        has no services domain the session must have confirmed its password
        in the last ten minutes (403 `reauth_required`), or send `password`
        (403 for a wrong one; counted and audited like `POST /auth/reauth`,
        so ten wrong ones in a minute lock the session for that minute); the
        route is then limited per address like the sign-in. `scopes` may
        narrow the requested scopes but not widen them: each chosen scope
        must stand for permissions the requested ones already stand for
        (burrow:read lies within burrow:write); anything else is refused
        with 400 and the request keeps waiting.
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes:
                  type: array
                  items: { type: string }
                  description: Replaces the requested scopes with a subset of them (burrow:read counts as a subset of burrow:write). Absent keeps them.
                allowed_tools:
                  type: array
                  items: { type: string }
                  description: 'A gateway grant''s allow-list, at most 64 entries "<source>__<tool>" or "<source>__*" ("<slug>__…" only at /mcp/<slug>); [] grants no tools.'
                tools_read_only:
                  type: boolean
                  description: A gateway grant serves read-only tools only. Absent means true.
                password:
                  type: string
                  format: password
                  description: The caller's password, accepted instead of a recent `POST /auth/reauth` while no services domain is set.
      responses:
        '200':
          description: Approved; send the browser to redirect_url.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthRedirect' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Too many approvals from this address, or too many wrong passwords from this session (while the password is required).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/oauth/requests/{id}/deny:
    post:
      tags: [oauth]
      operationId: oauthRequestDeny
      x-burrow-permission: {kind: dashboard, any_of: []}
      x-burrow-mcp: false
      summary: Deny a pending OAuth authorization request
      description: >
        Dashboard session, CSRF-protected. Answers the client's redirect URI
        with `error=access_denied`, `state` and `iss`. No body.
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          description: Denied; send the browser to redirect_url.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthRedirect' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/oauth/grants:
    get:
      tags: [oauth]
      operationId: oauthGrantsList
      x-burrow-permission: {kind: dashboard, any_of: []}
      summary: List connected apps
      description: >
        Dashboard session. The caller's own grants that are not revoked; with
        `all=1` every user's (needs oauth:clients:manage).
      parameters:
        - { name: all, in: query, required: false, schema: { type: string, enum: ['1', 'true'] } }
      responses:
        '200':
          description: The grants, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OAuthGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/oauth/grants/{id}:
    delete:
      tags: [oauth]
      operationId: oauthGrantDelete
      x-burrow-permission: {kind: dashboard, any_of: []}
      summary: Revoke a connected app
      description: >
        Dashboard session, CSRF-protected. Ends the grant: its access and
        refresh tokens stop working at once. The caller's own grant, or any
        with oauth:clients:manage (another user's is 404 otherwise). Audited
        as `oauth.grant.revoke`.
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/oauth/clients:
    get:
      tags: [oauth]
      operationId: oauthClientsList
      x-burrow-permission: {kind: needs, any_of: ["oauth:clients:manage"]}
      summary: List pre-registered OAuth clients
      responses:
        '200':
          description: The clients, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OAuthClient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [oauth]
      operationId: oauthClientCreate
      x-burrow-permission: {kind: needs, any_of: ["oauth:clients:manage"]}
      x-burrow-mcp: false
      summary: Pre-register an OAuth client
      description: >
        For an MCP client without a client metadata document. A public
        client: no secret. A redirect URI is https, http on a loopback
        address (any port matches at authorization) or an app scheme with a
        dot (com.example.app:/cb); no fragment. Audited as
        `oauth.client.create`.

        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not register where authorization codes are sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, redirect_uris]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items: { type: string }
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthClient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
  /api/v1/oauth/clients/{id}:
    delete:
      tags: [oauth]
      operationId: oauthClientDelete
      x-burrow-permission: {kind: needs, any_of: ["oauth:clients:manage"]}
      summary: Delete a pre-registered OAuth client
      description: Revokes every grant of the client. Audited as `oauth.client.delete`.
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Geo
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/geo/status:
    get:
      tags: [geo]
      operationId: geoStatusGet
      x-burrow-permission: {kind: needs, any_of: ["ipgeo:manage:own", "ipgeo:manage:any"]}
      summary: Global geo-lookup status (enabled, db path, age)
      responses:
        '200':
          description: Status envelope.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, db_path, db_age_seconds]
                properties:
                  enabled: { type: boolean }
                  db_path: { type: string }
                  db_age_seconds:
                    type: integer
                    format: int64
                    nullable: true
                    description: Null while geo lookup is disabled.
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # MCP (burrowd mcp — JSON-RPC 2.0 tool server, spec Part P)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/mcp/status:
    get:
      tags: [mcp]
      operationId: mcpStatusGet
      x-burrow-permission: {kind: needs, any_of: ["mcp:tools:read"]}
      summary: burrowd mcp listener status (enabled, listen, token_id)
      responses:
        '200':
          description: Status envelope (plaintext bearer is never returned).
          content:
            application/json:
              schema:
                type: object
                required: [enabled, listen, token_id, endpoint, operations]
                properties:
                  enabled: { type: boolean }
                  listen:
                    type: string
                    description: Always empty; the endpoint is served on the main address.
                  token_id:
                    type: string
                    description: Always empty; the endpoint takes any automation token.
                  endpoint:
                    type: string
                    description: The path of the management MCP endpoint on the relay's main address.
                    example: /mcp/burrow
                  operations:
                    type: integer
                    description: The number of operations the generic tools reach (burrow_call_operation).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/mcp/tools:
    get:
      tags: [mcp]
      operationId: mcpToolsList
      x-burrow-permission: {kind: needs, any_of: ["mcp:tools:read"]}
      summary: The MCP tools offered by name (name, description, parameters_schema, permissions, kind)
      responses:
        '200':
          description: Tool inventory.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, description, parameters_schema, permission, permissions, kind, generic]
                  properties:
                    name: { type: string }
                    description: { type: string }
                    parameters_schema: { type: object }
                    permission:
                      type: string
                      description: The first of permissions; empty for a tool every token may call.
                    permissions:
                      type: array
                      items: { type: string }
                      description: The token needs one of these (the operation's x-burrow-permission any_of); empty for a tool every token may call.
                    kind:
                      type: string
                      enum: [read, write, delete]
                      description: read for a GET, delete for an operation that removes something (it takes confirm), write otherwise.
                    generic:
                      type: boolean
                      description: True for the tools that reach any operation, false for a curated tool.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Upstream credentials (spec Part B.2, v0.5.0 Task 5)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/upstream-credentials/slots:
    get:
      tags: [services]
      operationId: upstreamCredentialSlotsList
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      summary: List available vault slot handles (admin or ai:configure:any)
      responses:
        '200':
          description: Sorted list of slot handles registered in the env vault.
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/services/{serviceID}/upstream-credential:
    get:
      tags: [services]
      operationId: serviceUpstreamCredentialGet
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:own", "ai:configure:any"]}
      summary: Read the upstream-credential binding for a service
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Binding (when bound) or {slot_present:false} (when unbound).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamCredentialBinding' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [services]
      operationId: serviceUpstreamCredentialUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:own", "ai:configure:any"]}
      x-burrow-mcp: false
      summary: Bind an upstream credential slot to a service
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot]
              properties:
                slot: { type: string }
                header_name: { type: string }
                header_format: { type: string }
      responses:
        '204': { description: Bound. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [services]
      operationId: serviceUpstreamCredentialDelete
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:own", "ai:configure:any"]}
      x-burrow-mcp: false
      summary: Unbind the upstream credential from a service
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Unbound (also returned when no binding existed). }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Custom domains (v0.5.0 Task 7, spec D.2)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/services/{serviceID}/domains:
    get:
      tags: [services]
      operationId: serviceDomainsList
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: List custom domains bound to a service
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The custom domains of the service (no key_pem).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CustomDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [services]
      operationId: serviceDomainCreate
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      x-burrow-mcp: false
      summary: Add a custom domain to a service
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, cert_pem, key_pem]
              properties:
                hostname: { type: string }
                cert_pem: { type: string }
                key_pem: { type: string }
      responses:
        '201':
          description: Domain created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomDomain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '409': { description: Hostname already bound. }
  /api/v1/services/{serviceID}/domains/{did}:
    get:
      tags: [services]
      operationId: serviceDomainGet
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: Get a single custom domain by ID
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The custom domain (no key_pem).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [services]
      operationId: serviceDomainUpdate
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      x-burrow-mcp: false
      summary: Replace the cert/key for a custom domain
      description: |
        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
        - name: did
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, cert_pem, key_pem]
              properties:
                hostname: { type: string }
                cert_pem: { type: string }
                key_pem: { type: string }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Hostname already bound. }
    delete:
      tags: [services]
      operationId: serviceDomainDelete
      x-burrow-permission: {kind: needs, any_of: ["services:configure:own", "services:configure:any"]}
      summary: Remove a custom domain
      parameters:
        - name: serviceID
          in: path
          required: true
          schema: { type: string }
        - name: did
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Connection Logs (spec E.2)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/connection-logs:
    get:
      tags: [audit]
      operationId: connectionLogsList
      x-burrow-permission: {kind: needs, any_of: ["audit:read"]}
      summary: List per-tunnel connection log entries (newest first)
      description: |
        Returns connection_logs rows with cursor pagination. Permission:
        admin OR audit:read. Filterable by kind, service_id, since, until,
        and free-text q. Cursor: ?before_id=<last_id> for the next older page.
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [control, http_proxy, tcp_proxy] }
        - name: service_id
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
        - name: before_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Array of connection log entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectionLog' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/connection-logs/rollups:
    get:
      tags: [audit]
      operationId: connectionLogRollupsList
      x-burrow-permission: {kind: needs, any_of: ["audit:read"]}
      summary: List daily connection log rollup rows
      description: |
        Returns connection_log_rollups rows (daily aggregates). Permission:
        admin OR audit:read.
      parameters:
        - name: service_id
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [control, http_proxy, tcp_proxy] }
        - name: since
          in: query
          description: Only rows from this time on. RFC 3339, or a plain date YYYY-MM-DD.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Only rows up to this time. RFC 3339, or a plain date YYYY-MM-DD.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Array of rollup rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectionLogRollup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/connection-logs/export:
    get:
      tags: [audit]
      operationId: connectionLogsExport
      x-burrow-permission: {kind: needs, any_of: ["audit:read"]}
      x-burrow-mcp: false
      summary: Export connection logs as NDJSON or CSV
      description: |
        Streams all matching connection log rows as NDJSON (default) or
        CSV (?format=csv). Permission: admin OR audit:read.
        Up to 1000 rows in v0.5.0; full streaming deferred to Task 17.
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [ndjson, csv], default: ndjson }
        - name: kind
          in: query
          schema: { type: string }
        - name: service_id
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Streamed NDJSON or CSV file.
          content:
            application/x-ndjson:
              schema: { type: string }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Events (SSE)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/events:
    get:
      tags: [events]
      operationId: eventsStream
      x-burrow-permission: {kind: dashboard, any_of: ["tunnels:read:own", "tunnels:read:any", "services:configure:own", "services:configure:any", "ai:read:own", "ai:read:any", "inspector:read:own", "inspector:read:any"]}
      x-burrow-mcp: false
      summary: Server-sent events stream (dashboard refresh)
      responses:
        '200':
          description: text/event-stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # OpenAPI viewer (v0.5.0 Task 11, spec J.2)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/openapi/viewer/:
    get:
      tags: [openapi]
      operationId: openapiViewerGet
      x-burrow-permission: {kind: needs, any_of: ["metrics:read"]}
      x-burrow-mcp: false
      summary: Embedded hand-rolled OpenAPI browser (metrics:read or admin)
      description: >
        Serves the embedded single-page OpenAPI viewer. Fetches
        /api/v1/openapi.yaml client-side (one same-origin GET) and renders
        a sidebar index of all routes with path, parameters, request body,
        and responses. Gated by admin OR metrics:read. No CDN, no phone-home.
      responses:
        '200':
          description: HTML viewer page.
          content:
            text/html:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/openapi/viewer/static/{file}:
    get:
      tags: [openapi]
      operationId: openapiViewerStaticGet
      x-burrow-permission: {kind: needs, any_of: ["metrics:read"]}
      x-burrow-mcp: false
      summary: Viewer static assets (closed allowlist — viewer.css, viewer.js only)
      description: >
        Serves viewer.css or viewer.js from the embedded FS. Any other path
        returns 404. Gated by admin OR metrics:read (same as the viewer HTML).
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, enum: [viewer.css, viewer.js] }
      responses:
        '200':
          description: CSS or JS asset.
          content:
            text/css:
              schema: { type: string }
            application/javascript:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # MCP gateway tool sources (v0.12.0)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/mcp/sources:
    get:
      tags: [mcp]
      operationId: mcpSourcesList
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:read", "mcp:sources:manage"]}
      summary: List tool sources
      description: |
        Returns one entry per tool source, ordered by slug. A source is an
        MCP server whose tools the gateway serves behind gateway keys: a
        remote server the relay calls, or one behind a client. The
        credential is never part of the answer: `credential_slot` names a
        vault slot and `credential_present` tells whether it holds a value.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Array of tool sources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MCPSource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [mcp]
      operationId: mcpSourceCreate
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:manage"]}
      x-burrow-mcp: false
      summary: Create a tool source (admin)
      description: |
        Kind `remote` adds an MCP server the relay calls itself: `url` must
        be an https URL without credentials, query or fragment, and its
        host must resolve to a public address (unless private upstreams
        are allowed on the relay). It gets a hidden backing service row
        owned by the caller, which is never listed under services. The
        credential is set on the relay: `credential_slot` names the vault
        slot (`BURROW_UPSTREAM_KEY_<SLOT>`) and `auth_header` / `auth_format`
        say how it is sent upstream (`Authorization` and `Bearer {key}` when
        left out). A field this body does not have (for example `api_key`)
        is refused with 400 naming the field.

        Kind `tunnel` binds an MCP server behind a client to the existing
        http service `service_id` and closes that service's direct doors
        (gateway-only). The caller must be able to configure the service.
        `url` and the credential fields are refused on this kind.

        The slug is 1-24 characters of a-z, 0-9 and hyphens, starting and
        ending with a letter or digit; `burrow` and `v1` are reserved. It
        names the source at `/mcp/<slug>` and prefixes its tools on `/mcp`.
        `timeout_s` is 60 when left out (at most 300), `rpm` 0 (no limit)
        and `max_concurrent` 16 (0 means no limit and must be asked for). While the relay has no services
        domain, a dashboard session must have confirmed its password
        recently (see `POST /api/v1/auth/reauth`).

        Not offered as a management MCP tool: tool text an upstream wrote
        could otherwise steer an agent into pointing a source, and with it
        a credential, at a host of the upstream's choosing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPSourceCreate' }
            example: { slug: github, name: GitHub, kind: remote, url: 'https://mcp.example.com/mcp', credential_slot: GITHUB_MCP }
      responses:
        '201':
          description: The source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPSource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '409':
          description: The slug or the service is already used by a source, or `service_id` is not an http service.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/mcp/sources/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [mcp]
      operationId: mcpSourceGet
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:read", "mcp:sources:manage"]}
      summary: Get one tool source
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [mcp]
      operationId: mcpSourceUpdate
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:manage"]}
      x-burrow-mcp: false
      summary: Change a tool source (admin)
      description: |
        A field that is left out keeps its stored value; `""` clears
        `credential_slot` and `protocol_version`. The slug and the kind
        never change. `url`, `credential_slot`, `auth_header` and
        `auth_format` belong to a remote source and are refused with 400 on
        a tunnel source. Concurrent updates of different fields are both
        kept. The same recent-confirmation rule as for creating applies.

        An approval was given for one upstream and one credential: when
        `url` or `credential_slot` changes, every approved tool of the
        source goes back to pending (and is not served until approved
        again), and the audit entry `mcp.source.update` says how many in
        `tools_back_to_pending`. Every tool's `current_hash` is cleared as
        well: the old definition stays readable, but approving it answers
        409 until a sync has read the new upstream. The relay starts that
        sync in the background right after the change (audited as
        `mcp.source.sync` with `background: true`). Other fields leave the
        approvals as they are. Not offered as a management MCP tool, for the reason given at
        creating a source.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPSourceUpdate' }
            example: { rpm: 60, timeout_s: 30 }
      responses:
        '200':
          description: The source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPSource' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The source was changed by someone else at the same time (try again).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [mcp]
      operationId: mcpSourceDelete
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:manage"]}
      summary: Delete a tool source (admin)
      description: |
        Removes the source and its tools. A remote source's hidden backing
        service goes with it, and with that its usage settings and
        inspector history; the vault slot is configured on the relay and is
        not touched. For a tunnel source the service and its tunnel are
        kept, only unbound (its gateway-only flag stays as it is). The OAuth
        grants issued for `/mcp/<slug>` are revoked first, so a later source
        of the same slug is not reached by them (grants for `/mcp` keep their
        `<slug>__…` entries). The same recent-confirmation rule as for
        creating applies.
      responses:
        '204': { description: Source deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/mcp/sources/{slug}/sync:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [mcp]
      operationId: mcpSourceSync
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:manage"]}
      summary: Sync a tool source's tools now (admin)
      description: |
        Reads the upstream's tool list and stores it; the relay also does
        this every 10 minutes for each enabled source. A tool seen for the
        first time, or whose definition changed, becomes pending and is not
        served until approved; a tool the upstream no longer lists becomes
        removed. Titles, descriptions and schemas go through the guardrail
        request patterns and hits are stored with the tool. A failed sync
        keeps the tools as they were and records its reason in the source's
        `last_sync_error`. The same recent-confirmation rule as for
        creating a source applies. A token caller gets the 502 message as a
        fixed class (see `last_sync_error`) and skipped tools as
        "(name withheld)": both can carry the upstream's words.
      responses:
        '200':
          description: What the sync found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPSyncResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A sync of this source is already running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: The upstream could not be read; the message says why (never a URL or credential).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: The tool gateway is not available on this relay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/mcp/sources/{slug}/tools:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [mcp]
      operationId: mcpSourceToolsList
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:read", "mcp:sources:manage"]}
      x-burrow-mcp: false
      summary: List the tools of a tool source
      description: |
        Every tool the syncs have seen, removed ones included, ordered by
        name, with the approved definition next to a changed one and the
        operator's overrides. Not offered as a management MCP tool: the
        definitions are text the upstream wrote, which could steer an agent
        (the source list and a single source stay available).
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Array of tools.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MCPSourceTool'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/mcp/sources/{slug}/tools/{name}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: name
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [mcp]
      operationId: mcpSourceToolUpdate
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:manage"]}
      x-burrow-mcp: false
      summary: Change a tool's overrides (admin)
      description: |
        A field that is left out keeps its value. A rename fixes a tool
        name that is too long or not allowed on the aggregated endpoint
        `/mcp`; it must not be the name or rename of another tool of the
        source (409). Not offered as a management MCP tool. The same
        recent-confirmation rule as for creating a source applies.

        A gateway key's allow-list names a tool by the name it is served
        under, so a rename can give the tool to keys whose allow-list
        already names the new name (and take it from keys that name the old
        one). When the body carries `rename` and the caller also holds
        `ai:read:any`, the answer lists the active keys of every user that
        name `<slug>__<new served name>` exactly in `keys_matching_rename`
        (id, name, prefix, owner), and the live OAuth grants that name it the
        same way in `grants_matching_rename` (id, client name, owner), so the
        dashboard can warn. Any other caller is told nothing about the keys
        or grants, not even how many there are. Keys and grants with
        `<slug>__*` had the tool before and are not listed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPSourceToolUpdate' }
            example: { rename: create_issue, read_only: false }
      responses:
        '200':
          description: The tool, with keys_matching_rename and grants_matching_rename for a caller with ai:read:any when the body carried a rename.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MCPSourceTool'
                  - type: object
                    properties:
                      keys_matching_rename:
                        type: array
                        description: Those keys. Only present when the body carried rename and the caller holds ai:read:any (it shows other users' keys).
                        items:
                          type: object
                          required: [id, name, key_prefix, user_id]
                          properties:
                            id: { type: string }
                            name: { type: string }
                            key_prefix: { type: string }
                            user_id: { type: string }
                      grants_matching_rename:
                        type: array
                        description: The live OAuth grants, of any user, whose allow-list names the new served name exactly. Present on the same terms as keys_matching_rename.
                        items:
                          type: object
                          required: [id, client_name, user_id]
                          properties:
                            id: { type: string }
                            client_name: { type: string }
                            user_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The rename is already the name or rename of another tool of the source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/mcp/sources/{slug}/tools/{name}/approve:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [mcp]
      operationId: mcpSourceToolApprove
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:manage"]}
      x-burrow-mcp: false
      summary: Approve a pending tool (admin)
      description: |
        Approves the tool's current definition, which is served from then
        on. `hash` (required) is the `current_hash` that was reviewed: when
        the upstream changed the definition since, the approval is refused
        with 409. It is refused with 409 as well while another approved
        tool of the source is served under the same name (a rename). Not offered as a management MCP tool: an agent must not approve
        tool text that may have been written to steer it. The same
        recent-confirmation rule as for creating a source applies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hash]
              properties:
                hash: { type: string, description: 'The current_hash that was reviewed.' }
      responses:
        '200':
          description: The tool, approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPSourceTool' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The tool is not pending, its definition changed since it was reviewed, or another approved tool is served under its name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/mcp/sources/{slug}/approve-all:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [mcp]
      operationId: mcpSourceApproveAll
      x-burrow-permission: {kind: needs, any_of: ["mcp:sources:manage"]}
      x-burrow-mcp: false
      summary: Approve every pending tool of a source (admin)
      description: |
        `hashes` (required) maps each tool to approve to the `current_hash`
        that was reviewed; a tool is approved only while its definition is
        still that one. Tools that are not pending or changed are left out;
        tools another approved tool is served under the name of are listed
        in `conflicts`. Not offered as a management MCP tool. The same recent-confirmation rule
        as for creating a source applies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hashes]
              properties:
                hashes:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '200':
          description: The tools that were approved.
          content:
            application/json:
              schema:
                type: object
                required: [approved, conflicts]
                properties:
                  approved:
                    type: array
                    items: { type: string }
                  conflicts:
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # AI providers (v0.7.0)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/ai/providers:
    get:
      tags: [models]
      operationId: providersList
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:providers:manage"]}
      summary: List AI providers
      description: |
        Returns one entry per row of the providers table, ordered by slug.
        A caller who is not an admin sees only the providers whose backing
        service they may see (same visibility as GET /api/v1/services).
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Array of providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIProvider'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [models]
      operationId: providerCreate
      x-burrow-permission: {kind: needs, any_of: ["ai:providers:manage"]}
      x-burrow-mcp: false
      summary: Create a provider (admin)
      description: |
        Kind "tunnel" registers an existing http service in API-key mode as
        a provider (service_id is required). Kind "direct" adds a provider
        the relay calls itself (base_url and credential_slot are required);
        its backing service is created with it and owned by the caller.
        The provider is then served at
        https://<auth_domain>/ai/<provider>/v1. When slug is empty it is
        derived from name. A field this body does not have (for example
        api_key) is refused with 400 naming the field, for either kind:
        the credential is set on the relay, not through this API.
        api_format is for both kinds and says which format the provider
        speaks: "openai" when left out, "anthropic" for a model server that
        speaks the Anthropic format. The other upstream settings (base_url,
        credential_slot, auth_header, auth_format, extra_headers, billing)
        are for kind "direct"; on a tunnel create, or one without a kind,
        they are refused with 400 instead of being dropped. So are
        supports_responses and max_concurrent on a tunnel create: a tunnel
        provider gets them with PUT /api/v1/ai/providers/{slug}.

        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [name]
                  properties:
                    slug:
                      type: string
                      pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
                      description: Optional. "v1" is reserved.
                    name: { type: string, minLength: 1, maxLength: 120 }
                    kind: { type: string, enum: [tunnel, direct], default: tunnel }
                    service_id: { type: string, description: Kind "tunnel" only. }
                    gateway_only:
                      type: boolean
                      description: Kind "tunnel" only (ignored for "direct"). Sets gateway-only on the backing service after the provider is created; if that fails the provider still exists (201) and the flag can be set from the service page.
                - $ref: '#/components/schemas/AIProviderUpstream'
            examples:
              tunnel:
                value: { name: Ollama, kind: tunnel, service_id: 0b1f6c0e-4f0a-4a55-9b53-0d0c8f5a2a11 }
              tunnel_anthropic:
                value: { name: Local Claude, kind: tunnel, service_id: 0b1f6c0e-4f0a-4a55-9b53-0d0c8f5a2a11, api_format: anthropic }
              direct:
                value:
                  name: OpenRouter
                  slug: openrouter
                  kind: direct
                  base_url: https://openrouter.ai/api/v1
                  credential_slot: OPENROUTER
                  extra_headers: { X-Title: Burrow }
      responses:
        '201':
          description: Provider created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '409':
          description: >
            The slug or the name is taken, the service already backs a
            provider, or the service is not an http service in API-key mode.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ai/providers/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [models]
      operationId: providerGet
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:providers:manage"]}
      summary: Get one provider
      description: |
        Returns 404 when no provider has that slug or its backing service is
        not visible to the caller.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [models]
      operationId: providerUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:providers:manage"]}
      x-burrow-mcp: false
      summary: Change a provider's slug and name (admin)
      description: |
        After a slug change the old base URL stops working immediately;
        there is no redirect. supports_responses is optional: it states
        whether the provider offers the OpenAI Responses API and is how a
        tunnel provider is flagged. max_concurrent is optional too: it sets
        how many requests the provider serves at once (0 = no limit) and is
        how a tunnel provider gets a limit. api_format is optional as well
        and sets the API format of a tunnel provider. Left out, the stored
        values stay. Slug, name, supports_responses, max_concurrent and
        api_format are stored together or not at all: supports_responses
        true for a provider whose api_format is not openai, or a limit
        outside 0-1000, is refused with 400 and the rest stays as it was.
        So is api_format on a direct provider (its format is one of its
        upstream settings, PUT /api/v1/ai/providers/{slug}/upstream), an
        api_format other than openai while the provider's
        supports_responses stays true, and an unknown api_format. The
        format of a provider that a synthetic model targets cannot change:
        409, and the rest stays as it was; naming the format the provider
        already has is not a change.

        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
                  description: '"v1" is reserved.'
                name: { type: string, minLength: 1, maxLength: 120 }
                supports_responses:
                  type: boolean
                  description: Optional. Whether the provider offers POST /responses.
                max_concurrent:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  description: Optional. How many requests the provider serves at once; 0 = no limit.
                api_format:
                  type: string
                  enum: [openai, anthropic]
                  description: Optional, tunnel providers only. The API format the model server behind the client speaks.
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The slug is already in use by another provider, the slug is the
            name of a synthetic model, (direct provider) the name is taken
            by another service of the owner, or api_format would change
            while a synthetic model targets the provider; the message is
            then "provider is used by model(s): " followed by their names.
            Nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [models]
      operationId: providerDelete
      x-burrow-permission: {kind: needs, any_of: ["ai:providers:manage"]}
      summary: Delete a provider (admin)
      description: |
        Removes the provider; its base URL stops working immediately. For a
        tunnel provider the backing service, its API keys and its tunnel are
        kept. For a direct provider the backing service is removed with it,
        and with that its API keys, AI configuration and model list; the
        vault slot is configured on the relay and is not touched. A provider
        that a synthetic model targets is not deleted: remove the targets
        first.
      responses:
        '204': { description: Provider deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            A synthetic model targets the provider. The message is
            "provider is used by model(s): " followed by their names.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ai/providers/{slug}/upstream:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [models]
      operationId: providerUpstreamUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:providers:manage"]}
      x-burrow-mcp: false
      summary: Change a direct provider's upstream settings (admin)
      description: |
        A field that is left out keeps its stored value, so the credential
        slot stays unless the body names another one. extra_headers {}
        removes all extra headers. The change applies to the next request.
        The response shows the stored auth_header and auth_format and the
        names of the extra headers (extra_header_names); header values are
        never returned. Concurrent updates of different fields are both
        kept. A field this body does not have (for example api_key) is
        refused with 400 naming the field.

        Not a tool of the management MCP server (`/mcp/burrow`): an agent must not re-route credentials or switch off inspection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIProviderUpstream'
            example: { base_url: 'https://openrouter.ai/api/v1', billing: flat }
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProvider'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The provider is a tunnel provider and has no upstream settings,
            or it was changed by someone else at the same time (try again).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ai/providers/{slug}/models:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [models]
      operationId: providerModelsList
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:providers:manage"]}
      summary: List a provider's stored models
      description: |
        The list GET /ai/<provider>/v1/models answers from. Returns 404 when
        no provider has that slug or its backing service is not visible to
        the caller.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Models ordered by id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIProviderModel'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [models]
      operationId: providerModelCreate
      x-burrow-permission: {kind: needs, any_of: ["ai:providers:manage"]}
      summary: Add one model id by hand (admin)
      description: Works for either kind of provider. Adding an id that is already listed changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: No control characters, no surrounding space.
            example: { id: glm-5.1 }
      responses:
        '204': { description: Model added. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [models]
      operationId: providerModelDelete
      x-burrow-permission: {kind: needs, any_of: ["ai:providers:manage"]}
      summary: Remove one model id (admin)
      parameters:
        - name: id
          in: query
          required: true
          description: The model id. A query parameter because model ids contain "/".
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204': { description: Model removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ai/providers/{slug}/models/sync:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [models]
      operationId: providerModelsSync
      x-burrow-permission: {kind: needs, any_of: ["ai:providers:manage"]}
      x-burrow-destructive: true
      summary: Read the model list from a direct provider's upstream (admin)
      description: |
        Calls GET <upstream_base_url>/models with the provider's credential
        and replaces the stored list with the answer. The call is bounded in
        time and size, follows no redirect and is subject to the same
        address guard as every upstream request. Of the upstream's answer
        only ids, names and context lengths are kept (at most 5000 models;
        malformed entries are skipped); nothing else of it is returned. One
        sync per provider runs at a time.
      responses:
        '200':
          description: The stored list was replaced.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            The provider is a tunnel provider, its credential slot is not
            set (of several slots the first that is set is used; none of
            them is), or a sync is already running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: >
            The upstream did not answer with a model list. The message names
            the cause in general terms (for example the status code), never
            the upstream's own answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Model sync is not available on this relay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ai/providers/{slug}/metrics:
    get:
      tags: [models]
      operationId: providerMetricsGet
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:providers:manage"]}
      summary: Per-provider metrics over the trailing 24 h
      description: |
        Returns metering aggregates for one provider, read from usage_events
        of its backing service. Returns 404 when the provider does not exist
        or its backing service is not accessible to the caller.
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Metering aggregates for the provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointMetrics'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ai/gateway:
    get:
      tags: [models]
      operationId: aiGatewayGet
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: The gateway's endpoints
      description: |
        The base URL a client is given per dialect. base_url is "" when the
        relay has no auth domain; the dashboard then builds it from its own
        origin.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: One entry per dialect.
          content:
            application/json:
              schema:
                type: object
                required: [endpoints]
                properties:
                  endpoints:
                    type: array
                    items:
                      type: object
                      required: [dialect, base_url]
                      properties:
                        dialect: { type: string, enum: [openai, anthropic] }
                        base_url: { type: string }
              example:
                endpoints:
                  - { dialect: openai, base_url: 'https://tunnels.example.com/openai/v1' }
                  - { dialect: anthropic, base_url: 'https://tunnels.example.com/anthropic' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/ai/models:
    get:
      tags: [models]
      operationId: aiModelsList
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: List synthetic models
      description: Every synthetic model, ordered by name. Any signed-in caller may read them.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The models.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AIModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [models]
      operationId: aiModelCreate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      x-burrow-mcp: false
      summary: Create a synthetic model (admin or ai:configure:any)
      description: |
        Allowed for a dashboard session of an admin or of a role with
        ai:configure:any, and for an automation token that declares
        ai:configure:any (the role of the token's user alone is not
        enough). The same holds for PUT and DELETE.

        The body is at most 64 KiB and may carry only the fields of the
        schema; dialects and the timestamps are not accepted. enabled left
        out means true, translate left out means false; a timeout left out
        or 0 means its default. Every target must name an existing provider,
        and its dialect, when given, must equal that provider's api_format.

        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIModel' }
            example:
              name: burrow-intelligence
              targets:
                - { dialect: openai, provider: zai, model: glm-5.1 }
                - { dialect: anthropic, provider: zai-anthropic, model: glm-5.1 }
      responses:
        '201':
          description: Model created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIModel' }
        '400':
          description: >
            The body is not valid; the message says why (name, an unknown
            field, an unknown provider, a provider of another format, the
            number of targets, a timeout).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Another model has the name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ai/models/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [models]
      operationId: aiModelGet
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: Get one synthetic model
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [models]
      operationId: aiModelUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      x-burrow-mcp: false
      summary: Replace a synthetic model (admin or ai:configure:any)
      description: |
        The body replaces the model; targets is the new list. Three fields
        keep their stored value when left out: name, enabled and translate.
        A different name renames the model. Gateway keys that name the old name in
        allowed_models are not rewritten and no longer reach the model.
        Setting enabled to false on, or renaming, the model that an enabled guardrail judge
        uses is refused with 400 (model "…" is the guardrail judge; change the
        judge first).

        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AIModel' }
      responses:
        '200':
          description: Model updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIModel' }
        '400':
          description: The body is not valid; the message says why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another model has the new name. Nothing was changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [models]
      operationId: aiModelDelete
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:any"]}
      summary: Delete a synthetic model (admin or ai:configure:any)
      description: |
        Requests for the name are refused from then on. Gateway keys keep
        the name in allowed_models; it matches nothing until a model of that
        name exists again. The model that an enabled guardrail judge uses
        cannot be deleted: 400, as for PUT.
      responses:
        '204': { description: Model deleted. }
        '400':
          description: The model is the guardrail judge's; change the judge first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ai/keys:
    get:
      tags: [models]
      operationId: gatewayKeysList
      x-burrow-permission: {kind: needs, any_of: ["ai:read:own", "ai:read:any", "ai:configure:own", "ai:configure:any"]}
      summary: List gateway keys
      description: |
        The caller's gateway keys, newest first; a caller with ai:read:any or
        ai:configure:any sees every user's. An automation token sees every
        user's only when it declares one of those permissions and its user's
        role grants it, otherwise the keys of its user. Revoked keys are listed
        with revoked_at set. No entry carries the key.
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: The keys.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AIGatewayKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [models]
      operationId: gatewayKeyCreate
      x-burrow-permission: {kind: dashboard, any_of: ["ai:configure:own", "ai:configure:any"]}
      summary: Create a gateway key
      security:
        - CookieAuth: []
      description: |
        Needs a dashboard session: an automation token is refused with 403,
        because a gateway key does not expire and would outlive the token.
        Creates a key owned by the caller. The response carries the key
        ("bgw_" and 43 characters) and is the only one that ever does: the
        relay stores a hash. It is sent with Cache-Control: no-store. The
        body is at most 64 KiB and has no other fields than the five below.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: No control characters.
                allowed_models:
                  type: array
                  maxItems: 64
                  description: >
                    Left out or empty: every model. An entry is a synthetic
                    model name, "<provider>/<model>" or "<provider>/*"; it
                    need not name something that exists.
                  items: { type: string, maxLength: 264 }
                allowed_tools:
                  type: array
                  maxItems: 64
                  description: >
                    The MCP tools the key may call. Left out or empty: none.
                    An entry is "<source>__<tool>" or "<source>__*".
                  items: { type: string, maxLength: 160 }
                tools_read_only:
                  type: boolean
                  description: >
                    Limit the key to tools classed read-only. Left out: false.
                system_text:
                  type: string
                  description: >
                    Text put in front of the app's own system content. At
                    most 8192 bytes, not characters; longer text is refused
                    with 400. Left out or empty: none. While the global
                    request guardrails are on, a text that a request pattern
                    (bundled or custom) matches is refused with 400 naming
                    the pattern: the guardrails check a key's text like the
                    app's own.
            example:
              name: laptop
              allowed_models: [burrow-simple, 'zai/*']
      responses:
        '201':
          description: Key created.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AIGatewayKey'
                  - type: object
                    required: [key]
                    properties:
                      key:
                        type: string
                        description: The key. Shown this once.
        '400':
          description: The body is not valid; the message says why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            The caller is an automation token ("a dashboard session is
            required"), or, while the relay has no services domain, the
            session has not confirmed its password in the last ten minutes
            (`{"error":"reauth_required"}`; call `POST /api/v1/auth/reauth`
            and repeat).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/ai/keys/{id}:
    put:
      tags: [models]
      operationId: gatewayKeyUpdate
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:own", "ai:configure:any"]}
      x-burrow-mcp: false
      summary: Change a gateway key
      description: |
        Changes the name, the system text, the model and tool allow-lists and
        the read-only switch of a key; the key itself and its owner stay. A
        field left out stays as it is, an empty system_text clears the text,
        an empty allow-list clears that list (every model, no tools), an
        empty name is refused. A revoked key can still be changed. Its owner may, and so may a
        caller with ai:configure:any (an automation token only when it
        declares it and its user's role grants it). Another user's key answers 404, like an id that does not
        exist. The body is at most 64 KiB. While the global request
        guardrails are on, a system_text that a request pattern (bundled or
        custom) matches is refused with 400 naming the pattern.

        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayKeyUpdate' }
            example:
              system_text: Answer in German.
      responses:
        '403': { $ref: '#/components/responses/ForbiddenOrReauth' }
        '200':
          description: The key as it is now. It does not carry the key itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AIGatewayKey' }
        '400':
          description: The body is not valid; the message says why.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [models]
      operationId: gatewayKeyDelete
      x-burrow-permission: {kind: needs, any_of: ["ai:configure:own", "ai:configure:any"]}
      summary: Revoke a gateway key
      description: |
        The key stops working at once. Its owner may revoke it, and so may a
        caller with ai:configure:any (an automation token only when it
        declares it and its user's role grants it). Another user's key answers 404, like an id that does not
        exist.
        Revoking a revoked key is a 204 too.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Key revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/ai/requests:
    get:
      tags: [models]
      operationId: aiRequestsList
      x-burrow-permission: {kind: needs, any_of: ["inspector:read:own", "inspector:read:any"]}
      summary: List captured requests across providers
      description: |
        The requests the inspector captured for every provider, as one list,
        newest first. A provider's requests are captured while its service
        has the inspector enabled; the buffers are kept in memory and are
        empty after a restart.

        The caller gets the requests of the providers whose inspector they
        may read: every provider with inspector:read:any, the providers of
        their own services with inspector:read:own. Another user's requests
        are never listed for a caller without inspector:read:any.

        Tool calls of the MCP gateway are listed too (`kind: mcp`, `source`
        the tool source's slug, also in `provider`; `mcp` with method, tool
        and the redacted arguments; `gateway_key_id` or `oauth_grant_id`).
        They are captured on the ring of the source's backing service while
        its inspector is enabled, and follow the same rule on that service;
        in addition the source must be one the caller may read: with
        mcp:sources:read or mcp:sources:manage, or when the backing service
        is the caller's own.

        Headers and bodies are left out. The entry's service_id and id name
        the request on /api/v1/services/{service_id}/inspector/requests/{id},
        which has them.
      parameters:
        - name: provider
          in: query
          description: >
            Slug of the provider that answered the request, exact. A request
            that was sent to one provider and answered by another (a
            fallback) is listed under the one that answered. An unknown slug
            answers an empty list.
          schema: { type: string }
        - name: model
          in: query
          description: The model the caller asked for, exact. An unknown name answers an empty list.
          schema: { type: string }
        - name: gateway_key
          in: query
          description: Id of a gateway key, exact. An unknown id answers an empty list.
          schema: { type: string }
        - name: kind
          in: query
          description: '`models` for model requests only, `tools` for tool calls only; absent for both. Anything else is 400.'
          schema: { type: string, enum: [models, tools] }
        - name: q
          in: query
          description: Text the method, path, provider or model contains (case-sensitive).
          schema: { type: string }
        - name: status
          in: query
          schema: { type: integer, minimum: 100, maximum: 599 }
        - name: since
          in: query
          description: Only requests at or after this time.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Only requests at or before this time.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: At most this many. A larger number is cut to 1000.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: The captured requests, newest first; an empty list when there is none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InspectorEntry' }
              example:
                - { id: ins_ab12cd, service_id: 9f1c2a, ts: '2026-10-11T09:30:01Z', method: POST, path: /v1/chat/completions, status: 200, duration_ms: 0, bytes_in: 182, bytes_out: 941, cache: MISS, translated: '', dropped: [], provider: zai, model: burrow-smart, gateway_key_id: 4c9d1e7a }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/ai/requests/{requestID}/attempts:
    get:
      tags: [models]
      operationId: aiRequestAttemptsList
      x-burrow-permission: {kind: dashboard, any_of: ["ai:read:any"]}
      summary: What a gateway request tried (admin, dashboard session)
      description: |
        The attempt log of one request to /openai/v1, /ai/v1 or /anthropic,
        in the order the attempts were made. The id is the value of the
        Burrow-Request-Id response header; it contains a "/", which is sent
        as %2F.

        A log is kept only for requests that needed more than one attempt,
        skipped a target or did not succeed. Any other id, including one
        that was never issued, answers an empty list.

        The log covers the requests of every user and gateway key. It is
        read by a dashboard session of an admin; an automation token is
        refused with 403 whatever it declares.
      security:
        - CookieAuth: []
      parameters:
        - name: requestID
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
          description: Percent-encoded request id, without control characters.
      responses:
        '200':
          description: The attempts, by position. Not cached (Cache-Control no-store).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AIRequestAttempt' }
              example:
                - { position: 0, provider: zai, model: glm-5.1, status: 500, error_code: http_500, duration_ms: 812, ts: '2026-10-06T09:30:00Z' }
                - { position: 1, provider: openrouter, model: google/gemini-x, status: 200, error_code: '', duration_ms: 1403, ts: '2026-10-06T09:30:01Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Database backend status (v0.5.0 Task 15)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/database:
    get:
      tags: [database]
      operationId: databaseGet
      x-burrow-permission: {kind: needs, any_of: ["metrics:read"]}
      summary: Database backend status (driver, URL, alpha flag)
      description: |
        Returns the active database driver ("sqlite" or "postgres"), a
        credential-redacted form of the connection string, and whether the
        Postgres alpha flag is in effect. Gated by admin OR metrics:read.
        No I/O — reads the startup-time configuration captured in Deps.
      responses:
        '200':
          description: Database backend status.
          content:
            application/json:
              schema:
                type: object
                required: [driver, postgres_alpha, url_redacted]
                properties:
                  driver:
                    type: string
                    enum: [sqlite, postgres]
                    description: Active database backend driver.
                  postgres_alpha:
                    type: boolean
                    description: >
                      True when the Postgres backend is running in
                      experimental/alpha mode (BURROW_EXPERIMENTAL_POSTGRES_BACKEND=true).
                  url_redacted:
                    type: string
                    description: >
                      Credential-redacted connection string. For SQLite this is
                      the on-disk file path; for Postgres user:pass is replaced
                      with ****:****.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
