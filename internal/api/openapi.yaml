            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/settings/retention:
    get:
      tags: [settings]
      operationId: retentionSettingsGet
      x-burrow-permission: {kind: needs, any_of: ["settings:manage"]}
      summary: Get retention settings (admin)
