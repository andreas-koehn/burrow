      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedactionSettingsInput' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/redaction/preview:
    post:
      tags: [redaction]
      operationId: redactionPreview
      summary: Preview redaction of a sample payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: The text to scan, at most 1 MiB. An empty text has no match.
                scope: { type: string, enum: [request_body, response_body, both], default: request_body }
      responses:
        '200':
          description: Preview result.
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      required: [rule, start, end, value]
                      properties:
                        rule: { type: string, description: Name of the rule that matched. }
                        start: { type: integer, description: Byte offset of the match in body. }
                        end: { type: integer, description: Byte offset after the match. }
                        value: { type: string, description: The matched text. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
