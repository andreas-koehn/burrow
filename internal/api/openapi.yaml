  /api/v1/redaction/settings:
    get:
      tags: [redaction]
      operationId: redactionSettingsGet
      summary: Get redaction settings
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedactionSettingsView' }
