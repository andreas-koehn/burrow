        Not a tool of the management MCP server (`/mcp/burrow`): an agent steered by untrusted text must not widen access, grant privileges, mint data-plane secrets into its context or plant a lasting instruction.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
