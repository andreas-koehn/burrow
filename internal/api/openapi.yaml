openapi: 3.0.3
info:
  title: Burrow JSON API
  description: |
    The hand-written canonical OpenAPI v3 description of the Burrow JSON API
    (unified across v0.2.0, v0.3.0, and v0.4.0).

    Coverage is locked by `TestOpenAPI_RouteCoverage` in
    `internal/api/openapi_test.go`: every route the chi mux answers must
    appear in this document or the build fails. Health probes (`/healthz`,
    `/readyz`) and the doc-serving endpoints (`/api/v1/openapi.{yaml,json}`)
    are excluded by convention.

    Schemas are intentionally minimal — the goal is shape coverage for SDK
    code-generators (TypeScript-fetch, Go), not exhaustive validation. Full
    schemas can be filled in incrementally without invalidating downstream
    SDKs (additive only).
  version: 0.4.0
  license:
    name: MIT
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost:8080
        description: Burrow control-plane host.

tags:
  - name: auth
    description: Session login, logout, password change, passkey enrolment.
  - name: users
    description: Admin user management.
  - name: roles
    description: Roles + permission catalog (editable custom roles).
  - name: sessions
    description: Per-user session list / revoke.
  - name: tokens
    description: Personal client tokens (burrowc connect).
  - name: tunnels
    description: Live tunnels owned by the caller.
  - name: services
    description: Durable per-service config (access mode, api-keys, policy, ip/geo, inspector, cache).
  - name: cache
    description: Exact-match prompt cache (settings, stats, purge).
  - name: redaction
    description: PII / secret redaction rules + preview.
  - name: guardrails
    description: Prompt-injection guardrails settings.
  - name: models
    description: Model alias registry.
  - name: rate-limits
    description: Quota + rate-limit CRUD and usage.
  - name: cost
    description: Cost pricing + budgets + summary / export.
  - name: inspector
    description: Per-service request inspector (ring buffer, replay, SSE).
  - name: audit
    description: Audit log events + chain verify / export / fingerprint.
  - name: webhooks
    description: Outbound HMAC webhooks (CRUD + deliveries + test/pause/resume).
  - name: automation
    description: Bearer-token automation API.
  - name: backups
    description: Backup / restore JSON API.
  - name: geo
    description: Global geo lookup status.
  - name: settings
    description: Admin settings (config + SMTP test + retention).
  - name: clients
    description: Live client (control session) overview.
  - name: events
    description: Server-sent events stream (dashboard refresh).
  - name: metrics
    description: Prometheus 0.0.4 scrape endpoint.
  - name: openapi
    description: OpenAPI spec discovery and embedded browser viewer.
  - name: database
    description: Database backend status (driver, connection URL, alpha flag).

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: burrow_session
      description: |
        Session cookie issued by POST /api/v1/auth/login. State-changing
        cookie-authed requests MUST also send the burrow_csrf double-submit
        header (`X-CSRF-Token`).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bua_<token>
      description: |
        Automation bearer token (`Authorization: Bearer bua_...`). Bypasses
        CSRF (the token IS the CSRF defense). Permissions are the
        intersection of the user's current role and the set declared at
        mint time.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit token for cookie-authed state-changing requests.
        Value mirrors the burrow_csrf cookie.

  schemas:
    AIProvider:
      type: object
      description: >
        One model provider: a slug under which a model backend is served at
        base_url. Identity fields come from the providers table; model_alias,
        concrete_model, backend_type, api_key_count, status and the 24h
        counts are read live from the backing service. latency_p95_ms is
        always 0.
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
        name: { type: string }
        kind: { type: string, enum: [tunnel, direct] }
        api_format: { type: string, enum: [openai, anthropic] }
        service_id:
          type: string
          description: >
            The backing service. For a direct provider this is its own row
            of type "direct", named like the provider; it holds the
            provider's API keys and AI configuration and is not listed by
            GET /api/v1/services. Its upstream-credential and domains routes
            answer 409, like its slug and access-mode routes.
        base_url:
          type: string
          description: >
            https://<auth_domain>/ai/<provider>/v1, or "" when the relay has
            no auth domain.
        upstream_base_url:
          type: string
          description: Direct providers only. Where the relay sends requests; "" for a tunnel provider.
          example: https://openrouter.ai/api/v1
        credential_slot:
          type: string
          description: >
            Direct providers only. Name of the vault slot that holds the
            upstream credential. The credential itself is configured on the
            relay and is never accepted or returned by this API.
          example: OPENROUTER
        credential_present:
          type: boolean
          description: Whether the vault slot holds a value.
        auth_header:
          type: string
          description: >
            Direct providers, admin callers only. The request header that
            carries the credential upstream. Left out for other callers and
            for tunnel providers.
          example: Authorization
        auth_format:
          type: string
          description: >
            Direct providers, admin callers only. The header value with the
            literal placeholder {key} where the relay puts the credential;
            the credential itself is never part of it.
          example: 'Bearer {key}'
        extra_header_names:
          type: array
          items: { type: string }
          description: >
            Direct providers, admin callers only. Names, sorted, of the
            static headers the relay adds to every upstream request; []
            when there are none. The values are write-only: they are set
            with extra_headers in the request body and never returned.
        billing: { type: string, enum: [metered, flat] }
        model_count:
          type: integer
          description: Number of entries in the provider's stored model list.
        model_alias: { type: string }
        concrete_model: { type: string }
        backend_type: { type: string, enum: [ollama, vllm, openai-compat, other] }
        api_key_count: { type: integer }
        requests_24h: { type: integer }
        cache_hits_24h: { type: integer }
        latency_p95_ms: { type: integer }
        status:
          type: string
          enum: [Connected, Degraded, Offline]
          description: >
            Tunnel provider: whether its client is connected. Direct provider:
            Connected when the credential slot is set, Offline otherwise.
        client_session_id: { type: string }
    AIProviderUpstream:
      type: object
      description: >
        Upstream settings of a direct provider. There is no field for the
        credential: credential_slot names a vault slot whose value is
        configured on the relay.
      properties:
        api_format: { type: string, enum: [openai, anthropic], default: openai }
        base_url:
          type: string
          maxLength: 2048
          description: >
            https URL of the upstream API, without credentials, query or
            fragment. Unless the relay allows private upstreams, a host that
            is or resolves to a private, loopback or link-local address is
            refused.
          example: https://openrouter.ai/api/v1
        credential_slot:
          type: string
          pattern: '^[A-Z0-9_]{1,32}$'
          example: OPENROUTER
        auth_header:
          type: string
          default: Authorization
          description: Header that carries the credential. An RFC 7230 token; not a hop-by-hop or forwarding header.
        auth_format:
          type: string
          maxLength: 128
          default: 'Bearer {key}'
          description: Value of the auth header. Must contain "{key}" exactly once; no control characters.
        extra_headers:
          type: object
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 512 }
          description: >
            Static headers sent with every upstream request; at most 16 and
            4096 bytes in total. Names are RFC 7230 tokens, values carry no
            control characters. Refused names: Host, Content-Length,
            Transfer-Encoding, Connection, Keep-Alive, TE, Trailer, Upgrade,
            Proxy-*, Authorization, X-Api-Key, Cookie, Forwarded,
            X-Forwarded-* and the auth header itself. Values are not returned
            by any endpoint.
          example: { X-Title: Burrow }
        billing: { type: string, enum: [metered, flat], default: metered }
    AIProviderModel:
      type: object
      description: One entry of a provider's stored model list.
      properties:
        id: { type: string, maxLength: 200, example: google/gemini-x }
        display_name: { type: string, maxLength: 200 }
        context_length: { type: integer, format: int64, minimum: 0 }
        synced_at: { type: string, format: date-time }
    EndpointMetrics:
      type: object
      description: >
        Metering aggregates for one AI provider over the trailing 24 h.  All
        numeric fields are zeroed pending usage_events aggregation.
      properties:
        requests_24h: { type: integer }
        tokens_in_24h: { type: integer }
        tokens_out_24h: { type: integer }
        cost_usd_24h: { type: number, format: double }
        cache_hit_ratio_24h: { type: number, format: double }
        requests_per_minute:
          type: array
          items: { type: integer }
          description: 60-element array — one bucket per minute over the trailing hour.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
    Empty:
      type: object
      description: Empty JSON object response.
    OK:
      type: object
      properties:
        ok:
          type: boolean
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
    Service:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [http, tcp] }
        slug:
          type: string
          description: URL segment of an http service; empty for tcp or until one is assigned.
        url:
          type: string
          description: Public address, `https://<auth_domain>/svc/<slug>/`; empty without a slug or auth domain.
        access_mode: { type: string }
        remote_port: { type: integer }
        local_addr: { type: string }
        connected: { type: boolean }
    Tunnel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [http, tcp] }
        remote_port: { type: integer }
        local_addr: { type: string }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        connected: { type: boolean }
        url:
          type: string
          description: Public address of an http tunnel, `https://<auth_domain>/svc/<slug>/`; omitted for tcp.
    Session:
      type: object
      properties:
        id: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
    Token:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    AccessModeReq:
      type: object
      required: [mode]
      properties:
        mode: { type: string }
        header: { type: string }
        mtls_ca_pem: { type: string }
    ConnectionLog:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [control, http_proxy, tcp_proxy] }
        service_id: { type: string }
        tunnel_id: { type: string }
        user_id: { type: string }
        client_session_id: { type: string }
        source_ip: { type: string }
        user_agent: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        status: { type: string, enum: [closed_clean, closed_error, closed_idle, rejected] }
        reason: { type: string }
    ConnectionLogRollup:
      type: object
      properties:
        day: { type: string, format: date }
        service_id: { type: string }
        kind: { type: string }
        sessions: { type: integer, format: int64 }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        avg_duration_ms: { type: integer, format: int64 }
        p95_duration_ms: { type: integer, format: int64 }

  responses:
    Unauthorized:
      description: Missing / invalid session or bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but the caller lacks permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string }
    PathServiceID:
      name: serviceID
      in: path
      required: true
      schema: { type: string }

# Default security: cookie+CSRF or bearer. Individual public routes override
# with `security: []`.
security:
  - CookieAuth: []
    CSRFToken: []
  - BearerAuth: []

paths:
  # ────────────────────────────────────────────────────────────────────────
  # Prometheus scrape (outside /api/v1 by convention; gated by metrics:read)
  # ────────────────────────────────────────────────────────────────────────
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus 0.0.4 scrape (closed metric set)
      description: |
        Returns the Burrow closed-metric set in Prometheus text exposition
        format. Gated by admin OR the `metrics:read` permission.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Auth (login is public; everything else requires a session)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session cookie issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Rate-limited (per-IP or global).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Clear the session cookie
      responses:
        '204': { description: Session cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change the caller's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [auth]
      summary: Current authenticated principal
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Sessions
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: List the caller's active sessions
      responses:
        '200':
          description: List of session records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/{id}:
    delete:
      tags: [sessions]
      summary: Revoke one of the caller's sessions
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/revoke-all:
    post:
      tags: [sessions]
      summary: Revoke every session except the current one
      responses:
        '200':
          description: Count of sessions revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Tokens (personal client tokens)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/tokens:
    get:
      tags: [tokens]
      summary: List the caller's client tokens
      responses:
        '200':
          description: List of tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tokens]
      summary: Issue a new client token (plaintext returned ONCE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tokens/{id}:
    delete:
      tags: [tokens]
      summary: Revoke a client token
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Token revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Tunnels (live runtime view) + v0.2 back-compat access-mode setter
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/tunnels:
    get:
      tags: [tunnels]
      summary: List the caller's live tunnels
      responses:
        '200':
          description: List of tunnels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tunnel' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tunnels/{id}/access-mode:
    put:
      tags: [tunnels]
      summary: Set tunnel access mode (v0.2 back-compat — delegates to services)
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessModeReq' }
      responses:
        '204': { description: Access mode set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The mode is not available on this relay or for this service (mTLS needs host routing). }

  # ────────────────────────────────────────────────────────────────────────
  # Services
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/services:
    get:
      tags: [services]
      summary: List services visible to the caller
      description: |
        The backing rows of direct AI providers (type "direct") are not
        listed; they are managed under /api/v1/ai/providers. Their API keys
        and AI configuration are reachable through the service endpoints by
        id, while a change of slug or access mode answers 409.
      responses:
        '200':
          description: List of services.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [services]
      summary: Admin pre-provisions a service row (v0.5.2)
      description: |
        Inserts a services row exactly as supplied so dashboard / e2e flows
        can target a known service_id before any client connects. Permission:
        admin. Audit: `service.create` with payload `{by_admin: true}`.
        Client-side `RegisterService` continues to upsert against the same
        row when the client subsequently connects with the same `service_id`.
      operationId: postService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id]
              properties:
                service_id:  { type: string, pattern: '^[a-z0-9_-]{3,64}$' }
                title:       { type: string, maxLength: 120 }
                access_mode: { type: string, enum: [public, open, api_key, burrow_login] }
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
                  description: Optional. Generated when the client first connects if omitted.
      responses:
        '201':
          description: Service row created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string }
                  slug:       { type: string }
                  created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: service_id or slug already in use. }

  /api/v1/services/slug-suggestion:
    get:
      tags: [services]
      summary: Suggest a slug no service uses
      description: A suggestion only; uniqueness is enforced when the slug is saved.
      responses:
        '200':
          description: A free slug.
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}:
    get:
      tags: [services]
      summary: Service detail (config + live state)
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: Service detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{serviceID}/access-mode:
    put:
      tags: [services]
      summary: Set the service's access mode
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessModeReq' }
      responses:
        '204': { description: Access mode set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The mode is not available on this relay or for this service (mTLS needs host routing). }

  /api/v1/services/{serviceID}/slug:
    put:
      tags: [services]
      summary: Change the service's slug
      description: The old URL stops working immediately; there is no redirect.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
      responses:
        '200':
          description: Slug changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  url:  { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Slug already in use. }

  /api/v1/services/{serviceID}/api-keys:
    get:
      tags: [services]
