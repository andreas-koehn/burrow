version: "2"

linters:
  enable:
    - gosec
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # gosec is noisy on test fixtures (weak RNG, file perms, etc.). Tests are
      # not an attack surface; suppress gosec there entirely.
      - linters:
          - gosec
        path: _test\.go
      # errcheck on tests: unchecked SetReadDeadline/Decode/WriteFile/Rollback/
      # Unmarshal in *_test.go is intentional test setup; a failure there fails
      # the test loudly anyway. Suppress errcheck only in test files.
      - linters:
          - errcheck
        path: _test\.go
      # revive "exported stutter" on three established public type names
      # (audit.AuditDB, connlog.ConnLogQuery, route.RouteContext). Renaming
      # exported types is invasive and breaks references for no behavioral gain;
      # the old v1 config treated `exported` as advisory (severity: warning).
      - linters:
          - revive
        text: "stutters; consider calling this"
      # ---------------------------------------------------------------------
      # gosec rule exclusions — each confirmed a false positive / accepted risk
      # for this codebase (see justification per rule).
      # ---------------------------------------------------------------------
      # G101: "hardcoded credentials" fires on permission-string constants in
      # internal/authz (e.g. "tokens:manage:own"). These are RBAC permission
      # identifiers, not secrets.
      - linters:
          - gosec
        text: "G101"
      # G115: integer-overflow conversions. All flagged sites are bounded,
      # safe conversions (frame sizes already range-checked, ULID byte slicing,
      # argon2 length casts, byte-counter widening). No real overflow risk.
      - linters:
          - gosec
        text: "G115"
      # G404: weak (math/rand) RNG. Used only for backoff jitter and route
      # load-balancing selection — non-security contexts where crypto/rand is
      # unnecessary overhead.
      - linters:
          - gosec
        text: "G404"
      # G201/G202: SQL string building. All flagged sites concatenate a fixed
      # set of internal, non-user-controlled fragments (column-name WHERE joins
      # with `?` placeholders for values; a switch-bounded datetime() boundary).
      # No user-controlled input reaches the SQL text.
      - linters:
          - gosec
        text: "G20[12]"
      # G705: "XSS via taint analysis". Both sites write non-HTML payloads:
      # a JSON ai-config blob (Content-Type: application/json) and the upstream
      # response body passed straight through the reverse proxy. Neither renders
      # untrusted data as HTML.
      - linters:
          - gosec
        text: "G705"
      # G124: cookie missing Secure/HttpOnly/SameSite. False positive — the
      # flagged http.Cookie literals DO set HttpOnly, SameSite=Lax, and Secure
      # (gated on the server's TLS flag, matching the dashboard cookie policy).
      - linters:
          - gosec
        text: "G124"
      # G110: decompression-bomb DoS in the backup *restore* path. Restore is an
      # admin-only operation over an operator-supplied archive; the input is
      # already trusted at that trust boundary.
      - linters:
          - gosec
        text: "G110"
      # G120: unbounded multipart form parse. Same backup-restore admin-only
      # path; ParseMultipartForm is already capped at 32 MiB at the call site.
      - linters:
          - gosec
        text: "G120"
      # G118: goroutine uses context.Background while a request context is
      # available. The exact-cache write-back callback is intentionally
      # detached from the request lifecycle so the cache is populated even if
      # the originating request is cancelled.
      - linters:
          - gosec
        text: "G118"
    paths:
      - third_party$
      - builtin$
      - examples$
      # web/node_modules ships gitignored, vendored stray .go files that are
      # not part of this module (absent in CI's clean checkout).
      - web/node_modules

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - web/node_modules
