openapi: 3.0.3
info:
  title: Burrow JSON API
  description: |
    The hand-written canonical OpenAPI v3 description of the Burrow JSON API
    (unified across v0.2.0, v0.3.0, and v0.4.0).

    Coverage is locked by `TestOpenAPI_RouteCoverage` in
    `internal/api/openapi_test.go`: every route the chi mux answers must
    appear in this document or the build fails. Health probes (`/healthz`,
    `/readyz`) and the doc-serving endpoints (`/api/v1/openapi.{yaml,json}`)
    are excluded by convention.

    Schemas are intentionally minimal — the goal is shape coverage for SDK
    code-generators (TypeScript-fetch, Go), not exhaustive validation. Full
    schemas can be filled in incrementally without invalidating downstream
    SDKs (additive only).
  version: 0.4.0
  license:
    name: MIT
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost:8080
        description: Burrow control-plane host.

tags:
  - name: auth
    description: Session login, logout, password change, passkey enrolment.
  - name: users
    description: Admin user management.
  - name: roles
    description: Roles + permission catalog (editable custom roles).
  - name: sessions
    description: Per-user session list / revoke.
  - name: tokens
    description: Personal client tokens (burrowc connect).
  - name: tunnels
    description: Live tunnels owned by the caller.
  - name: services
    description: Durable per-service config (access mode, api-keys, policy, ip/geo, inspector, cache).
  - name: cache
    description: Exact-match prompt cache (settings, stats, purge).
  - name: redaction
    description: PII / secret redaction rules + preview.
  - name: guardrails
    description: Prompt-injection guardrails settings.
  - name: models
    description: AI providers, synthetic models and gateway keys.
  - name: rate-limits
    description: Quota + rate-limit CRUD and usage.
  - name: cost
    description: Cost pricing + budgets + summary / export.
  - name: inspector
    description: Per-service request inspector (ring buffer, replay, SSE).
  - name: audit
    description: Audit log events + chain verify / export / fingerprint.
  - name: webhooks
    description: Outbound HMAC webhooks (CRUD + deliveries + test/pause/resume).
  - name: automation
    description: Bearer-token automation API.
  - name: backups
    description: Backup / restore JSON API.
  - name: geo
    description: Global geo lookup status.
  - name: settings
    description: Admin settings (config + SMTP test + retention).
  - name: clients
    description: Live client (control session) overview.
  - name: events
    description: Server-sent events stream (dashboard refresh).
  - name: metrics
    description: Prometheus 0.0.4 scrape endpoint.
  - name: openapi
    description: OpenAPI spec discovery and embedded browser viewer.
  - name: database
    description: Database backend status (driver, connection URL, alpha flag).

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: burrow_session
      description: |
        Session cookie issued by POST /api/v1/auth/login. State-changing
        cookie-authed requests MUST also send the burrow_csrf double-submit
        header (`X-CSRF-Token`).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: bua_<token>
      description: |
        Automation bearer token (`Authorization: Bearer bua_...`). Bypasses
        CSRF (the token IS the CSRF defense). Permissions are the
        intersection of the user's current role and the set declared at
        mint time.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit token for cookie-authed state-changing requests.
        Value mirrors the burrow_csrf cookie.

  schemas:
    AIProvider:
      type: object
      description: >
        One model provider: a slug under which a model backend is served at
        base_url. Identity fields come from the providers table;
        api_key_count, status and the 24h counts are read live from the
        backing service. latency_p95_ms is always 0.
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
        name: { type: string }
        kind: { type: string, enum: [tunnel, direct] }
        api_format: { type: string, enum: [openai, anthropic] }
        service_id:
          type: string
          description: >
            The backing service. For a direct provider this is its own row
            of type "direct", named like the provider; it holds the
            provider's API keys and AI configuration and is not listed by
            GET /api/v1/services. Its upstream-credential and domains routes
            answer 409, like its slug and access-mode routes.
        base_url:
          type: string
          description: >
            https://<auth_domain>/ai/<provider>/v1, or "" when the relay has
            no auth domain.
        upstream_base_url:
          type: string
          description: Direct providers only. Where the relay sends requests; "" for a tunnel provider.
          example: https://openrouter.ai/api/v1
        credential_slot:
          type: string
          description: >
            Direct providers only. Name of the vault slot that holds the
            upstream credential. The credential itself is configured on the
            relay and is never accepted or returned by this API.
          example: OPENROUTER
        credential_present:
          type: boolean
          description: >
            Whether the vault holds a value for the slot. For a provider
            with several slots: whether it holds one for every slot.
        credential_slots:
          type: array
          readOnly: true
          description: >
            The slots credential_slot names, in the order they are tried,
            each with whether the vault holds a value for it. Never the
            value. Empty for a tunnel provider.
          items:
            type: object
            properties:
              slot: { type: string, example: ZAI }
              present: { type: boolean }
        breaker_open:
          type: boolean
          readOnly: true
          description: >
            Whether the gateway is skipping the provider right now because
            recent requests to it failed. It is tried again automatically
            after a short pause; reading this field does not start that
            trial. The state is kept in memory and starts closed after a
            restart.
        auth_header:
          type: string
          description: >
            Direct providers, admin callers only. The request header that
            carries the credential upstream. Left out for other callers and
            for tunnel providers.
          example: Authorization
        auth_format:
          type: string
          description: >
            Direct providers, admin callers only. The header value with the
            literal placeholder {key} where the relay puts the credential;
            the credential itself is never part of it.
          example: 'Bearer {key}'
        extra_header_names:
          type: array
          items: { type: string }
          description: >
            Direct providers, admin callers only. Names, sorted, of the
            static headers the relay adds to every upstream request; []
            when there are none. The values are write-only: they are set
            with extra_headers in the request body and never returned.
        billing: { type: string, enum: [metered, flat] }
        supports_responses:
          type: boolean
          description: >
            Whether the provider offers the OpenAI Responses API
            (POST /responses), as its operator stated; nothing probes the
            upstream. While it is false, POST /openai/v1/responses (and
            /ai/v1/responses) for a model of this provider answers 400
            endpoint_unsupported without calling the provider. The
            provider's own path, /ai/<provider>/v1/responses, is passed
            through whatever this says. Always false for a provider whose
            api_format is anthropic.
        max_concurrent:
          type: integer
          minimum: 0
          maximum: 1000
          description: >
            How many requests the provider serves at once; 0 means no limit.
            The limit covers every way to the provider: /ai/<provider>/…
            (POST requests) and the dialect endpoints, where each credential
            slot shares it. A request that finds no free place waits, for at
            most 60 seconds or the model's attempt timeout, whichever is
            shorter. When none comes free the next target of the model is
            tried; with none left the answer is 429 provider_busy with a
            Retry-After header. A change applies from the next request on;
            requests already being served are not interrupted.
        in_use:
          type: integer
          readOnly: true
          description: >
            How many of the max_concurrent places are taken at this moment.
            Always 0 while max_concurrent is 0.
        model_count:
          type: integer
          description: Number of entries in the provider's stored model list.
        model_alias:
          type: string
          description: >
            Name of the first synthetic model, by name, that targets this
            provider; empty when none does. (The field named a model alias
            before aliases became synthetic models.)
        concrete_model:
          type: string
          description: The model that synthetic model sends to this provider.
        backend_type:
          type: string
          enum: [other]
          description: Always "other"; kept for clients that read it.
        api_key_count: { type: integer }
        requests_24h: { type: integer }
        cache_hits_24h: { type: integer }
        latency_p95_ms: { type: integer }
        status:
          type: string
          enum: [Connected, Degraded, Offline]
          description: >
            Tunnel provider: whether its client is connected. Direct provider:
            Connected when the credential slot is set, Offline otherwise.
        client_session_id: { type: string }
    AIProviderUpstream:
      type: object
      description: >
        Upstream settings of a direct provider. There is no field for the
        credential: credential_slot names a vault slot whose value is
        configured on the relay.
      properties:
        api_format: { type: string, enum: [openai, anthropic], default: openai }
        base_url:
          type: string
          maxLength: 2048
          description: >
            https URL of the upstream API, without credentials, query or
            fragment. Unless the relay allows private upstreams, a host that
            is or resolves to a private, loopback or link-local address is
            refused.
          example: https://openrouter.ai/api/v1
        credential_slot:
          type: string
          pattern: '^[A-Z0-9_]{1,32}$'
          example: OPENROUTER
        auth_header:
          type: string
          default: Authorization
          description: Header that carries the credential. An RFC 7230 token; not a hop-by-hop or forwarding header.
        auth_format:
          type: string
          maxLength: 128
          default: 'Bearer {key}'
          description: Value of the auth header. Must contain "{key}" exactly once; no control characters.
        extra_headers:
          type: object
          maxProperties: 16
          additionalProperties: { type: string, maxLength: 512 }
          description: >
            Static headers sent with every upstream request; at most 16 and
            4096 bytes in total. Names are RFC 7230 tokens, values carry no
            control characters. Refused names: Host, Content-Length,
            Transfer-Encoding, Connection, Keep-Alive, TE, Trailer, Upgrade,
            Proxy-*, Authorization, X-Api-Key, Cookie, Forwarded,
            X-Forwarded-* and the auth header itself. Values are not returned
            by any endpoint.
          example: { X-Title: Burrow }
        billing: { type: string, enum: [metered, flat], default: metered }
        supports_responses:
          type: boolean
          description: >
            Whether the provider offers the OpenAI Responses API
            (POST /responses). Left out, it is false on create and keeps
            its stored value on update. true is refused with 400 unless
            api_format is openai; a provider cannot change to another
            format while it is true.
        max_concurrent:
          type: integer
          minimum: 0
          maximum: 1000
          description: >
            How many requests the provider serves at once; 0 means no limit.
            Left out, it is 0 on create and keeps its stored value on
            update. A value outside 0-1000 is refused with 400.
    AIModelTarget:
      type: object
      description: One provider and model a synthetic model can be sent to.
      required: [provider, model]
      properties:
        dialect:
          type: string
          enum: [openai, anthropic]
          description: >
            The API format the target is used for. It must equal the
            provider's api_format; left out of a request, it is filled in
            from the provider.
        provider:
          type: string
          description: Slug of an existing provider.
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: The provider's own model id. No control characters.
        available:
          type: boolean
          readOnly: true
          description: >
            Whether the target can be tried right now: its provider exists
            and speaks the target's dialect, the gateway is not skipping the
            provider (see breaker_open of the provider), and for a direct
            provider every credential slot is set, for a tunnel provider
            its client is connected. Responses only; a request that carries
            it is refused with 400.
    AIServingTarget:
      type: object
      nullable: true
      description: The target that answers right now; null when none is available.
      properties:
        provider: { type: string }
        model: { type: string }
    AIRequestAttempt:
      type: object
      description: >
        One attempt of a gateway request, as the attempt log holds it. It
        carries no credential, slot name, header or upstream body.
      properties:
        position:
          type: integer
          description: >
            The order the attempts were made in, from 0. Not the position
            of a target in the model's list: a provider with several
            credential slots is tried once per slot, and targets the
            endpoint does not fit are left out.
        provider: { type: string, description: Provider slug. }
        model: { type: string, description: The provider's own model id. }
        status:
          type: integer
          description: Upstream HTTP status; 0 when none was received.
        error_code:
          type: string
          description: >
            Empty for the attempt that answered. Otherwise http_<status>,
            timeout, no_response, busy, breaker_open, dialect_mismatch,
            client_closed, stream_aborted or panic.
        duration_ms: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
    AIModel:
      type: object
      description: >
        A synthetic model: a name that clients send as "model" on the
        gateway's endpoints and that resolves to an ordered list of provider
        targets per dialect. A request reaches only targets of its own
        dialect.
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,62}$'
          description: >
            Never contains "/". "v1" is reserved, and a name cannot equal a
            provider slug.
        description: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        fallback_on_rate_limit: { type: boolean }
        attempt_timeout_s:
          type: integer
          minimum: 1
          maximum: 600
          default: 60
          description: >
            How long one target may take to start its response before the
            next one is tried. A hosted provider (kind direct) gives up
            waiting for the response after 120 s whatever this value is; the
            attempt is then recorded as a timeout.
        total_timeout_s:
          type: integer
          minimum: 1
          maximum: 600
          default: 120
          description: Not shorter than attempt_timeout_s.
        targets:
          type: array
          minItems: 1
          maxItems: 16
          description: >
            At most 8 per dialect, and no target (dialect, provider and
            model) twice. Within one dialect the order is the order the
            targets are tried in.
          items: { $ref: '#/components/schemas/AIModelTarget' }
        dialects:
          type: array
          readOnly: true
          description: The formats the model is served in, sorted; derived from the targets.
          items: { type: string, enum: [anthropic, openai] }
        serving:
          type: object
          readOnly: true
          description: >
            Per dialect the model has a target in: the first target that is
            available, in the order they are tried, or null when none is or
            the model is disabled (requests for it are refused).
            A dialect without targets has no key. A request that carries
            this field is refused with 400.
          properties:
            openai: { $ref: '#/components/schemas/AIServingTarget' }
            anthropic: { $ref: '#/components/schemas/AIServingTarget' }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    AIGatewayKey:
      type: object
      description: >
        A gateway key as every response but its creation shows it. The key
        itself is stored as a hash and is never returned again.
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        key_prefix:
          type: string
          description: The first 8 characters of the key, for display.
          example: bgw_Ab3x
        user_id: { type: string, description: The owner. }
        allowed_models:
          type: array
          maxItems: 64
          description: >
            The models the key may use; empty means every model. An entry is
            a synthetic model name, "<provider>/<model>" or "<provider>/*".
          items: { type: string, maxLength: 264 }
        last_used: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    AIProviderModel:
      type: object
      description: One entry of a provider's stored model list.
      properties:
        id: { type: string, maxLength: 200, example: google/gemini-x }
        display_name: { type: string, maxLength: 200 }
        context_length: { type: integer, format: int64, minimum: 0 }
        synced_at: { type: string, format: date-time }
    EndpointMetrics:
      type: object
      description: >
        Metering aggregates for one AI provider over the trailing 24 h.  All
        numeric fields are zeroed pending usage_events aggregation.
      properties:
        requests_24h: { type: integer }
        tokens_in_24h: { type: integer }
        tokens_out_24h: { type: integer }
        cost_usd_24h: { type: number, format: double }
        cache_hit_ratio_24h: { type: number, format: double }
        requests_per_minute:
          type: array
          items: { type: integer }
          description: 60-element array — one bucket per minute over the trailing hour.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
    Empty:
      type: object
      description: Empty JSON object response.
    OK:
      type: object
      properties:
        ok:
          type: boolean
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
    Service:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [http, tcp] }
        slug:
          type: string
          description: URL segment of an http service; empty for tcp or until one is assigned.
        url:
          type: string
          description: Public address, `https://<auth_domain>/svc/<slug>/`; empty without a slug or auth domain, and empty while `gateway_only` is true.
        access_mode: { type: string }
        gateway_only:
          type: boolean
          description: When true the service is reachable through the AI gateway only; its `/svc/<slug>/` address and custom domains answer 404.
        remote_port: { type: integer }
        local_addr: { type: string }
        connected: { type: boolean }
    Tunnel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [http, tcp] }
        remote_port: { type: integer }
        local_addr: { type: string }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        connected: { type: boolean }
        url:
          type: string
          description: Public address of an http tunnel, `https://<auth_domain>/svc/<slug>/`; omitted for tcp and for a gateway-only service.
    Session:
      type: object
      properties:
        id: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
    Token:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    ClientLoginRequest:
      type: object
      description: >
        A client sign-in request as the dashboard shows it. hostname, os, arch,
        client_version and suggested_token_name were sent by the client: treat
        them as untrusted text. Holds neither the device code nor a token.
      required: [user_code, hostname, os, arch, client_version, source_ip, status, suggested_token_name, age_seconds, created_at, expires_at]
      properties:
        user_code: { type: string, example: "ABCD-EFGH" }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        client_version: { type: string }
        source_ip: { type: string, description: Address the client started the request from, as the relay saw it. }
        status: { type: string, enum: [pending, approved, denied] }
        suggested_token_name: { type: string, description: The client's suggestion, else its hostname. }
        age_seconds: { type: integer, description: Seconds since the request was started, by the relay's clock. }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    AccessModeReq:
      type: object
      required: [mode]
      properties:
        mode: { type: string }
        header: { type: string }
        mtls_ca_pem: { type: string }
    ConnectionLog:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [control, http_proxy, tcp_proxy] }
        service_id: { type: string }
        tunnel_id: { type: string }
        user_id: { type: string }
        client_session_id: { type: string }
        source_ip: { type: string }
        user_agent: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        status: { type: string, enum: [closed_clean, closed_error, closed_idle, rejected] }
        reason: { type: string }
    ConnectionLogRollup:
      type: object
      properties:
        day: { type: string, format: date }
        service_id: { type: string }
        kind: { type: string }
        sessions: { type: integer, format: int64 }
        bytes_in: { type: integer, format: int64 }
        bytes_out: { type: integer, format: int64 }
        avg_duration_ms: { type: integer, format: int64 }
        p95_duration_ms: { type: integer, format: int64 }

  responses:
    Unauthorized:
      description: Missing / invalid session or bearer token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but the caller lacks permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string }
    PathServiceID:
      name: serviceID
      in: path
      required: true
      schema: { type: string }

# Default security: cookie+CSRF or bearer. Individual public routes override
# with `security: []`.
security:
  - CookieAuth: []
    CSRFToken: []
  - BearerAuth: []

paths:
  # ────────────────────────────────────────────────────────────────────────
  # Prometheus scrape (outside /api/v1 by convention; gated by metrics:read)
  # ────────────────────────────────────────────────────────────────────────
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus 0.0.4 scrape (closed metric set)
      description: |
        Returns the Burrow closed-metric set in Prometheus text exposition
        format. Gated by admin OR the `metrics:read` permission.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Auth (login is public; everything else requires a session)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Session cookie issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Rate-limited (per-IP or global).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Clear the session cookie
      responses:
        '204': { description: Session cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change the caller's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password }
      responses:
        '204': { description: Password changed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me:
    get:
      tags: [auth]
      summary: Current authenticated principal
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Sessions
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: List the caller's active sessions
      responses:
        '200':
          description: List of session records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/{id}:
    delete:
      tags: [sessions]
      summary: Revoke one of the caller's sessions
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Session revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/sessions/revoke-all:
    post:
      tags: [sessions]
      summary: Revoke every session except the current one
      responses:
        '200':
          description: Count of sessions revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Tokens (personal client tokens)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/tokens:
    get:
      tags: [tokens]
      summary: List the caller's client tokens
      responses:
        '200':
          description: List of tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Token' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tokens]
      summary: Issue a new client token (plaintext returned ONCE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Token created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tokens/{id}:
    delete:
      tags: [tokens]
      summary: Revoke a client token
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Token revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Tunnels (live runtime view) + v0.2 back-compat access-mode setter
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/tunnels:
    get:
      tags: [tunnels]
      summary: List the caller's live tunnels
      responses:
        '200':
          description: List of tunnels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tunnel' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tunnels/{id}/access-mode:
    put:
      tags: [tunnels]
      summary: Set tunnel access mode (v0.2 back-compat — delegates to services)
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessModeReq' }
      responses:
        '204': { description: Access mode set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The mode is not available on this relay or for this service (mTLS needs host routing). }

  # ────────────────────────────────────────────────────────────────────────
  # Services
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/services:
    get:
      tags: [services]
      summary: List services visible to the caller
      description: |
        The backing rows of direct AI providers (type "direct") are not
        listed; they are managed under /api/v1/ai/providers. Their API keys
        and AI configuration are reachable through the service endpoints by
        id, while a change of slug or access mode answers 409.
      responses:
        '200':
          description: List of services.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [services]
      summary: Admin pre-provisions a service row (v0.5.2)
      description: |
        Inserts a services row exactly as supplied so dashboard / e2e flows
        can target a known service_id before any client connects. Permission:
        admin. Audit: `service.create` with payload `{by_admin: true}`.
        Client-side `RegisterService` continues to upsert against the same
        row when the client subsequently connects with the same `service_id`.
      operationId: postService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id]
              properties:
                service_id:  { type: string, pattern: '^[a-z0-9_-]{3,64}$' }
                title:       { type: string, maxLength: 120 }
                access_mode: { type: string, enum: [public, open, api_key, burrow_login] }
                slug:
                  type: string
                  pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$'
                  description: Optional. Generated when the client first connects if omitted.
      responses:
        '201':
          description: Service row created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string }
                  slug:       { type: string }
                  created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: service_id or slug already in use. }

  /api/v1/services/slug-suggestion:
    get:
      tags: [services]
      summary: Suggest a slug no service uses
      description: A suggestion only; uniqueness is enforced when the slug is saved.
      responses:
        '200':
          description: A free slug.
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}:
    get:
      tags: [services]
      summary: Service detail (config + live state)
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: Service detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{serviceID}/access-mode:
    put:
      tags: [services]
      summary: Set the service's access mode
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessModeReq' }
      responses:
        '204': { description: Access mode set. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The mode is not available on this relay or for this service (mTLS needs host routing). }

  /api/v1/services/{serviceID}/slug:
    put:
      tags: [services]
      summary: Change the service's slug
      description: The old URL stops working immediately; there is no redirect.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
      responses:
        '200':
          description: Slug changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug: { type: string }
                  url:  { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Slug already in use. }

  /api/v1/services/{serviceID}/gateway-only:
    put:
      tags: [services]
      summary: Reach the service through the AI gateway only
      description: |
        With `gateway_only` true the service answers 404 at `/svc/<slug>/`, on
        its custom domains and on every other direct address, exactly like a
        service that does not exist. It stays reachable through the AI gateway
        (`/ai/<provider>/`, `/openai/v1`, `/anthropic`), where the provider's
        policy and key checks apply as before. Same permission as the other
        service settings. Audited as `service.gateway_only.update`.
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gateway_only]
              properties:
                gateway_only: { type: boolean }
      responses:
        '200':
          description: Setting stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway_only: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The service is not an http service, or backs a direct AI provider. }

  /api/v1/services/{serviceID}/api-keys:
    get:
      tags: [services]
      summary: List per-service API keys
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: List of api-key summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [services]
      summary: Mint a new per-service API key (plaintext returned ONCE)
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: Key created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  key: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/api-keys/{id}:
    delete:
      tags: [services]
      summary: Revoke a per-service API key
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - { $ref: '#/components/parameters/PathID' }
      responses:
        '204': { description: Key revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{serviceID}/access-policy:
    get:
      tags: [services]
      summary: Get the role allowlist for burrow_login access
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: List of role names.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [services]
      summary: Replace the role allowlist
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items: { type: string }
      responses:
        '204': { description: Policy updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/ip-geo:
    get:
      tags: [services]
      summary: Get per-service IP / Geo allow / deny rules
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: IP/Geo configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [services]
      summary: Replace per-service IP / Geo rules
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/cache/entries:
    delete:
      tags: [services, cache]
      summary: Purge per-service exact-cache entries
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: Count purged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/ai-config:
    get:
      tags: [services, cache]
      summary: Read per-service AI gateway configuration
      description: >
        Returns the stored service-level AI config blob, or an empty object
        ({}) when none has been written yet. Permission: service owner OR
        ai:configure:any (admin).
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: The stored AI config blob (or {} if unset).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [services, cache]
      summary: Store per-service AI gateway configuration
      description: >
        Persists the service-level AI config blob. Validates
        cache.semantic.min_similarity (must be in [0.0, 1.0]) and
        cache.semantic.embedding_mode (must be "local" or "none"). All
        other fields are stored as-is. Permission: service owner OR
        ai:configure:any (admin).
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────────────
  # Inspector (per-service ring buffer + replay + SSE)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/services/{serviceID}/inspector/requests:
    get:
      tags: [inspector]
      summary: List captured requests
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: List of request envelopes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/inspector/requests/{rid}:
    get:
      tags: [inspector]
      summary: Get a captured request envelope
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Request envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/services/{serviceID}/inspector/requests/{rid}/replay:
    post:
      tags: [inspector]
      summary: Re-fire the captured request through the proxy chain
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Replay result envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Replay engine unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/services/{serviceID}/inspector/requests/{rid}/replay-compare:
    post:
      tags: [inspector]
      summary: Replay and diff against the original response
      parameters:
        - { $ref: '#/components/parameters/PathServiceID' }
        - name: rid
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Diff envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/services/{serviceID}/inspector/stream:
    get:
      tags: [inspector]
      summary: SSE stream of newly-captured requests (no timeout, no CSRF)
      parameters: [ { $ref: '#/components/parameters/PathServiceID' } ]
      responses:
        '200':
          description: text/event-stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Cache (global settings + stats + purge)
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/cache/settings:
    get:
      tags: [cache]
      summary: Get prompt-cache settings
      responses:
        '200':
          description: Cache settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [cache]
      summary: Replace prompt-cache settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cache/stats:
    get:
      tags: [cache]
      summary: Cache hit / miss / size counters
      responses:
        '200':
          description: Stats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/cache/entries:
    delete:
      tags: [cache]
      summary: Purge ALL cache entries (admin / ai:configure:any)
      responses:
        '200':
          description: Count purged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cache/semantic/entries:
    delete:
      tags: [cache]
      summary: Purge ALL semantic cache entries (admin / ai:configure:any)
      description: >
        Clears the semantic similarity tier only; the exact-match cache is
        unaffected. In-memory chromem-go collections are also dropped so
        stale state does not survive until next process restart.
      responses:
        '204': { description: Cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Redaction
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/redaction/rules:
    get:
      tags: [redaction]
      summary: List redaction rules
      responses:
        '200':
          description: List of rules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [redaction]
      summary: Create a new redaction rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '201':
          description: Rule created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/redaction/rules/{id}:
    put:
      tags: [redaction]
      summary: Update a redaction rule
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [redaction]
      summary: Delete a redaction rule
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/redaction/settings:
    get:
      tags: [redaction]
      summary: Get redaction settings
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [redaction]
      summary: Replace redaction settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/redaction/preview:
    post:
      tags: [redaction]
      summary: Preview redaction of a sample payload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '200':
          description: Preview result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Guardrails
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/guardrails/settings:
    get:
      tags: [guardrails]
      summary: Get prompt-injection guardrail settings
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [guardrails]
      summary: Replace guardrail settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/guardrails/patterns:
    get:
      tags: [guardrails]
      summary: List bundled guardrail pattern names + descriptions
      responses:
        '200':
          description: List of patterns.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ────────────────────────────────────────────────────────────────────────
  # Rate limits
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/rate-limits:
    get:
      tags: [rate-limits]
      summary: List configured rate-limit rules
      description: >
        Each rule is {id, scope, subject, dimension, limit, burst, window}.
        scope is one of api_key, gateway_key, model, role, service, global.
        The subject of a gateway_key rule is the gateway key's id; that of a
        model rule is the model's name on the gateway endpoints (a synthetic
        model's name, or "<provider>/<model>", which also covers requests on
        /ai/<provider>/…), matched exactly; it holds across all keys.
        dimension is rpm
        (requests) or bpm (estimated bytes / 4); window is minute or day (a
        day runs from UTC midnight).
      responses:
        '200':
          description: List of rules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [rate-limits]
      summary: Create a rate-limit rule
      description: >
        Body {scope, subject, dimension, limit, burst, window}. scope is one
        of api_key, gateway_key, model, role, service, global; every scope
        but global needs a subject (at most 256 characters). Anything else is
        400, e.g. "scope must be one of
        api_key|gateway_key|model|role|service|global".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/rate-limits/usage:
    get:
      tags: [rate-limits]
      summary: Current rate-limit consumption per rule
      description: >
        The rules that apply to one subject, each with used and
        reset_seconds. With scope=gateway_key the subject is a gateway key's
        id: its owner may ask, anyone else needs quotas:read:any (403
        otherwise, the same for a key that does not exist). With scope=model
        the usage is that of every key, so quotas:read:any is required.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [api_key, gateway_key, model, role, service, global]
        - name: subject
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Usage rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/rate-limits/{id}:
    put:
      tags: [rate-limits]
      summary: Update a rate-limit rule
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [rate-limits]
      summary: Delete a rate-limit rule
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────────────────────────────────────────────────────
  # Cost
  # ────────────────────────────────────────────────────────────────────────
  /api/v1/cost/pricing:
    get:
      tags: [cost]
      summary: Get the model-pricing table
      responses:
        '200':
          description: Pricing rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [cost]
      summary: Replace the pricing table (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cost/summary:
    get:
      tags: [cost]
      summary: Aggregated cost summary
      description: >
        Admin, or a role with quotas:read:any. The body is {window,
        total_usd, tokens_in, tokens_out, top_consumers, pct_of_budget}. With
        group_by it also carries group_by and groups: one {key, requests,
        tokens_in, tokens_out, usd} per gateway key (key = the key's id),
        model (the name clients asked for; a request on /ai/<provider>/… is
        recorded as "<provider>/<model>"), provider (slug), target_model
        ("<provider>/<model>" that answered) or dialect. Groups are sorted by
        usd descending, then key; the group with the empty key comes last and
        holds the traffic the dimension does not apply to, plus whatever lies
        beyond the first 200 groups. A request answered by a fallback target
        counts for the model the client asked for and the provider that
        answered. A row is priced by the cost its upstream reported, else by
        the price table entry "<provider>/<target model>", then the target
        model, then the request kind. Prompt-cache tokens of an Anthropic
        answer count as input tokens.
      parameters:
        - name: window
          in: query
          description: today is the current UTC day; week, month and year are the last 7, 30 and 365 days.
          schema:
            type: string
            enum: [today, week, month, year]
            default: today
        - name: group_by
          in: query
          schema:
            type: string
            enum: [gateway_key, model, provider, target_model, dialect]
      responses:
        '200':
          description: Summary rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '400':
          description: >
            "window must be one of today|week|month|year" or "group_by must be
            one of gateway_key|model|provider|target_model|dialect".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cost/export:
    get:
      tags: [cost]
      summary: CSV export of cost data
      description: >
        One row per (service, service key, kind, gateway key, dialect,
        provider, requested model, target model) of the window, as ndjson
        (format=ndjson, the default) or CSV (format=csv). The route columns
        gateway_key_id, dialect, provider, requested_model, target_model and
        requests follow the token and byte columns; they are empty for
        traffic that did not come through a gateway key.
      responses:
        '200':
          description: CSV.
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/budgets:
    get:
      tags: [cost]
      summary: List budgets (admin)
      description: >
        Each budget is {id, scope, subject_id, daily_usd, daily_tokens,
        action_on_exceed, alert_webhook_id, current_usd, current_tokens,
        exceeded}. scope is one of api_key, service, user, global,
        gateway_key (subject_id = the gateway key's id) and model (subject_id
        = the model's name on the gateway endpoints: a synthetic model's name
        or "<provider>/<model>"; a request on /ai/<provider>/… counts for
        "<provider>/<model>" too, and a budget on a synthetic name counts
        only requests that asked for that name). daily_tokens caps input plus
        output tokens per UTC day; 0 means no token cap. A budget with a
        token cap is exceeded when current_tokens is above it, or when it
        also has a daily_usd above 0 and current_usd is above that; a budget
        without one is exceeded when current_usd is above daily_usd. A
        gateway_key or model budget whose action is throttle_zero or
        disable_key stops requests at the gateway while it is exceeded: 429
        budget_exceeded with Retry-After until UTC midnight, before any
        provider is called (disable_key on a gateway_key budget also revokes
        the key). A change takes up to 15 seconds to reach the gateway.
      responses:
        '200':
          description: List of budgets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [cost]
      summary: Create a budget
      description: >
        Body {scope, subject_id, daily_usd, daily_tokens, action_on_exceed,
        alert_webhook_id}. daily_usd and daily_tokens must not be negative
        and at least one must be above 0: a token cap alone is a complete
        budget (a flat-rate provider costs 0 USD). Every scope but global
        needs a subject_id of at most 256 characters. subject_id is taken as
        sent, never trimmed: 400 "subject_id must not have leading or
        trailing whitespace" or "subject_id must not contain control
        characters" otherwise. For scope gateway_key it must be the id of an
        existing gateway key (revoked or not, of any user): 400 "unknown
        gateway key" otherwise. For scope model it is the model's name on the
        gateway endpoints: a synthetic model's name, or "<provider>/<model>".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/budgets/{id}:
    put:
      tags: [cost]
      summary: Update a budget
      description: Same body and rules as creating one; every field is replaced.
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204': { description: Updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [cost]
      summary: Delete a budget
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

