          description: New backup metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/backups/{id}:
    delete:
      tags: [backups]
      summary: Delete a backup archive
      parameters: [ { $ref: '#/components/parameters/PathID' } ]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

